<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial 3D Environment Viewer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        #sidebar {
            width: 350px;
            background: #111827;
            border-right: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 20px;
            z-index: 10;
        }
        .brand { font-size: 16px; font-weight: 800; letter-spacing: 1px; color: #60a5fa; }
        .upload-section {
            border: 2px dashed #374151;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .upload-section:hover { border-color: #60a5fa; }
        input[type="file"] { display: none; }
        .upload-label { font-size: 13px; color: #9ca3af; cursor: pointer; display: block; }
        
        #chat-container {
            flex: 1;
            background: #1f2937;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            max-height: 250px;
            font-size: 13px;
        }
        .chat-message {
            padding: 8px 12px;
            border-radius: 8px;
            background: #374151;
            color: #d1d5db;
        }
        .chat-message.system { background: #1e3a8a; color: #93c5fd; }

        .chat-input-row { display: flex; gap: 8px; }
        input[type="text"] {
            flex: 1;
            background: #1f2937;
            border: 1px solid #374151;
            padding: 10px;
            border-radius: 8px;
            color: white;
            font-size: 13px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }
        button:hover { background: #1d4ed8; }

        #viewer-container {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        .stats-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(8px);
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 12px;
            color: #9ca3af;
        }
        .stats-overlay span { color: #60a5fa; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="sidebar">
        <div class="brand">SPATIAL 3D VIEWER</div>
        
        <div class="upload-section" onclick="document.getElementById('file-input').click()">
            <span class="upload-label">📂 Drop JSON Map or Click to Upload</span>
            <input type="file" id="file-input" accept=".json" onchange="handleFileUpload(event)">
        </div>

        <div class="stats-overlay" style="position: static; background: transparent; border: none; padding: 0;">
            Nodes Loaded: <span id="node-counter">0</span>
        </div>

        <div id="chat-container">
            <div class="chat-message system">System ready. Upload your Spatial Dash BufferGeometry JSON file to construct the 3D environment.</div>
        </div>

        <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="Ask AI about the map..." onkeypress="handleKeyPress(event)">
            <button onclick="sendChatMessage()">Send</button>
        </div>
    </div>

    <div id="viewer-container">
        <div class="stats-overlay">
            Status: <span id="render-status">Awaiting Dataset</span>
        </div>
        <canvas id="three-canvas"></canvas>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let pointsGroup;

        function init3D() {
            const container = document.getElementById('viewer-container');
            
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Ambient lighting & grid helper
            scene.add(new THREE.GridHelper(20, 20, 0x374151, 0x1f2937));
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));

            pointsGroup = new THREE.Group();
            scene.add(pointsGroup);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const container = document.getElementById('viewer-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    processEnvironmentData(data);
                } catch (err) {
                    appendChat("Error parsing JSON structure.", "system");
                }
            };
            reader.readAsText(file);
        }

        function processEnvironmentData(data) {
            let positions = [];

            // Compatibility check: Supports BufferGeometry format or legacy coordinate matrix formats
            if (data.data && data.data.attributes && data.data.attributes.position) {
                positions = data.data.attributes.position.array;
            } else if (data.coordinatesMatrix) {
                data.coordinatesMatrix.forEach(node => {
                    positions.push(parseFloat(node.x), parseFloat(node.y), parseFloat(node.z));
                });
            }

            if (positions.length === 0) {
                appendChat("No valid coordinate positions located in the JSON structure.", "system");
                return;
            }

            const totalNodes = positions.length / 3;
            document.getElementById('node-counter').innerText = totalNodes;
            document.getElementById('render-status').innerText = "Rendered Active";

            // Clear previous render nodes
            while(pointsGroup.children.length > 0){ 
                pointsGroup.remove(pointsGroup.children[0]); 
            }

            // Loop through flat array [x, y, z, x, y, z...] and place 3D point meshes
            for (let i = 0; i < positions.length; i += 3) {
                let x = positions[i];
                let y = positions[i + 1];
                let z = positions[i + 2];

                const sphereGeometry = new THREE.SphereGeometry(0.04, 8, 8);
                const material = new THREE.MeshBasicMaterial({ color: 0x3b82f6 });
                const sphere = new THREE.Mesh(sphereGeometry, material);
                sphere.position.set(x, y, z);
                pointsGroup.add(sphere);
            }

            const generatorName = data.metadata ? data.metadata.generator : (data.generator || 'Unknown Engine');
            appendChat(`Successfully loaded ${totalNodes} spatial nodes generated by ${generatorName}.`, "system");
        }

        function appendChat(text, sender = "") {
            const chatContainer = document.getElementById('chat-container');
            const msg = document.createElement('div');
            msg.className = `chat-message ${sender}`;
            msg.innerText = text;
            chatContainer.appendChild(msg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            appendChat(text);
            input.value = "";

            setTimeout(() => {
                const count = document.getElementById('node-counter').innerText;
                if (count === "0") {
                    appendChat("Please upload your BufferGeometry JSON environment file first.", "system");
                } else {
                    appendChat(`Analysis complete: Displaying ${count} mapped points in the 3D WebGL space viewport.`, "system");
                }
            }, 600);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendChatMessage();
        }

        window.onload = init3D;
    </script>
</body>
</html>
