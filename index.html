<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial Dash Pro – Condensed 4D Map Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #030712; color: #f3f4f6; font-family: system-ui, sans-serif; height: 100vh; display: flex; overflow: hidden; }
        #sidebar { width: 380px; background: #0b0f19; border-right: 1px solid #1f2937; display: flex; flex-direction: column; padding: 16px; gap: 12px; z-index: 10; overflow-y: auto; }
        .brand { font-size: 14px; font-weight: 800; color: #38bdf8; letter-spacing: 1px; }
        .card { background: rgba(17, 24, 39, 0.7); border: 1px solid #1f2937; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .title { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #94a3b8; }
        .btn-row { display: flex; gap: 6px; }
        button { flex: 1; padding: 8px; border-radius: 8px; border: none; font-weight: 600; font-size: 11px; cursor: pointer; transition: 0.2s; }
        .primary { background: #0284c7; color: white; }
        .primary:hover { background: #0369a1; }
        .danger { background: #dc2626; color: white; }
        .danger.active { background: #ea580c; }
        .secondary { background: #334155; color: #f1f5f9; }
        textarea { width: 100%; height: 60px; background: #1e293b; border: 1px solid #334155; padding: 6px; border-radius: 6px; color: #fff; font-family: monospace; font-size: 10px; resize: none; }
        #viewer { flex: 1; position: relative; background: #030712; }
        canvas { display: block; width: 100%; height: 100%; }
        .overlay { position: absolute; top: 12px; right: 12px; background: rgba(3, 7, 18, 0.85); padding: 8px 12px; border-radius: 6px; font-size: 11px; color: #94a3b8; border: 1px solid rgba(255,255,255,0.08); }
        .overlay span { color: #38bdf8; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="sidebar">
    <div class="brand">SPATIAL MAP PROCESSOR<br><span style="font-size:9px;color:#7dd3fc;">Condensed 4D Engine</span></div>
    
    <div class="card">
        <div class="title">Stream Control</div>
        <div class="btn-row">
            <button id="record-btn" class="danger" onclick="toggleScanning()">Record Stream</button>
            <button class="secondary" onclick="exportMapJSON()">Export Map</button>
        </div>
    </div>

    <div class="card">
        <div class="title">JSON Buffer Input</div>
        <textarea id="json-input" placeholder="Paste 3D Map / Sequence JSON payload..."></textarea>
        <button class="primary" onclick="parseAndLoadJSON()">Load Structured Payload</button>
    </div>

    <div class="card" style="flex:1;">
        <div class="title">Telemetry</div>
        <div style="font-size:11px; color:#cbd5e1;">
            Active Nodes: <span id="node-count">0</span><br>
            Frames Cached: <span id="frame-count">0</span>
        </div>
    </div>
</div>

<div id="viewer">
    <div class="overlay">
        Status: <span id="status">Ready</span>
    </div>
    <video id="webcam" autoplay playsinline muted style="display:none;"></video>
    <canvas id="canvas"></canvas>
</div>

<script>
    let scene, camera, renderer, pointCloud, faceMesh, cameraUtils;
    let isScanning = false, isPlayback = false;
    let sequenceBuffer = [], currentFrameIndex = 0;

    window.addEventListener('DOMContentLoaded', () => {
        init3D();
        initFaceMesh();
    });

    function init3D() {
        const container = document.getElementById('viewer');
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 0, 3.5);

        renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);

        const geometry = new THREE.BufferGeometry();
        const material = new THREE.PointsMaterial({ size: 0.02, vertexColors: true, transparent: true, opacity: 0.9 });
        pointCloud = new THREE.Points(geometry, material);
        scene.add(pointCloud);

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        if (isPlayback && sequenceBuffer.length > 0) {
            let frame = sequenceBuffer[currentFrameIndex];
            pointCloud.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(frame.vertices), 3));
            pointCloud.geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(frame.colors), 3));
            pointCloud.geometry.attributes.position.needsUpdate = true;
            pointCloud.geometry.attributes.color.needsUpdate = true;
            
            document.getElementById('node-count').innerText = (frame.vertices.length / 3).toLocaleString();
            currentFrameIndex = (currentFrameIndex + 1) % sequenceBuffer.length;
        }
        renderer.render(scene, camera);
    }

    function initFaceMesh() {
        const video = document.getElementById('webcam');
        faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

        faceMesh.onResults((results) => {
            if (!isScanning) return;
            if (results.multiFaceLandmarks?.length > 0) {
                let verts = [], colors = [];
                for (let pt of results.multiFaceLandmarks[0]) {
                    verts.push((pt.x - 0.5) * -3, (pt.y - 0.5) * -3, (pt.z || 0) * 3);
                    colors.push(0.1, 0.6, 1.0);
                }
                sequenceBuffer.push({ vertices: verts, colors: colors });
                document.getElementById('frame-count').innerText = sequenceBuffer.length;
                document.getElementById('node-count').innerText = verts.length / 3;
            }
        });

        cameraUtils = new Camera(video, {
            onFrame: async () => { if (isScanning) await faceMesh.send({ image: video }); },
            width: 640, height: 480
        });
        cameraUtils.start();
    }

    function toggleScanning() {
        isScanning = !isScanning;
        isPlayback = false;
        let btn = document.getElementById('record-btn');
        if (isScanning) {
            sequenceBuffer = [];
            btn.innerText = "Stop Recording";
            btn.classList.add("active");
            document.getElementById('status').innerText = "Recording Stream";
        } else {
            btn.innerText = "Record Stream";
            btn.classList.remove("active");
            document.getElementById('status').innerText = "Captured Ready";
            if (sequenceBuffer.length > 0) isPlayback = true;
        }
    }

    function parseAndLoadJSON() {
        let text = document.getElementById('json-input').value.trim();
        if (!text) return;
        try {
            let data = JSON.parse(text);
            let frames = data.frames ? data.frames.map(f => f.geometryStream) : (data.sequence || []);
            if (frames.length > 0) {
                sequenceBuffer = frames;
                isScanning = false;
                isPlayback = true;
                currentFrameIndex = 0;
                document.getElementById('frame-count').innerText = sequenceBuffer.length;
                document.getElementById('status').innerText = "Playing Payload";
            }
        } catch (e) {
            alert("Malformed JSON payload structure.");
        }
    }

    function exportMapJSON() {
        if (sequenceBuffer.length === 0) { alert("No sequence data cached."); return; }
        let payload = {
            version: "2.1",
            mapType: "CondensedSpatialMap",
            frames: sequenceBuffer.map((f, i) => ({ frameIndex: i, geometryStream: f }))
        };
        let blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
        let a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `spatial_map_${Date.now()}.json`;
        a.click();
    }
</script>
</body>
</html>
