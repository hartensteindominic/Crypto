<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HyperStream XD • 4D Quantum Holographic Portal</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #000;
  color: #00ffcc;
  font-family: 'Courier New', Courier, monospace;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#portal-container {
  position: relative;
  width: 90vw;
  max-width: 500px;
  height: 500px;
  border: 2px solid #00ffcc;
  border-radius: 20px;
  box-shadow: 0 0 30px rgba(0, 255, 204, 0.4), inset 0 0 30px rgba(0, 255, 204, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: radial-gradient(circle, #051b1a 0%, #000000 90%);
}
canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}
.hud {
  position: absolute;
  bottom: 20px;
  display: flex;
  gap: 10px;
  z-index: 10;
}
button {
  background: #00ffcc;
  color: #000;
  border: none;
  padding: 12px 20px;
  font-size: 14px;
  font-weight: bold;
  border-radius: 10px;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
  transition: 0.2s;
}
button:hover {
  background: #fff;
  box-shadow: 0 0 25px #fff;
}
.title {
  position: absolute;
  top: 20px;
  font-size: 16px;
  letter-spacing: 2px;
  text-shadow: 0 0 10px #00ffcc;
  z-index: 10;
  text-align: center;
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div class="title">HYPERSTREAM XD // 4D QUANTUM PORTAL</div>

<div id="portal-container">
  <canvas id="quantumCanvas"></canvas>
  <div class="hud">
    <button onclick="shiftDimension()">🌀 Shift 4D Phase</button>
    <button onclick="sharePortal()">🚀 Share Matrix</button>
  </div>
</div>

<script>
let scene, camera, renderer, crystal;
let dimensionSpeed = 0.01;

function init4D() {
  const container = document.getElementById('portal-container');
  
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.z = 4;

  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('quantumCanvas'), alpha: true, antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);

  // Create a hyper-dimensional 4D wireframe geometry / crystal matrix
  const geometry = new THREE.IcosahedronGeometry(1.5, 1);
  const material = new THREE.MeshBasicMaterial({
    color: 0x00ffcc,
    wireframe: true,
    transparent: true,
    opacity: 0.8
  });
  
  crystal = new THREE.Mesh(geometry, material);
  scene.add(crystal);

  // Inner core glow
  const coreGeometry = new THREE.SphereGeometry(0.7, 16, 16);
  const coreMaterial = new THREE.MeshBasicMaterial({ color: 0xff00ff, wireframe: true });
  const core = new THREE.Mesh(coreGeometry, coreMaterial);
  scene.add(core);

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  
  crystal.rotation.x += dimensionSpeed;
  crystal.rotation.y += dimensionSpeed * 1.5;
  
  // 4D breathing dimensional scale effect
  const time = Date.now() * 0.002;
  const scale = 1 + Math.sin(time) * 0.15;
  crystal.scale.set(scale, scale, scale);

  renderer.render(scene, camera);
}

function shiftDimension() {
  dimensionSpeed = dimensionSpeed === 0.01 ? 0.05 : (dimensionSpeed === 0.05 ? -0.03 : 0.01);
  crystal.material.color.setHex(Math.random() * 0xffffff);
}

function sharePortal() {
  const htmlContent = document.documentElement.outerHTML;
  const blob = new Blob([htmlContent], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  
  if (navigator.share) {
    navigator.share({
      title: 'HyperStream XD 4D Hologram',
      text: 'Step into this instant 4D holographic environment portal!',
      url: window.location.href
    }).catch(() => {});
  } else {
    const a = document.createElement('a');
    a.href = url;
    a.download = 'HyperStream_4D_Portal.html';
    a.click();
    alert('4D Portal bundle downloaded instantly! Send this file to anyone to let them view your environment.');
  }
}

window.onload = init4D;
</script>

</body>
</html>
