<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoloPocket • Instant 3D Scanner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#030712;color:#f8fafc;font-family:system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:#0f172a;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e293b}
h1{font-size:14px;font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,#38bdf8,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.toolbar{display:flex;gap:8px}
button{background:#7c3aed;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:11px;font-weight:700;cursor:pointer;transition:background .2s}
button:hover{background:#6d28d9}
button.sec{background:#1e293b;color:#cbd5e1}
button.sec:hover{background:#334155}
button.red{background:#dc2626}
#stage{flex:1;position:relative;background:#030712}
canvas{display:block;width:100%;height:100%}
video{display:none}
.overlay{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,0.85);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.1);padding:10px 16px;border-radius:20px;display:flex;gap:12px;align-items:center;font-size:11px;color:#94a3b8}
.overlay b{color:#38bdf8}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<header>
  <h1>✨ HOLOPOCKET 3D</h1>
  <div class="toolbar">
    <button id="scanBtn" onclick="toggleScan()">🔴 Start Scan</button>
    <button class="sec" onclick="takeSnapshot()">📸 Snapshot</button>
    <button class="sec" onclick="shareHolo()">📤 Share</button>
  </div>
</header>

<div id="stage">
  <video id="vid" autoplay playsinline muted></video>
  <canvas id="c3"></canvas>
  <div class="overlay">
    <span>Voxels: <b id="statCount">0</b></span>
    <span>•</span>
    <span id="statStatus">Camera Ready</span>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let scene, cam, ren, ctrl, video, stream, pointsObj;
let scanning = false, activeVertices = [];
let facing = 'user', frameCount = 0;

window.addEventListener('DOMContentLoaded', () => {
  init3D();
  initCamera(facing);
});

function init3D() {
  const stage = $('stage');
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x030712, 0.02);

  cam = new THREE.PerspectiveCamera(50, stage.clientWidth / stage.clientHeight, 0.1, 1000);
  cam.position.set(0, 0, 3.2);

  ren = new THREE.WebGLRenderer({ canvas: $('c3'), antialias: true });
  ren.setSize(stage.clientWidth, stage.clientHeight);
  ren.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  ctrl = new THREE.OrbitControls(cam, ren.domElement);
  ctrl.enableDamping = true;
  ctrl.autoRotate = true;
  ctrl.autoRotateSpeed = 1.0;

  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  
  window.addEventListener('resize', () => {
    cam.aspect = stage.clientWidth / stage.clientHeight;
    cam.updateProjectionMatrix();
    ren.setSize(stage.clientWidth, stage.clientHeight);
  });

  animate();
}

function initCamera(face) {
  if (stream) stream.getTracks().forEach(t => t.stop());
  video = $('vid');

  navigator.mediaDevices.getUserMedia({ video: { facingMode: face, width: 640, height: 480 }, audio: false })
    .then(s => {
      stream = s;
      video.srcObject = s;
      return video.play();
    })
    .then(() => $('statStatus').textContent = "Live Stream Active")
    .catch(() => $('statStatus').textContent = "Camera Error / Permission Denied");
}

function animate() {
  requestAnimationFrame(animate);
  ctrl.update();
  
  if (scanning && video.readyState >= 2) {
    sampleVideoFrame();
  }
  
  ren.render(scene, cam);
}

function sampleVideoFrame() {
  const canvas2d = document.createElement('canvas');
  canvas2d.width = 160; canvas2d.height = 120;
  const ctx = canvas2d.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(video, 0, 0, 160, 120);
  
  const imgData = ctx.getImageData(0, 0, 160, 120).data;
  const positions = [];
  const colors = [];

  for (let y = 0; y < 120; y += 3) {
    for (let x = 0; x < 160; x += 3) {
      const i = (y * 160 + x) * 4;
      const r = imgData[i] / 255, g = imgData[i+1] / 255, b = imgData[i+2] / 255;
      const lum = 0.299*r + 0.587*g + 0.114*b;
      
      if (lum > 0.1) {
        const nx = (x / 160) * 2 - 1;
        const ny = -((y / 120) * 2 - 1);
        const nz = (lum - 0.5) * 0.8;

        positions.push(nx * 1.5, ny * 1.2, nz);
        colors.push(r + 0.1, g + 0.2, b + 0.4);
      }
    }
  }

  activeVertices = positions;
  updateCloud(positions, colors);
  $('statCount').textContent = (positions.length / 3).toLocaleString();
}

function updateCloud(posArr, colArr) {
  if (pointsObj) scene.remove(pointsObj);

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(posArr, 3));
  geom.setAttribute('color', new THREE.Float32BufferAttribute(colArr, 3));

  const mat = new THREE.PointsMaterial({
    size: 0.025,
    vertexColors: true,
    transparent: true,
    opacity: 0.9
  });

  pointsObj = new THREE.Points(geom, mat);
  scene.add(pointsObj);
}

function toggleScan() {
  scanning = !scanning;
  const btn = $('scanBtn');
  if (scanning) {
    btn.textContent = '⏹ Stop Scan';
    btn.classList.add('red');
    $('statStatus').textContent = 'Mapping Hologram...';
  } else {
    btn.textContent = '🔴 Start Scan';
    btn.classList.remove('red');
    $('statStatus').textContent = 'Scan Paused';
  }
}

function takeSnapshot() {
  ren.render(scene, cam);
  const a = document.createElement('a');
  a.href = $('c3').toDataURL('image/png');
  a.download = 'hologram_snapshot.png';
  a.click();
}

function shareHolo() {
  const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  const blob = new Blob([htmlContent], { type: 'text/html' });
  const file = new File([blob], "HoloPocket_Experience.html", { type: "text/html" });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({
      title: 'HoloPocket 3D Environment',
      text: 'Check out this live 3D holographic scan!',
      files: [file]
    }).catch(() => {});
  } else {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'HoloPocket_Experience.html';
    a.click();
  }
}
</script>
</body>
</html>
