<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spatial Dash Pro - Condensed 4D Volumetric Map Scanner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #030303; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; height: 100vh; width: 100vw; }
        #camera-stream, #processing-canvas, #render-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #processing-canvas { display: none; }
        #render-container { display: none; z-index: 2; }
        #camera-stream.front-facing { transform: scaleX(-1); }
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; pointer-events: none; }
        .interactive { pointer-events: auto; }
        .hud-header, .hud-footer { background: rgba(15, 15, 15, 0.9); border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px); border-radius: 12px; padding: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; }
        .btn:hover { background: rgba(255, 255, 255, 0.2); }
        .btn-primary { background: #0a84ff; border: none; }
        .btn-danger { background: #ff453a; border: none; }
        .btn-success { background: #30d158; border: none; }
        .metrics { display: flex; gap: 12px; font-size: 11px; color: #888; }
        .metrics span { color: #0a84ff; font-weight: 700; }
        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); z-index: 10; display: none; justify-content: center; align-items: center; padding: 16px; }
        .modal-box { background: #151515; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 16px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; }
        .modal-box textarea { width: 100%; height: 120px; background: #0a0a0a; color: #0a84ff; border: 1px solid #333; border-radius: 6px; padding: 8px; font-family: monospace; font-size: 10px; resize: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
</head>
<body>

    <video id="camera-stream" autoplay playsinline muted></video>
    <canvas id="processing-canvas"></canvas>
    <div id="render-container"></div>

    <div id="modal" class="interactive">
        <div class="modal-box">
            <h3 id="modal-title" style="font-size:13px;">3D Map Payload</h3>
            <textarea id="modal-text" placeholder="Paste or view JSON here..."></textarea>
            <div style="display:flex; gap:6px;">
                <button id="modal-action-btn" class="btn btn-primary" style="flex:1;" onclick="modalAction()">Copy / Process</button>
                <button class="btn" style="background:#333;" onclick="toggleModal(false)">Close</button>
            </div>
        </div>
    </div>

    <div id="hud">
        <div class="hud-header interactive">
            <div style="font-weight:800; font-size:12px; letter-spacing:1px;">SPATIAL 4D</div>
            <div style="display:flex; gap:6px;">
                <button class="btn" onclick="switchCamera()">📷 Flip</button>
                <label class="btn">📁 Load<input type="file" id="file-input" accept=".json" onchange="loadFile(event)" style="display:none;"></label>
                <button class="btn" onclick="openModal('paste')">📋 Paste</button>
            </div>
        </div>

        <div class="hud-footer interactive">
            <div class="metrics">
                <div>Frames: <span id="m-frames">0</span></div>
                <div>Nodes: <span id="m-nodes">0</span></div>
            </div>
            <div style="display:flex; gap:6px;">
                <button id="scan-btn" class="btn btn-primary" onclick="toggleScan()">Record</button>
                <button id="save-btn" class="btn btn-success" style="display:none;" onclick="openModal('export')">Export</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('camera-stream'),
              canvas = document.getElementById('processing-canvas'),
              ctx = canvas.getContext('2d', { willReadFrequently: true }),
              renderContainer = document.getElementById('render-container');
              
        let isScanning = false, frames = [], facing = "environment", stream = null, holistic = null, cameraUtils = null;
        let scene, camera, renderer, pointCloud, playbackFrames = [], playbackIndex = 0, modalMode = 'export';

        async function initCam() {
            if (renderContainer.style.display === "block") return;
            if (stream) stream.getTracks().forEach(t => t.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } } });
                video.srcObject = stream;
                video.classList.toggle("front-facing", facing === "user");
            } catch (e) { console.error(e); }
        }

        function switchCamera() {
            facing = (facing === "environment") ? "user" : "environment";
            initCam();
        }

        function initProcessor() {
            holistic = new Holistic({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${f}` });
            holistic.setOptions({ modelComplexity: 1, smoothLandmarks: true, refineFaceLandmarks: true, minDetectionConfidence: 0.5 });
            holistic.onResults(res => {
                if (!isScanning || !frames.length) return;
                let hVerts = [], hCols = [];
                const add = (l, r, g, b) => { if(l) l.forEach(p => { hVerts.push((p.x-.5)*-5.2, (p.y-.5)*-5.2, (p.z||0)*5.2); hCols.push(r,g,b); }); };
                add(res.faceLandmarks?.landmark, 0.1, 0.9, 1);
                add(res.poseLandmarks?.landmark, 0.2, 1, 0.4);
                add(res.leftHandLandmarks?.landmark, 1, 0.6, 0.1);
                add(res.rightHandLandmarks?.landmark, 1, 0.2, 0.8);
                if (hVerts.length) {
                    let cf = frames[frames.length - 1];
                    cf.vertices.push(...hVerts); cf.colors.push(...hCols);
                    document.getElementById('m-nodes').innerText = cf.vertices.length / 3;
                }
            });
            cameraUtils = new Camera(video, {
                onFrame: async () => { if (isScanning && video) { await holistic.send({ image: video }); captureFrame(); } },
                width: 1280, height: 720
            });
            cameraUtils.start();
        }

        function captureFrame() {
            if (!video.videoWidth) return;
            canvas.width = 320; canvas.height = 180;
            ctx.drawImage(video, 0, 0, 320, 180);
            const img = ctx.getImageData(0, 0, 320, 180).data;
            let v = [], c = [];
            for (let y = 1; y < 179; y += 2) {
                for (let x = 1; x < 319; x += 2) {
                    let i = (y * 320 + x) * 4, r = img[i], g = img[i+1], b = img[i+2];
                    let lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
                    v.push((x/320 - 0.5)*5.2, -(y/180 - 0.5)*5.2, (lum - 0.5)*3.4);
                    c.px = r/255; c.push(r/255, g/255, b/255);
                }
            }
            frames.push({ vertices: v, colors: c });
            document.getElementById('m-frames').innerText = frames.length;
            document.getElementById('m-nodes').innerText = v.length / 3;
        }

        function toggleScan() {
            isScanning = !isScanning;
            const btn = document.getElementById('scan-btn');
            btn.innerText = isScanning ? "Stop" : "Record";
            btn.className = isScanning ? "btn btn-danger" : "btn btn-primary";
            document.getElementById('save-btn').style.display = isScanning ? "none" : (frames.length ? "block" : "none");
            if (isScanning) frames = [];
        }

        function openModal(mode) {
            modalMode = mode;
            document.getElementById('modal').style.display = 'flex';
            const txt = document.getElementById('modal-text');
            if (mode === 'export') {
                document.getElementById('modal-title').innerText = "Export 3D Map Payload";
                txt.value = JSON.stringify({ version: "2.0", frames: frames.map((f, i) => ({ frameIndex: i, geometryStream: f })) });
                document.getElementById('modal-action-btn').innerText = "Copy Payload";
            } else {
                document.getElementById('modal-title').innerText = "Paste 3D Map JSON";
                txt.value = "";
                document.getElementById('modal-action-btn').innerText = "Process & Play";
            }
        }

        function toggleModal(show) { document.getElementById('modal').style.display = show ? 'flex' : 'none'; }

        function modalAction() {
            const txt = document.getElementById('modal-text');
            if (modalMode === 'export') {
                navigator.clipboard.writeText(txt.value).then(() => {
                    document.getElementById('modal-action-btn').innerText = "Copied!";
                    setTimeout(() => toggleModal(false), 1000);
                });
            } else {
                try {
                    const data = JSON.parse(txt.value);
                    let seq = data.frames ? data.frames.map(f => f.geometryStream) : (data.sequence || []);
                    toggleModal(false);
                    playSequence(seq);
                } catch(e) { alert("Invalid JSON format"); }
            }
        }

        function loadFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    const data = JSON.parse(ev.target.result);
                    playSequence(data.frames ? data.frames.map(f => f.geometryStream) : (data.sequence || []));
                } catch(err) { alert("Invalid file format"); }
            };
            reader.readAsText(file);
        }

        function playSequence(seq) {
            if (stream) stream.getTracks().forEach(t => t.stop());
            video.style.display = 'none';
            renderContainer.style.display = 'block';
            playbackFrames = seq;
            playbackIndex = 0;

            if (!scene) {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 0, 4);
                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderContainer.appendChild(renderer.domElement);
                scene.add(new THREE.AmbientLight(0xffffff, 1.2));
                
                let drag = false, px = 0, py = 0;
                window.addEventListener('mousedown', e => { drag = true; px = e.clientX; py = e.clientY; });
                window.addEventListener('mousemove', e => {
                    if (!drag || !pointCloud) return;
                    pointCloud.rotation.y += (e.clientX - px) * 0.005;
                    pointCloud.rotation.x += (e.clientY - py) * 0.005;
                    px = e.clientX; py = e.clientY;
                });
                window.addEventListener('mouseup', () => drag = false);
            }

            const geometry = new THREE.BufferGeometry();
            pointCloud = new THREE.Points(geometry, new THREE.PointsMaterial({ size: 0.022, vertexColors: true, transparent: true, opacity: 0.95 }));
            scene.add(pointCloud);

            function animate() {
                requestAnimationFrame(animate);
                if (playbackFrames.length) {
                    let f = playbackFrames[playbackIndex];
                    geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(f.vertices), 3));
                    geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(f.colors), 3));
                    document.getElementById('m-nodes').innerText = f.vertices.length / 3;
                    document.getElementById('m-frames').innerText = playbackFrames.length;
                    playbackIndex = (playbackIndex + 1) % playbackFrames.length;
                }
                renderer.render(scene, camera);
            }
            animate();
        }

        window.addEventListener('load', () => { initCam(); initProcessor(); });
    </script>
</body>
</html>
