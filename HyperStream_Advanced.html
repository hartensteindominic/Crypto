<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>HyperStream Advanced</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font:14px system-ui,-apple-system,sans-serif}#c{position:fixed;inset:0;width:100%;height:100%}.top{position:fixed;z-index:5;top:12px;left:14px;font-weight:800}.ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:12px;border:1px solid #fff2;border-radius:18px;background:#111d;backdrop-filter:blur(18px)}button{border:0;border-radius:11px;padding:11px 10px;margin:3px;background:#286cff;color:#fff;font-weight:700}button:disabled{opacity:.35}.row{display:flex;gap:5px;flex-wrap:wrap}.status{padding:3px;color:#9ad0ff}.small{color:#aaa;font-size:12px}.modal{display:none;position:fixed;z-index:20;inset:0;background:#000e;align-items:center;justify-content:center;padding:18px}.modal.on{display:flex}.card{width:min(430px,100%);background:#18181b;border:1px solid #fff2;border-radius:20px;padding:17px;text-align:center}.qrbox{width:230px;height:230px;background:#fff;margin:12px auto;border-radius:12px}.qrbox img{width:100%;height:100%}#qrVideo{width:100%;max-height:55vh;object-fit:cover;border-radius:14px}</style></head><body><canvas id="c"></canvas><div class="top">HyperStream <span style="opacity:.4">AI</span></div><div class="ui"><div class="status" id="status">Ready</div><div class="row"><button id="scan">Scan</button><button id="record" disabled>Record</button><button id="build" disabled>Build Hologram</button><button id="connect">Connect</button><button id="scanQR">Scan QR</button><button id="play" disabled>Play Recording</button><button id="clear">Clear</button></div><div class="small" id="stats">Local 0 · Remote 0 · Frames 0 · Device 0</div></div><div class="modal" id="pair"><div class="card"><h2>Connect Camera</h2><p class="small">Show this QR to the other device. The other device stays in its browser and becomes the second spatial camera.</p><div class="qrbox"><img id="qrImg"></div><b id="code">------</b><p class="small" id="pairState">Waiting…</p><button id="closePair">Close</button><button id="copy">Copy Link</button></div></div><div class="modal" id="qrModal"><div class="card"><h2>Scan Connection QR</h2><video id="qrVideo" playsinline muted></video><p class="small" id="qrState">Point the VR/headset camera at the QR code.</p><button id="closeQR">Cancel</button></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><script>'use strict';const $=id=>document.getElementById(id);let scene,camera,renderer,controls,points,remotePoints,peer,conn,peerId,camStream,qrStream,frames=[],localN=0,remoteN=0,recording=false,recorder,chunks=[];const MAX=90000;function status(s){$('status').textContent=s}function init(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.05,500);camera.position.set(0,1,7);renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(MAX*3),3));g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(MAX*3),3));g.setDrawRange(0,0);points=new THREE.Points(g,new THREE.PointsMaterial({size:.055,vertexColors:true,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(points);scene.add(new THREE.GridHelper(10,20,0x204080,0x101015));renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});createHost()}function createHost(){peer=new Peer();peer.on('open',id=>{peerId=id;status('Ready · Connect or Scan QR')});peer.on('connection',attach)}function attach(c){conn=c;c.on('open',()=>{status('Camera device connected');$('pairState').textContent='Connected'});c.on('data',d=>{if(d.t!=='spatial')return;remoteN=d.n||0;if(!remotePoints){let g=new THREE.BufferGeometry();remotePoints=new THREE.Points(g,new THREE.PointsMaterial({size:.045,vertexColors:true,transparent:true,opacity:.75,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(remotePoints)}remotePoints.geometry.setAttribute('position',new THREE.Float32BufferAttribute(d.p,3));remotePoints.geometry.setAttribute('color',new THREE.Float32BufferAttribute(d.c,3));$('stats').textContent=`Local ${localN} · Remote ${remoteN} · Frames ${frames.length} · Device 1`});c.on('close',()=>status('Device disconnected'))}async function getCamera(v){if(!navigator.mediaDevices?.getUserMedia)throw Error('Camera API unavailable');let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});v.srcObject=s;v.muted=true;v.playsInline=true;await v.play();return s}async function startScan(){if(!camStream)try{let v=document.createElement('video');camStream=await getCamera(v);window.scanVideo=v}catch(e){status('Allow camera access');return}$('record').disabled=false;status('Scanning environment');sample(window.scanVideo)}function sample(v){if(!camStream)return;let w=180,h=Math.max(100,Math.round(v.videoHeight/v.videoWidth*w)),c=document.createElement('canvas');c.width=w;c.height=h;let x=c.getContext('2d');x.drawImage(v,0,0,w,h);let d=x.getImageData(0,0,w,h).data,a=points.geometry.attributes.position.array,col=points.geometry.attributes.color.array,n=0;for(let y=2;y<h-2;y+=2)for(let xx=2;xx<w-2;xx+=2){if(n>=MAX)break;let i=(y*w+xx)*4,r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,l=.299*r+.587*g+.114*b;if(l<.04||l>.97)continue;let j=n*3;a[j]=(xx/w-.5)*4;a[j+1]=(.5-y/h)*3+.3;a[j+2]=(1-l)*5-2.5;col[j]=r;col[j+1]=g;col[j+2]=b;n++}points.geometry.setDrawRange(0,n);points.geometry.attributes.position.needsUpdate=true;points.geometry.attributes.color.needsUpdate=true;localN=n;if(recording&&n){frames.push({p:Array.from(a.slice(0,n*3)),c:Array.from(col.slice(0,n*3))});if(frames.length>240)frames.shift()}if(conn?.open&&n)conn.send({t:'spatial',p:Array.from(a.slice(0,n*3)),c:Array.from(col.slice(0,n*3)),n});$('stats').textContent=`Local ${localN} · Remote ${remoteN} · Frames ${frames.length} · Device ${conn?.open?1:0}`;requestAnimationFrame(()=>sample(v))}$('scan').onclick=async()=>{if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;$('scan').textContent='Scan';status('Scan stopped')}else{$('scan').textContent='Stop';await startScan()}};$('record').onclick=()=>{recording=!recording;$('record').textContent=recording?'Stop Recording':'Record';if(recording){frames=[];status('Recording synchronized spatial capture');let s=renderer.domElement.captureStream?.(30);if(s&&window.MediaRecorder)try{chunks=[];recorder=new MediaRecorder(s,{mimeType:'video/webm'});recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);recorder.onstop=()=>{$('play').dataset.url=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));$('play').disabled=false};recorder.start()}catch(e){}}else{recorder?.stop();$('build').disabled=!frames.length;status(`${frames.length} frames captured`)}};$('play').onclick=()=>{let w=window.open('','_blank');if(w&&$('play').dataset.url)w.document.write(`<video src="${$('play').dataset.url}" controls autoplay style="width:100%;height:100%;background:#000"></video>`)};$('build').onclick=()=>{let p=[],c=[];for(let f=0;f<frames.length;f+=2){let F=frames[f],off=(f/Math.max(1,frames.length-1)-.5)*3;for(let i=0;i<F.p.length;i+=3){if(p.length/3>=MAX)break;p.push(F.p[i],F.p[i+1],F.p[i+2]+off);c.push(F.c[i],F.c[i+1],F.c[i+2])}}let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:.045,vertexColors:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false})));status(`Hologram built · ${(p.length/3)|0} points`)};$('clear').onclick=()=>{frames=[];points.geometry.setDrawRange(0,0);status('Cleared')};function makeLink(){return location.href.split('?')[0]+'?host='+encodeURIComponent(peerId)}$('connect').onclick=()=>{if(!peerId)return status('Preparing connection…');$('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=600x600&data='+encodeURIComponent(makeLink());$('code').textContent=peerId.slice(-6).toUpperCase();$('pair').classList.add('on')};$('closePair').onclick=()=>{$('pair').classList.remove('on')};$('copy').onclick=()=>navigator.clipboard?.writeText(makeLink());$('scanQR').onclick=scanConnectionQR;async function scanConnectionQR(){$('qrModal').classList.add('on');let v=$('qrVideo'),c=document.createElement('canvas'),x=c.getContext('2d');try{qrStream=await getCamera(v)}catch(e){$('qrState').textContent='Camera permission required';return}function loop(){if(!$('qrModal').classList.contains('on'))return;if(v.readyState>=2){c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);let q=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);if(q?.data)try{let u=new URL(q.data),h=u.searchParams.get('host');if(h){closeQR();startPhone(h);return}}catch(e){}}requestAnimationFrame(loop)}loop()}function closeQR(){qrStream?.getTracks().forEach(t=>t.stop());qrStream=null;$('qrModal').classList.remove('on')}$('closeQR').onclick=closeQR;async function startPhone(host){status('Connecting phone camera…');peer=new Peer();peer.on('open',()=>{conn=peer.connect(host,{reliable:true});conn.on('open',async()=>{try{let v=document.createElement('video');camStream=await getCamera(v);status('Phone camera connected · scanning');phoneSample(v)}catch(e){status('Allow camera access on the phone')}})})}function phoneSample(v){if(!camStream||!conn?.open)return;let w=160,h=Math.max(90,Math.round(v.videoHeight/v.videoWidth*w)),c=document.createElement('canvas');c.width=w;c.height=h;let x=c.getContext('2d');x.drawImage(v,0,0,w,h);let d=x.getImageData(0,0,w,h).data,p=[],cl=[];for(let y=2;y<h-2;y+=3)for(let xx=2;xx<w-2;xx+=3){let i=(y*w+xx)*4,r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,l=.299*r+.587*g+.114*b;if(l<.04||l>.97)continue;p.push((xx/w-.5)*4,(.5-y/h)*3+.3,(1-l)*5-2.5);cl.push(r,g,b)}conn.send({t:'spatial',p:p,c:cl,n:p.length/3});setTimeout(()=>phoneSample(v),120)}let host=new URLSearchParams(location.search).get('host');if(host)startPhone(host);else init();</script></body></html>
