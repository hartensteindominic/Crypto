<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HyperStream Spatial</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#010205;color:#fff;font:14px system-ui}#c{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:9px;border:1px solid #ffffff18;border-radius:17px;background:#090d14e8;backdrop-filter:blur(12px)}button{border:0;border-radius:10px;padding:9px 11px;margin:2px;background:#1677ff;color:#fff;font-weight:700}button:disabled{opacity:.3}.status{color:#9bd4ff}.small{color:#8c95a3;font-size:12px}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000d;align-items:center;justify-content:center;padding:15px}.on{display:flex}.card{width:min(420px,100%);background:#151920;border-radius:19px;padding:15px;text-align:center}.qr{width:250px;height:250px;background:#fff;margin:10px auto;padding:7px}.qr canvas{width:100%;height:100%}#qv{width:100%;max-height:60vh;object-fit:cover;border-radius:13px}.target{position:absolute;inset:18%;border:2px solid #48a0ff;border-radius:16px}</style></head><body><canvas id=c></canvas><div class=ui><div class=status id=s>HyperStream ready</div><div><button id=q>Scan QR</button><button id=co>Show QR</button><button id=sc>Start Spatial</button><button id=re disabled>Record</button><button id=bu disabled>Build Hologram</button><button id=pl disabled>Play</button><button id=cl>Clear</button></div><div class=small id=st>Quest 0 · iPhone 0 · map 0 · detail 0</div></div><div class=modal id=pm><div class=card><h2>Connect Quest</h2><div class=qr><canvas id=qc></canvas></div><div id=pair>Preparing QR…</div><p class=small>Scan this with Quest.</p><button id=x>Close</button></div></div><div class=modal id=qm><div class=card><h2>Scan QR</h2><div style="position:relative"><video id=qv autoplay playsinline muted></video><div class=target></div></div><p id=qs class=small>Center the iPhone QR.</p><button id=qx>Cancel</button></div></div><script>const $=x=>document.getElementById(x),host=!new URLSearchParams(location.search).has('host');let peer,conn,three=false,stream=null,video=null,recording=false,frames=[],rec,chunks=[],local={p:[],c:[]},remote={p:[],c:[]},map=new Map(),cloud,liveA,liveB,liveF,world,prev=null,pose={x:0,y:0,z:0};const MAX=65000,VOX=.075,say=x=>$('s').textContent=x,load=u=>new Promise((a,b)=>{let z=document.createElement('script');z.src=u;z.onload=a;z.onerror=b;document.head.appendChild(z)});async function peerStart(){if(peer)return;await load('https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js');peer=new Peer();peer.on('open',x=>{say(host?'iPhone ready · Show QR':'Quest ready · Scan QR')});peer.on('error',()=>say('Connection error · try again'));peer.on('connection',attach)}function attach(c){conn=c;c.on('open',()=>{send({t:'hello'});say('CONNECTED · Quest + iPhone');$('sc').disabled=false;spatial()});c.on('data',d=>{if(d.t==='hello')say('CONNECTED · dual spatial link');if(d.t==='spatial')receive(d)});c.on('close',()=>say('Connection closed'))}async function qr(){await peerStart();await load('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js');let q=qrcode(0,'M');q.addData(location.href.split('?')[0]+'?host='+encodeURIComponent(peer.id));q.make();let c=$('qc'),x=c.getContext('2d'),n=q.getModuleCount(),z=Math.floor(720/(n+8));c.width=c.height=(n+8)*z;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';for(let y=0;y<n;y++)for(let X=0;X<n;X++)if(q.isDark(y,X))x.fillRect((X+4)*z,(y+4)*z,z,z);$('pair').textContent='PAIR '+peer.id.slice(-6).toUpperCase()}$('co').onclick=async()=>{$('pm').classList.add('on');try{await qr()}catch(e){$('pair').textContent='QR failed';say('QR generation failed')}};$('x').onclick=()=>$('pm').classList.remove('on');async function boot(){if(three)return;await load('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');await load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js');window.S=new THREE.Scene();window.C=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.03,200);C.position.set(0,1.2,6);window.R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(devicePixelRatio||1,1.35));R.setSize(innerWidth,innerHeight);window.T=new THREE.OrbitControls(C,R.domElement);T.enableDamping=true;T.autoRotate=true;T.autoRotateSpeed=.12;S.add(new THREE.GridHelper(12,24,0x102033,0x060a10));three=true;R.setAnimationLoop(()=>{T.update();R.render(S,C)});addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)})}function pts(p,c,size=.025,op=.42){if(!p.length)return null;let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));let m=new THREE.PointsMaterial({size,vertexColors:true,transparent:true,opacity:op,blending:THREE.NormalBlending,depthWrite:true,sizeAttenuation:true});let o=new THREE.Points(g,m);S.add(o);return o}function edgePoints(a){let p=[],c=[];for(let i=0;i<a.p.length;i+=3){let r=a.c[i],g=a.c[i+1],b=a.c[i+2],l=.299*r+.587*g+.114*b;if(l>.12&&l<.88){p.push(a.p[i],a.p[i+1],a.p[i+2]);c.push(Math.min(1,r*1.1),Math.min(1,g*1.1),Math.min(1,b*1.1))}}return{p,c}}function centroid(p){let x=0,y=0,z=0,n=p.length/3||1;for(let i=0;i<p.length;i+=3){x+=p[i];y+=p[i+1];z+=p[i+2]}return{x:x/n,y:y/n,z:z/n}}function integrate(a,side){let shift=side==='iphone'?.58:-.58;if(prev&&a.center){pose.x+=Math.max(-.025,Math.min(.025,(a.center.x-prev.x)*.14));pose.z+=Math.max(-.025,Math.min(.025,(a.center.z-prev.z)*.14))}prev=a.center;let e=edgePoints(a);for(let i=0;i<e.p.length&&map.size<MAX;i+=3){let x=e.p[i]+shift+pose.x,y=e.p[i+1]+pose.y,z=e.p[i+2]+pose.z,k=`${Math.round(x/VOX)},${Math.round(y/VOX)},${Math.round(z/VOX)}`;if(!map.has(k))map.set(k,[x,y,z,e.c[i]*.72,e.c[i+1]*.72,e.c[i+2]*.72])}}function renderMap(){if(cloud){S.remove(cloud);cloud.geometry.dispose()}let p=[],c=[];for(let v of map.values()){p.push(v[0],v[1],v[2]);c.push(v[3],v[4],v[5])}cloud=pts(p,c,.028,.46);$('st').textContent=`Quest ${(local.p.length/3)|0} · iPhone ${(remote.p.length/3)|0} · map ${map.size.toLocaleString()} · detail ${Math.round(map.size/100)/10}k` }function renderLive(){for(let k of ['liveA','liveB','liveF'])if(window[k]){S.remove(window[k]);window[k].geometry.dispose()}liveA=pts(local.p,local.c,.016,.18);liveB=pts(remote.p,remote.c,.016,.18);let p=[],c=[],n=Math.min(local.p.length,remote.p.length);for(let i=0;i<n&&p.length<9000;i+=3){p.push((local.p[i]+remote.p[i])*.5,(local.p[i+1]+remote.p[i+1])*.5,(local.p[i+2]+remote.p[i+2])*.5);c.push((local.c[i]+remote.c[i])*.28,(local.c[i+1]+remote.c[i+1])*.28,(local.c[i+2]+remote.c[i+2])*.28)}liveF=pts(p,c,.02,.25);renderMap()}function send(o){if(conn?.open)conn.send(o)}function receive(d){remote={p:d.p||[],c:d.c||[]};integrate(remote,host?'quest':'iphone');if(recording)frames.push({p:remote.p,c:remote.c,side:host?'quest':'iphone'});renderLive()}async function camera(){if(stream)return true;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:360}},audio:false});video=document.createElement('video');video.srcObject=stream;video.muted=true;await video.play();return true}catch(e){say('Camera permission required');return false}}function sample(v){let w=220,h=Math.max(110,Math.round((v.videoHeight/v.videoWidth)*w)),cv=document.createElement('canvas');cv.width=w;cv.height=h;let x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,w,h);let d=x.getImageData(0,0,w,h).data,p=[],c=[];for(let y=2;y<h-2;y+=4)for(let X=2;X<w-2;X+=4){let i=(y*w+X)*4,r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,l=.299*r+.587*g+.114*b;if(l<.035||l>.965)continue;let gx=Math.abs(d[i]-d[i-4])+Math.abs(d[i]-d[i+4]),gy=Math.abs(d[i]-d[i-4*w])+Math.abs(d[i]-d[i+4*w]),e=(gx+gy)/1020;if(e<.025)continue;let z=(1-l)*3.6-1.8+e*.65;p.push((X/w-.5)*3.4,(.5-y/h)*2.5,z);c.push(r*.72,g*.72,b*.72)}return{p,c,center:centroid(p)}}async function spatial(){await peerStart();await boot();if(!await camera())return;$('re').disabled=false;$('sc').disabled=false;say(conn?.open?'DUAL SPATIAL DETAIL ACTIVE':'LOCAL SPATIAL DETAIL · waiting for second camera');let last=0;function loop(t){if(!stream)return;if(t-last<130){requestAnimationFrame(loop);return}last=t;local=sample(video);integrate(local,host?'iphone':'quest');send({t:'spatial',p:local.p,c:local.c});if(recording)frames.push({p:local.p,c:local.c,side:host?'iphone':'quest'});renderLive();requestAnimationFrame(loop)}requestAnimationFrame(loop)}$('sc').onclick=spatial;async function connect(h){await peerStart();say('Connecting…');attach(peer.connect(h,{reliable:true}))}async function scanQR(){$('qm').classList.add('on');try{await load('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js');let v=$('qv'),st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});v.srcObject=st;await v.play();let cv=document.createElement('canvas'),x=cv.getContext('2d',{willReadFrequently:true});async function loop(){if(!$('qm').classList.contains('on')){st.getTracks().forEach(t=>t.stop());return}cv.width=v.videoWidth;cv.height=v.videoHeight;x.drawImage(v,0,0);let n=Math.min(cv.width,cv.height),sx=(cv.width-n)/2,sy=(cv.height-n)/2,d=x.getImageData(sx,sy,n,n),q=jsQR(d.data,n,n,{inversionAttempts:'attemptBoth'});if(q)try{let u=new URL(q.data),h=u.searchParams.get('host');if(h){st.getTracks().forEach(t=>t.stop());$('qm').classList.remove('on');connect(h);return}}catch(e){}requestAnimationFrame(loop)}loop()}catch(e){$('qs').textContent='Camera permission required'}}$('q').onclick=scanQR;$('qx').onclick=()=>$('qm').classList.remove('on');function build(){if(!map.size){say('Scan space first');return}if(world){S.remove(world);world.geometry.dispose()}let p=[],c=[];for(let v of map.values()){p.push(v[0],v[1],v[2]);c.push(v[3]*.55,v[4]*.55,v[5]*.55)}world=pts(p,c,.026,.52);$('pl').disabled=false;say(`Hologram built · ${map.size.toLocaleString()} detailed voxels`)}$('bu').onclick=build;function clear(){map.clear();frames=[];pose={x:0,y:0,z:0};prev=null;if(world){S.remove(world);world=null}for(let k of ['cloud','liveA','liveB','liveF'])if(window[k]){S.remove(window[k]);window[k]=null}local=remote={p:[],c:[]};$('bu').disabled=true;say('Spatial map cleared')}$('cl').onclick=clear;$('re').onclick=()=>{recording=!recording;$('re').textContent=recording?'Stop':'Record';if(recording){frames=[];chunks=[];if(window.MediaRecorder&&R?.domElement.captureStream){rec=new MediaRecorder(R.domElement.captureStream(30));rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{$('pl').dataset.u=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));$('pl').disabled=false};rec.start()}say('Recording detailed spatial map')}else{rec?.stop();$('bu').disabled=!map.size;say(`${map.size.toLocaleString()} detailed voxels captured`)}};$('pl').onclick=()=>{$('pl').dataset.u&&open($('pl').dataset.u)};(async()=>{await peerStart();say(host?'iPhone ready · Show QR':'Quest ready · Scan QR')})();</script></body></html>
