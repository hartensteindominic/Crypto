<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HyperStream Advanced Spatial</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020409;color:#fff;font:14px system-ui}#c{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:9px;border:1px solid #ffffff18;border-radius:17px;background:#080c13ed;backdrop-filter:blur(12px)}button{border:0;border-radius:10px;padding:9px 11px;margin:2px;background:#176cff;color:#fff;font-weight:700}button:disabled{opacity:.3}.status{color:#9bd4ff}.small{color:#8c95a3;font-size:12px}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000d;align-items:center;justify-content:center;padding:15px}.on{display:flex}.card{width:min(420px,100%);background:#151920;border-radius:19px;padding:15px;text-align:center}.qr{width:250px;height:250px;background:#fff;margin:10px auto;padding:7px}.qr canvas{width:100%;height:100%}#qv{width:100%;max-height:60vh;object-fit:cover;border-radius:13px}.target{position:absolute;inset:18%;border:2px solid #48a0ff;border-radius:16px}</style></head><body><canvas id=c></canvas><div class=ui><div class=status id=s>HyperStream ready</div><div><button id=q>Scan QR</button><button id=co>Show QR</button><button id=sc>Start Spatial</button><button id=re disabled>Record</button><button id=bu disabled>Build Hologram</button><button id=pl disabled>Play</button><button id=cl>Clear</button></div><div class=small id=st>Quest 0 · iPhone 0 · features 0 · 3D points 0</div></div><div class=modal id=pm><div class=card><h2>Connect Quest</h2><div class=qr><canvas id=qc></canvas></div><div id=pair>Preparing QR…</div><p class=small>Scan this with Quest.</p><button id=x>Close</button></div></div><div class=modal id=qm><div class=card><h2>Scan QR</h2><div style="position:relative"><video id=qv autoplay playsinline muted></video><div class=target></div></div><p id=qs class=small>Center the iPhone QR.</p><button id=qx>Cancel</button></div></div><script>const $=x=>document.getElementById(x),host=!new URLSearchParams(location.search).has('host');let peer,conn,rendererReady=false,stream=null,video=null,cvReady=false,orb=null,canvas,ctx,frameTimer,localF=null,remoteF=null,cloud=null,world=null,recording=false,rec,chunks=[],recordFrames=0;let map=new Map(),lastPose=null;const MAX=50000,VOX=.045,BASELINE=.35,say=x=>$('s').textContent=x;const load=u=>new Promise((a,b)=>{let s=document.createElement('script');s.src=u;s.onload=a;s.onerror=b;document.head.appendChild(s)});async function peerStart(){if(peer)return;await load('https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js');peer=new Peer();peer.on('open',()=>say(host?'iPhone ready · Show QR':'Quest ready · Scan QR'));peer.on('error',()=>say('Connection error · try again'));peer.on('connection',attach)}function attach(c){conn=c;c.on('open',()=>{send({t:'hello',role:host?'iphone':'quest'});say('CONNECTED · spatial pair ready');$('sc').disabled=false});c.on('data',d=>{if(d.t==='hello')say('CONNECTED · comparing cameras');if(d.t==='features')remoteF=d;});c.on('close',()=>say('Connection closed'))}function send(o){if(conn?.open)try{conn.send(o)}catch(e){}}async function qr(){await peerStart();await load('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js');let q=qrcode(0,'M');q.addData(location.href.split('?')[0]+'?host='+encodeURIComponent(peer.id));q.make();let c=$('qc'),x=c.getContext('2d'),n=q.getModuleCount(),z=Math.floor(720/(n+8));c.width=c.height=(n+8)*z;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';for(let y=0;y<n;y++)for(let X=0;X<n;X++)if(q.isDark(y,X))x.fillRect((X+4)*z,(y+4)*z,z,z);$('pair').textContent='PAIR '+peer.id.slice(-6).toUpperCase()}$('co').onclick=async()=>{$('pm').classList.add('on');try{await qr()}catch(e){$('pair').textContent='QR failed';say('QR generation failed')}};$('x').onclick=()=>$('pm').classList.remove('on');async function three(){if(rendererReady)return;await load('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');await load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js');window.S=new THREE.Scene();S.background=new THREE.Color(0x020409);window.C=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.03,100);C.position.set(0,1.2,5.5);window.R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(devicePixelRatio||1,1.35));R.setSize(innerWidth,innerHeight);window.T=new THREE.OrbitControls(C,R.domElement);T.enableDamping=true;T.autoRotate=false;let g=new THREE.GridHelper(10,20,0x102238,0x070b12);S.add(g);rendererReady=true;R.setAnimationLoop(()=>{T.update();R.render(S,C)});addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)})}async function cv(){if(cvReady)return; say('Loading vision engine…');await load('https://docs.opencv.org/4.x/opencv.js');await new Promise((resolve,reject)=>{let t=setInterval(()=>{if(window.cv&&cv.Mat){clearInterval(t);resolve()}},50);setTimeout(()=>{clearInterval(t);reject(Error('OpenCV timeout'))},20000)});cvReady=true}async function camera(){if(stream)return true;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}},audio:false});video=document.createElement('video');video.srcObject=stream;video.muted=true;await video.play();canvas=document.createElement('canvas');canvas.width=320;canvas.height=240;ctx=canvas.getContext('2d',{willReadFrequently:true});return true}catch(e){say('Camera permission required');return false}}function extract(){ctx.drawImage(video,0,0,320,240);let src=cv.imread(canvas),gray=new cv.Mat(),kp=new cv.Mat(),des=new cv.Mat();cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);orb.detectAndCompute(gray,new cv.Mat(),kp,des);let pts=[];for(let i=0;i<kp.rows;i++){let p=kp.data32F.slice(i*2,i*2+2);pts.push([p[0],p[1]])}let bytes=Array.from(des.data);src.delete();gray.delete();kp.delete();des.delete();return{t:performance.now(),pts,bytes,rows:bytes.length/32,w:320,h:240}}function matches(a,b){if(!a||!b||!a.rows||!b.rows)return[];let da=cv.matFromArray(a.rows,32,cv.CV_8U,a.bytes),db=cv.matFromArray(b.rows,32,cv.CV_8U,b.bytes),bf=new cv.BFMatcher(cv.NORM_HAMMING,false),ms=new cv.DMatchVector();bf.match(da,db,ms);let out=[];for(let i=0;i<ms.size();i++){let m=ms.get(i);if(m.distance<58)out.push({a:m.queryIdx,b:m.trainIdx,d:m.distance})}da.delete();db.delete();ms.delete();out.sort((x,y)=>x.d-y.d);return out.slice(0,160)}function triangulate(a,b,ms){if(ms.length<8)return[];let p1=[],p2=[];for(let m of ms){let q=a.pts[m.a],r=b.pts[m.b];p1.push(q[0],q[1]);p2.push(r[0],r[1])}let A=cv.matFromArray(2,ms.length,cv.CV_64F,p1),B=cv.matFromArray(2,ms.length,cv.CV_64F,p2);let f=300,cx=160,cy=120,K=cv.matFromArray(3,3,cv.CV_64F,[f,0,cx,0,f,cy,0,0,1]);let E=new cv.Mat();cv.findEssentialMat(A,B,K,E,cv.RANSAC,.999,1.2);let Rm=new cv.Mat(),tv=new cv.Mat(),mask=new cv.Mat();cv.recoverPose(E,A,B,K,Rm,tv,mask);let P1=cv.Mat.eye(3,4,cv.CV_64F),P2=cv.Mat.zeros(3,4,cv.CV_64F);for(let r=0;r<3;r++)for(let c=0;c<3;c++)P2.doublePtr(r,c)[0]=Rm.doubleAt(r,c);for(let r=0;r<3;r++)P2.doublePtr(r,3)[0]=tv.doubleAt(r,0)*BASELINE;let X=new cv.Mat();cv.triangulatePoints(P1,P2,A,B,X);let out=[];for(let i=0;i<ms.length;i++){if(mask.ucharAt(i,0)===0)continue;let w=X.doubleAt(3,i);if(Math.abs(w)<1e-5)continue;let x=X.doubleAt(0,i)/w,y=X.doubleAt(1,i)/w,z=X.doubleAt(2,i)/w;if(z>0.05&&z<20&&Math.abs(x)<15&&Math.abs(y)<15){out.push({x:x,y:-y,z:z,c:Math.max(.15,1-ms[i].d/58)})}}A.delete();B.delete();K.delete();E.delete();Rm.delete();tv.delete();mask.delete();P1.delete();P2.delete();X.delete();return out}function add3D(points){for(let q of points){let k=`${Math.round(q.x/VOX)},${Math.round(q.y/VOX)},${Math.round(q.z/VOX)}`;let old=map.get(k);if(!old)map.set(k,[q.x,q.y,q.z,q.c]);else old[3]=Math.min(1,old[3]+q.c*.08)}if(map.size>MAX){let n=map.size-MAX;for(let k of map.keys()){map.delete(k);if(--n<=0)break}}}function drawMap(){if(cloud){S.remove(cloud);cloud.geometry.dispose()}let p=[],c=[];for(let q of map.values()){p.push(q[0],q[1],q[2]);let v=.28+.55*q[3];c.push(.18*v,.48*v,.9*v)}let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));let m=new THREE.PointsMaterial({size:.026,vertexColors:true,transparent:true,opacity:.72,depthWrite:true,sizeAttenuation:true});cloud=new THREE.Points(g,m);S.add(cloud);$('st').textContent=`Quest ${localF?.rows||0} · iPhone ${remoteF?.rows||0} · features ${Math.min(localF?.rows||0,remoteF?.rows||0)} · 3D points ${map.size.toLocaleString()}`}function processPair(){if(!localF||!remoteF)return;let ms=matches(localF,remoteF),pts=triangulate(localF,remoteF,ms);add3D(pts);drawMap();if(recording)recordFrames++;say(`3D reconstruction · ${ms.length} matches · ${pts.length} depth points`)}async function spatial(){await peerStart();await three();if(!await camera())return;try{await cv()}catch(e){say('Vision engine failed to load');return}orb=new cv.ORB(500);$('re').disabled=false;$('sc').disabled=false;say(conn?.open?'DUAL VISION · locating both cameras':'LOCAL VISION · waiting for second camera');let last=0;async function loop(t){if(!stream)return;if(t-last<220){requestAnimationFrame(loop);return}last=t;try{localF=extract();send({t:'features',pts:localF.pts,bytes:localF.bytes,rows:localF.rows,w:320,h:240,time:localF.t});if(remoteF)processPair()}catch(e){say('Vision frame skipped');}requestAnimationFrame(loop)}requestAnimationFrame(loop)}$('sc').onclick=spatial;async function connect(h){await peerStart();say('Connecting…');attach(peer.connect(h,{reliable:false,serialization:'json'}))}async function scanQR(){$('qm').classList.add('on');try{await load('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js');let v=$('qv'),st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});v.srcObject=st;await v.play();let cvq=document.createElement('canvas'),x=cvq.getContext('2d',{willReadFrequently:true});async function loop(){if(!$('qm').classList.contains('on')){st.getTracks().forEach(t=>t.stop());return}cvq.width=v.videoWidth;cvq.height=v.videoHeight;x.drawImage(v,0,0);let n=Math.min(cvq.width,cvq.height),sx=(cvq.width-n)/2,sy=(cvq.height-n)/2,d=x.getImageData(sx,sy,n,n),q=jsQR(d.data,n,n,{inversionAttempts:'attemptBoth'});if(q)try{let u=new URL(q.data),h=u.searchParams.get('host');if(h){st.getTracks().forEach(t=>t.stop());$('qm').classList.remove('on');connect(h);return}}catch(e){}requestAnimationFrame(loop)}loop()}catch(e){$('qs').textContent='Camera permission required'}}$('q').onclick=scanQR;$('qx').onclick=()=>$('qm').classList.remove('on');function build(){if(!map.size){say('Scan space first');return}if(world){S.remove(world);world.geometry.dispose()}let p=[],c=[];for(let q of map.values()){p.push(q[0],q[1],q[2]);let v=.2+.7*q[3];c.push(.12*v,.38*v,.82*v)}let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));let m=new THREE.PointsMaterial({size:.03,vertexColors:true,transparent:true,opacity:.78,depthWrite:true,sizeAttenuation:true});world=new THREE.Points(g,m);S.add(world);$('pl').disabled=false;say(`Hologram built · ${map.size.toLocaleString()} reconstructed points`)}$('bu').onclick=build;function clear(){map.clear();localF=remoteF=null;if(cloud){S.remove(cloud);cloud=null}if(world){S.remove(world);world=null}$('bu').disabled=true;say('Spatial map cleared')}$('cl').onclick=clear;$('re').onclick=()=>{recording=!recording;$('re').textContent=recording?'Stop':'Record';if(recording){recordFrames=0;chunks=[];if(window.MediaRecorder&&R?.domElement.captureStream){rec=new MediaRecorder(R.domElement.captureStream(30));rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{$('pl').dataset.u=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));$('pl').disabled=false};rec.start()}say('Recording reconstructed 3D space')}else{rec?.stop();$('bu').disabled=!map.size;say(`${recordFrames} reconstructed frame pairs processed`)}};$('pl').onclick=()=>{$('pl').dataset.u&&open($('pl').dataset.u)};(async()=>{await peerStart();say(host?'iPhone ready · Show QR':'Quest ready · Scan QR')})();</script></body></html>
