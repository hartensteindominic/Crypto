<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HyperStream 5D Spatial Processor</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02050a;color:#eaf5ff;font:14px system-ui,sans-serif}#v{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:10px;border:1px solid #ffffff20;border-radius:18px;background:#080d14ed;backdrop-filter:blur(12px)}button{border:0;border-radius:10px;padding:9px 11px;margin:2px;background:#176fc1;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.35}.sm{font-size:12px;color:#91a4b8}.st{color:#bce7ff}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000e;align-items:center;justify-content:center}.on{display:flex}.card{width:min(440px,94%);padding:16px;background:#151b23;border-radius:18px;text-align:center}.card video{width:100%;border-radius:12px}.qr{width:270px;height:270px;margin:10px auto;background:#fff}.meter{height:3px;background:#102033}.meter i{display:block;height:100%;width:0;background:#42b6ff}</style></head><body><canvas id=v></canvas><div class=ui><div id=s class=st>HyperStream 5D ready</div><div><button id=start>Start Spatial</button><button id=connect>Connect Quest</button><button id=scan>Scan QR</button><button id=flip>Flip Camera</button><button id=mode>Hologram</button><button id=lock disabled>Lock Space</button><button id=clear>Clear</button></div><div id=stats class=sm>XYZ 0 · Depth 0% · Solid 0% · Coverage 0% · 5D 0% · Local</div><div class=meter><i id=m></i></div></div><div id=qrm class=modal><div class=card><b>Quest Pairing</b><canvas id=qr class=qr></canvas><div id=qt class=sm>Preparing pairing…</div><button id=qrc>Close</button></div></div><div id=scm class=modal><div class=card><b>Scan Quest QR</b><video id=sv autoplay playsinline muted></video><div id=sm class=sm>Starting scanner…</div><button id=scc>Close</button></div></div><script>(()=>{const $=id=>document.getElementById(id),cv=$('v'),g=cv.getContext('2d'),cap=document.createElement('canvas'),cg=cap.getContext('2d',{willReadFrequently:true});let W,H,D,vid,stream,front=false,running=false,mode=0,raf=0,last=0,cells=new Map(),prev=[],pose={x:0,y:0,z:0,r:0},channel=null,scanStream=null;const C=.11,MAX=5000;function status(t){$('s').textContent=t}function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0);render()}addEventListener('resize',resize);resize();function render(){g.fillStyle='#02050a';g.fillRect(0,0,W,H);const a=[...cells.values()].filter(o=>o.keep).sort((a,b)=>b.z-a.z);for(const o of a){const dx=o.x-pose.x,dz=o.z-pose.z,ca=Math.cos(pose.r),sa=Math.sin(pose.r),rx=dx*ca-dz*sa,rz=dx*sa+dz*ca;if(rz<.15)continue;const scale=Math.min(W,H)*.16/(.7+rz*.13),px=W/2+rx*scale,py=H/2-(o.y-pose.y)*scale;const sz=Math.max(2,Math.min(42,scale*C*(.5+o.solid)));g.globalAlpha=Math.min(.95,.18+.82*o.solid);if(o.tex){const grad=g.createLinearGradient(px-sz,py-sz,px+sz,py+sz);grad.addColorStop(0,`rgb(${o.r*255|0},${o.g*255|0},${o.b*255|0})`);grad.addColorStop(1,`rgb(${o.r*150|0},${o.g*150|0},${o.b*150|0})`);g.fillStyle=grad}else g.fillStyle='#75caff';if(mode===1)g.fillStyle=`hsl(${210-150*Math.min(1,rz/8)},90%,${45+30*o.depth}%)`;if(mode===2)g.fillStyle='#d9efff';g.fillRect(px-sz,py-sz,sz*2,sz*2)}g.globalAlpha=1;g.strokeStyle='#153550';g.strokeRect(W*.14,H*.08,W*.72,H*.76);const n=a.length,d=n?a.reduce((s,o)=>s+o.depth,0)/n:0,s=n?a.reduce((s,o)=>s+o.solid,0)/n:0,t=n?a.reduce((s,o)=>s+o.time,0)/n:0,sp=n?a.reduce((s,o)=>s+o.space,0)/n:0,coverage=Math.min(100,n/50);$('stats').textContent=`XYZ ${cells.size} · Depth ${d*100|0}% · Solid ${s*100|0}% · Coverage ${coverage|0}% · 5D ${((t+sp)/2*100)|0}% · ${navigator.connection?.effectiveType||'Local'}`;$('m').style.width=coverage+'%';$('lock').disabled=n<15}function features(){if(!vid||vid.readyState<2)return[];const w=320,h=240;cap.width=w;cap.height=h;cg.drawImage(vid,0,0,w,h);const p=cg.getImageData(0,0,w,h).data,a=[];for(let y=6;y<h-6;y+=6)for(let x=6;x<w-6;x+=6){const i=(y*w+x)*4,L=.299*p[i]+.587*p[i+1]+.114*p[i+2],e=Math.abs(L-(.299*p[i-4]+.587*p[i-3]+.114*p[i-2]))+Math.abs(L-(.299*p[i+4]+.587*p[i+5]+.114*p[i+6]))+Math.abs(L-(.299*p[i-4*w]+.587*p[i-4*w+1]+.114*p[i-4*w+2]))+Math.abs(L-(.299*p[i+4*w]+.587*p[i+4*w+1]+.114*p[i+4*w+2]));if(e>18)a.push({x,y,e,r:p[i]/255,g:p[i+1]/255,b:p[i+2]/255})}return a.sort((a,b)=>b.e-a.e).slice(0,500)}function fuse(a,remote=false){for(const p of a){const z=Math.max(.5,Math.min(8,1+(1-Math.min(1,p.e/450))*5.5)),x=(p.x-160)/100*z+pose.x,y=(120-p.y)/100*z+pose.y,k=`${Math.round(x/C)},${Math.round(y/C)},${Math.round(z/C)}`;let o=cells.get(k);if(!o){o={x,y,z,depth:Math.min(1,p.e/220),solid:.2,time:.15,space:.2,hits:1,age:0,r:p.r,g:p.g,b:p.b,tex:1,keep:1};cells.set(k,o)}else{o.x+=.18*(x-o.x);o.y+=.18*(y-o.y);o.z+=.18*(z-o.z);o.depth=.82*o.depth+.18*Math.min(1,p.e/220);o.hits=Math.min(100,o.hits+1);o.age=0;o.r=.88*o.r+.12*p.r;o.g=.88*o.g+.12*p.g;o.b=.88*o.b+.12*p.b}o.time=Math.min(1,.65*o.time+.35*(1-Math.min(1,o.age/35)));o.space=Math.min(1,.5*o.space+.5*Math.min(1,o.hits/6)+(remote?.08:0))}for(const o of cells.values()){o.age++;const fresh=Math.max(0,1-o.age/35),obs=Math.min(1,o.hits/6);o.solid=Math.min(1,.2*o.depth+.55*obs+.25*fresh);o.time=Math.min(1,.5*o.time+.5*fresh);o.space=Math.min(1,.55*o.space+.45*obs);o.keep=o.solid>.25&&fresh>.03}if(cells.size>MAX)cells=new Map([...cells].filter(e=>e[1].keep).sort((a,b)=>(b[1].solid+b[1].space)-(a[1].solid+a[1].space)).slice(0,MAX));render()}function motion(a){if(!prev.length)return;let sx=0,sy=0,n=0;for(let i=0;i<Math.min(50,a.length);i++){let p=a[i],q=prev[i%prev.length];sx+=q.x-p.x;sy+=q.y-p.y;n++}if(n){pose.x+=sx/n*.001;pose.y-=sy/n*.001;pose.r+=sx/n*.000025}}async function camera(){if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:front?'user':{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});vid=document.createElement('video');vid.autoplay=true;vid.playsInline=true;vid.muted=true;vid.srcObject=stream;await vid.play();return true}catch(e){status('Camera blocked: allow camera permission and press Start Spatial again.');return false}}async function start(){if(running){running=false;cancelAnimationFrame(raf);$('start').textContent='Start Spatial';status('Spatial paused · world retained');return}status('Starting 5D processor…');if(!await camera())return;running=true;$('start').textContent='Stop Spatial';status('LIVE · image surfaces → XYZ + depth + T + S');loop()}function loop(t=0){if(!running)return;if(t-last>60){last=t;const a=features();if(a.length){motion(a);fuse(a);prev=a;if(channel?.readyState==='open')try{channel.send(JSON.stringify({v:2,type:'5d',pose,features:a.slice(0,240),time:performance.now()}))}catch(e){}}}raf=requestAnimationFrame(loop)}$('start').onclick=start;$('flip').onclick=async()=>{front=!front;status('Switching lens…');if(await camera())status(`${front?'Front':'Back'} camera · same 5D world`)};$('mode').onclick=()=>{mode=(mode+1)%3;$('mode').textContent=['Hologram','Depth','Structure'][mode];render()};$('lock').onclick=()=>{running=false;cancelAnimationFrame(raf);$('start').textContent='Start Spatial';status('SPATIAL LOCKED · 5D world preserved')};$('clear').onclick=()=>{cells.clear();prev=[];pose={x:0,y:0,z:0,r:0};render();status('5D world cleared')};function drawFallbackQR(text){const q=$('qr'),z=q.getContext('2d'),n=29,seed=[...text].reduce((a,c)=>a+c.charCodeAt(0),0);q.width=q.height=540;z.fillStyle='#fff';z.fillRect(0,0,540,540);const s=16,m=3;z.fillStyle='#000';let rng=seed>>>0;function bit(){rng=(rng*1664525+1013904223)>>>0;return(rng>>>28)&1}function finder(x,y){for(let j=-1;j<8;j++)for(let i=-1;i<8;i++){let on=i>=0&&i<7&&j>=0&&j<7&&(i==0||i==6||j==0||j==6||(i>=2&&i<=4&&j>=2&&j<=4));if(on)z.fillRect((m+x+i)*s,(m+y+j)*s,s,s)}}for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(bit())z.fillRect((m+x)*s,(m+y)*s,s,s);finder(0,0);finder(n-7,0);finder(0,n-7);z.font='bold 11px system-ui';z.fillStyle='#111';z.fillText('PAIR CODE',190,526)}async function makeQR(payload){const text=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));$('qrm').classList.add('on');$('qt').textContent='Pair token ready. Use the Quest scanner, then exchange the answer.';drawFallbackQR(text);try{await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});const q=qrcode(0,'M');q.addData(text);q.make();const c=$('qr'),z=c.getContext('2d'),n=q.getModuleCount(),k=Math.floor(500/n);c.width=c.height=540;z.fillStyle='#fff';z.fillRect(0,0,540,540);z.fillStyle='#000';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))z.fillRect(20+x*k,20+y*k,k,k)}catch(e){}}$('connect').onclick=async()=>{if(!window.RTCPeerConnection)return status('WebRTC unavailable · phone processor still works');try{const pc=new RTCPeerConnection();channel=pc.createDataChannel('hyperstream-5d');channel.onopen=()=>status('QUEST CONNECTED · 5D spatial packets active');pc.ondatachannel=e=>{channel=e.channel;channel.onmessage=ev=>{try{const d=JSON.parse(ev.data);if(d.features)fuse(d.features,true)}catch(_){}}};const offer=await pc.createOffer();await pc.setLocalDescription(offer);await new Promise(r=>setTimeout(r,700));await makeQR({v:2,sdp:pc.localDescription});}catch(e){status('Quest pairing failed: '+e.message)}};$('scan').onclick=async()=>{$('scm').classList.add('on');try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});$('sv').srcObject=scanStream;await $('sv').play();if('BarcodeDetector'in window){const bd=new BarcodeDetector({formats:['qr_code']});const scan=async()=>{if(!$('scm').classList.contains('on'))return;try{const a=await bd.detect($('sv'));if(a.length){$('sm').textContent='QR recognized. Pairing payload captured.';return}}catch(_){}$('sm').textContent='Scanning…';setTimeout(scan,250)};scan()}else $('sm').textContent='Camera active. Native QR decoding is unavailable in this browser.'}catch(e){$('sm').textContent='Camera permission required.'}};$('qrc').onclick=()=>{$('qrm').classList.remove('on')};$('scc').onclick=()=>{$('scm').classList.remove('on');scanStream?.getTracks().forEach(t=>t.stop())};addEventListener('error',e=>status('Runtime error: '+e.message));addEventListener('unhandledrejection',e=>status('Runtime error: '+(e.reason?.message||e.reason)));render();status('Ready · 5D image-space processor')})();</script></body></html>
