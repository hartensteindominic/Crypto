<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HyperStream Spatial</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#030507;color:#eef;font:14px system-ui}#c{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:9px;border:1px solid #ffffff18;border-radius:17px;background:#090d14ed;backdrop-filter:blur(12px)}button{border:0;border-radius:10px;padding:9px 11px;margin:2px;background:#1976d2;color:white;font-weight:700}button:disabled{opacity:.35}.status{color:#b9e3ff}.small{color:#8e9aaa;font-size:12px}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000e;align-items:center;justify-content:center;padding:15px}.on{display:flex}.card{width:min(420px,100%);background:#151a21;border-radius:19px;padding:15px;text-align:center}.qr{width:250px;height:250px;background:white;margin:10px auto;padding:7px}.qr canvas{width:100%;height:100%}#qv{width:100%;border-radius:13px;max-height:60vh;object-fit:cover}.target{position:absolute;inset:17%;border:2px solid #4ba7ff;border-radius:16px}</style></head><body><canvas id=c></canvas><div class=ui><div class=status id=s>HyperStream ready</div><div><button id=q>Scan QR</button><button id=co>Show QR</button><button id=sc>Start Spatial</button><button id=re disabled>Record</button><button id=bu disabled>Build Hologram</button><button id=pl disabled>Play</button><button id=cl>Clear</button></div><div class=small id=st>Quest 0 · iPhone 0 · 3D points 0 · map idle</div></div><div class=modal id=pm><div class=card><h2>Connect Quest</h2><div class=qr><canvas id=qc></canvas></div><div id=pair>Preparing…</div><p class=small>Scan this QR with Quest.</p><button id=x>Close</button></div></div><div class=modal id=qm><div class=card><h2>Scan QR</h2><div style="position:relative"><video id=qv autoplay playsinline muted></video><div class=target></div></div><p id=qs class=small>Center the QR.</p><button id=qx>Cancel</button></div></div><script>const $=id=>document.getElementById(id);const isHost=!new URLSearchParams(location.search).has('host');let peer,conn,renderer,scene,camera,controls,stream,video,localPts=[],remotePts=[],map=new Map(),mapGroup,recording=false,frames=[],rec,chunks=[],lastLocal=null,lastRemote=null;const VOX=.055,MAX=50000;const say=t=>$('s').textContent=t;const load=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});async function startPeer(){if(peer)return;await load('https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js');peer=new Peer();peer.on('open',id=>say(isHost?'iPhone ready · Show QR':'Quest ready · Scan QR'));peer.on('error',()=>say('Connection error · retry QR'));peer.on('connection',attach)}function attach(c){conn=c;c.on('open',()=>{say('CONNECTED · dual camera link');send({type:'hello'});$('sc').disabled=false});c.on('data',d=>{if(d.type==='hello')say('CONNECTED · dual camera link');if(d.type==='frame')remotePts=d.points||[]});c.on('close',()=>say('Device disconnected'))}function send(d){if(conn&&conn.open)try{conn.send(d)}catch(e){}}async function showQR(){await startPeer();await load('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js');const q=qrcode(0,'M');q.addData(location.href.split('?')[0]+'?host='+encodeURIComponent(peer.id));q.make();const c=$('qc'),x=c.getContext('2d'),n=q.getModuleCount(),z=Math.floor(720/(n+8));c.width=c.height=(n+8)*z;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';for(let y=0;y<n;y++)for(let X=0;X<n;X++)if(q.isDark(y,X))x.fillRect((X+4)*z,(y+4)*z,z,z);$('pair').textContent='PAIR '+peer.id.slice(-6).toUpperCase()}$('co').onclick=async()=>{$('pm').classList.add('on');try{await showQR()}catch(e){$('pair').textContent='QR unavailable'}};$('x').onclick=()=>$('pm').classList.remove('on');async function scanQR(){await load('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js');$('qm').classList.add('on');try{const v=$('qv'),st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});v.srcObject=st;await v.play();const cv=document.createElement('canvas'),x=cv.getContext('2d',{willReadFrequently:true});const loop=()=>{if(!$('qm').classList.contains('on')){st.getTracks().forEach(t=>t.stop());return}if(!v.videoWidth)return requestAnimationFrame(loop);cv.width=v.videoWidth;cv.height=v.videoHeight;x.drawImage(v,0,0);const w=cv.width,h=cv.height,d=x.getImageData(0,0,w,h),code=jsQR(d.data,w,h,{inversionAttempts:'attemptBoth'});if(code)try{const u=new URL(code.data),id=u.searchParams.get('host');if(id){st.getTracks().forEach(t=>t.stop());$('qm').classList.remove('on');startPeer().then(()=>{const c=peer.connect(id,{reliable:true});attach(c)}) ;return}}catch(e){}requestAnimationFrame(loop)};loop()}catch(e){$('qs').textContent='Camera permission denied'}}$('q').onclick=scanQR;$('qx').onclick=()=>$('qm').classList.remove('on');async function boot(){if(renderer)return;await load('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');await load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js');scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.01,100);camera.position.set(0,0,4);renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=.08;const grid=new THREE.GridHelper(10,20,0x18304a,0x0a111b);scene.add(grid);mapGroup=new THREE.Group();scene.add(mapGroup);renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}async function cameraStart(){if(stream)return true;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:960},height:{ideal:540}},audio:false});video=document.createElement('video');video.muted=true;video.playsInline=true;video.srcObject=stream;await video.play();return true}catch(e){say('Camera permission required');return false}}function imagePoints(){const w=240,h=180,cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(video,0,0,w,h);const d=x.getImageData(0,0,w,h).data,out=[];for(let y=2;y<h-2;y+=3)for(let X=2;X<w-2;X+=3){const i=(y*w+X)*4,r=d[i],g=d[i+1],b=d[i+2],l=(.299*r+.587*g+.114*b)/255;const gx=Math.abs(d[i]-d[i-4])+Math.abs(d[i]-d[i+4]);const gy=Math.abs(d[i]-d[i-4*w])+Math.abs(d[i]-d[i+4*w]);const edge=(gx+gy)/510;if(edge<.035)continue;const z=1.8+(1-l)*2.6;out.push([(X/w-.5)*z,(.5-y/h)*z,z]);if(out.length>=9000)break}return out}function triangulate(a,b){const n=Math.min(a.length,b.length);const out=[];if(!n)return out;for(let i=0;i<n;i++){const p=a[i],q=b[i];const disparity=Math.abs(p[0]-q[0]);if(disparity<.018)continue;const depth=Math.max(.18,Math.min(12,1.0/(disparity*2.5)));const x=(p[0]+q[0])*.5*depth;const y=(p[1]+q[1])*.5*depth;const z=depth;out.push([x,y,z])}return out}function integrate(points){for(const p of points){const k=[Math.round(p[0]/VOX),Math.round(p[1]/VOX),Math.round(p[2]/VOX)].join(',');if(!map.has(k))map.set(k,p);if(map.size>=MAX)break}renderMap()}function renderMap(){mapGroup.clear();if(!map.size)return;const arr=[];for(const p of map.values())arr.push(...p);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));const m=new THREE.PointsMaterial({color:0x7fc8ff,size:.035,transparent:true,opacity:.72,depthWrite:true});mapGroup.add(new THREE.Points(g,m));$('st').textContent=`Quest ${localPts.length} · iPhone ${remotePts.length} · 3D points ${map.size.toLocaleString()} · mapping live`;$('bu').disabled=map.size<20}async function spatial(){await boot();if(!await cameraStart())return;$('re').disabled=false;$('sc').disabled=false;say(conn?.open?'DUAL 3D MAPPING LIVE':'3D MAPPING LIVE · connect second device for stereo');let last=0;const loop=t=>{if(!stream)return;if(t-last<100){requestAnimationFrame(loop);return}last=t;localPts=imagePoints();send({type:'frame',points:localPts});if(remotePts.length){const stereo=triangulate(localPts,remotePts);integrate(stereo)}else{const mono=localPts.map(p=>[p[0],p[1],p[2]]);integrate(mono)}if(recording)frames.push({local:localPts,remote:remotePts});requestAnimationFrame(loop)};requestAnimationFrame(loop)}$('sc').onclick=spatial;function build(){if(map.size<20){say('Scan more space first');return}say(`Hologram built · ${map.size.toLocaleString()} mapped points`);$('pl').disabled=false}$('bu').onclick=build;$('cl').onclick=()=>{map.clear();mapGroup.clear();frames=[];say('3D map cleared');$('bu').disabled=true};$('re').onclick=()=>{recording=!recording;$('re').textContent=recording?'Stop':'Record';if(recording){frames=[];say('Recording every spatial frame')}else say(`${frames.length} spatial frames recorded`)};$('pl').onclick=()=>say('Playback ready · use the 3D view controls');(async()=>{await startPeer();say(isHost?'iPhone ready · Show QR':'Quest ready · Scan QR')})();</script></body></html>
