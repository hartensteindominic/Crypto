<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HyperStream Advanced Spatial</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02050a;color:#eef;font:14px system-ui}#view{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;left:10px;right:10px;bottom:10px;z-index:5;padding:9px;border:1px solid #ffffff18;border-radius:17px;background:#090d14ed;backdrop-filter:blur(12px)}button{border:0;border-radius:10px;padding:9px 11px;margin:2px;background:#176fc1;color:#fff;font-weight:700}button:disabled{opacity:.35}.status{color:#bde5ff}.small{font-size:12px;color:#93a1b2}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000e;align-items:center;justify-content:center;padding:14px}.on{display:flex}.card{width:min(430px,100%);padding:16px;border-radius:18px;background:#151a21;text-align:center}.qr{width:250px;height:250px;margin:10px auto;background:#fff;padding:7px}.qr canvas{width:100%;height:100%}video{width:100%;max-height:55vh;border-radius:14px;object-fit:cover}</style></head><body><canvas id=view></canvas><div class=ui><div class=status id=status>HyperStream ready</div><div><button id=scan>Scan QR</button><button id=show>Show QR</button><button id=start>Start Spatial</button><button id=flip>Flip iPhone</button><button id=rec disabled>Record</button><button id=build disabled>Build Hologram</button><button id=play disabled>Play</button><button id=clear>Clear</button></div><div class=small id=stats>Quest 0 · iPhone 0 · XYZ 0 · Depth 0% · Solid 0% · 4D state 0%</div></div><div class=modal id=qrbox><div class=card><h3>Connect Quest</h3><div class=qr><canvas id=qrcode></canvas></div><div id=pair>Preparing…</div><button id=closeqr>Close</button></div></div><div class=modal id=scanbox><div class=card><h3>Scan Quest QR</h3><video id=scanvideo autoplay playsinline muted></video><p id=scanmsg class=small>Point the iPhone at the QR.</p><button id=closescan>Cancel</button></div></div><script>const $=x=>document.getElementById(x);let peer,conn,scene,camera,renderer,controls,stream,video,front=false,running=false,recording=false,local=[],remote=[],vox=new Map(),frames=0,last=0,lastRender=0;const VOX=.075,MAX=12000,DEPTH=110;const say=t=>$('status').textContent=t;const load=u=>new Promise((ok,no)=>{if(document.querySelector(`script[src="${u}"]`))return ok();let s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});async function net(){if(peer)return;try{await load('https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js');peer=new Peer();peer.on('open',()=>say(location.search.includes('host')?'iPhone ready · Show QR':'Quest ready · Scan QR'));peer.on('connection',bind);peer.on('error',()=>say('Connection error · scan QR again'))}catch(e){say('Local mode · connection library unavailable')}}function bind(c){conn=c;c.on('open',()=>{say('CONNECTED · synchronized camera stream');$('start').disabled=false;try{c.send({t:'hello'})}catch(e){}});c.on('data',d=>{if(d.t==='frame')remote=d.f||[];if(d.t==='hello')say('CONNECTED · synchronized camera stream')});c.on('close',()=>say('Quest disconnected · spatial volume preserved'))}async function makeQR(){await net();await load('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js');let q=qrcode(0,'M');q.addData(location.href.split('?')[0]+'?host='+encodeURIComponent(peer.id));q.make();let c=$('qrcode'),x=c.getContext('2d'),n=q.getModuleCount(),z=Math.floor(720/(n+8));c.width=c.height=(n+8)*z;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';for(let y=0;y<n;y++)for(let X=0;X<n;X++)if(q.isDark(y,X))x.fillRect((X+4)*z,(y+4)*z,z,z);$('pair').textContent='PAIR '+peer.id.slice(-7).toUpperCase()}$('show').onclick=async()=>{$('qrbox').classList.add('on');try{await makeQR()}catch(e){$('pair').textContent='QR unavailable'}};$('closeqr').onclick=()=>$('qrbox').classList.remove('on');async function scanQR(){try{await load('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js');$('scanbox').classList.add('on');let v=$('scanvideo'),s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});v.srcObject=s;await v.play();let cv=document.createElement('canvas'),x=cv.getContext('2d',{willReadFrequently:true});let loop=()=>{if(!$('scanbox').classList.contains('on')){s.getTracks().forEach(t=>t.stop());return}if(!v.videoWidth)return requestAnimationFrame(loop);cv.width=v.videoWidth;cv.height=v.videoHeight;x.drawImage(v,0,0);let d=x.getImageData(0,0,cv.width,cv.height),q=jsQR(d.data,cv.width,cv.height,{inversionAttempts:'attemptBoth'});if(q)try{let u=new URL(q.data),id=u.searchParams.get('host');if(id){s.getTracks().forEach(t=>t.stop());$('scanbox').classList.remove('on');net().then(()=>{if(peer)bind(peer.connect(id,{reliable:true}))});return}}catch(e){}requestAnimationFrame(loop)};loop()}catch(e){$('scanmsg').textContent='Camera permission required'}}$('scan').onclick=scanQR;$('closescan').onclick=()=>$('scanbox').classList.remove('on');async function init3d(){if(renderer)return;try{await load('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');await load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js');scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.01,100);camera.position.set(0,1,5);renderer=new THREE.WebGLRenderer({canvas:$('view'),antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.35));renderer.setSize(innerWidth,innerHeight);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=.02;scene.add(new THREE.GridHelper(12,24,0x142a40,0x080d14));renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}catch(e){say('3D engine failed to load')}}async function startCamera(onFront=front){if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:onFront?'user':{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video=video||document.createElement('video');video.srcObject=stream;video.muted=true;video.playsInline=true;await video.play();say(`iPhone ${onFront?'front':'back'} camera · collecting`);return true}catch(e){say('Camera permission required');return false}}$('flip').onclick=async()=>{front=!front;await startCamera(front);if(running)say(`REVERSE ${front?'FRONT':'BACK'} VIEW · continuing fusion`);else say(`iPhone ${front?'front':'back'} selected`)};function sample(){let w=320,h=240,cv=document.createElement('canvas');cv.width=w;cv.height=h;let x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(video,0,0,w,h);let d=x.getImageData(0,0,w,h).data,a=[];for(let y=8;y<h-8;y+=6)for(let X=8;X<w-8;X+=6){let i=(y*w+X)*4,g=.299*d[i]+.587*d[i+1]+.114*d[i+2],gx=Math.abs(d[i]-d[i-4])+Math.abs(d[i]-d[i+4])+Math.abs(d[i]-d[i-4*w])+Math.abs(d[i]-d[i+4*w]);if(gx<28)continue;let desc=[];for(let dy=-5;dy<=5;dy+=2)for(let dx=-5;dx<=5;dx+=2){let j=((y+dy)*w+X+dx)*4;desc.push((.299*d[j]+.587*d[j+1]+.114*d[j+2])-g)}a.push({x:X,y,edge:gx,d:desc,r:d[i],g:d[i+1],b:d[i+2]})}return a.sort((a,b)=>b.edge-a.edge).slice(0,520)}function matches(a,b){let out=[],used=new Set();for(let p of a){let bi=-1,be=1e9;for(let j=0;j<b.length;j++){if(used.has(j))continue;let q=b[j],dx=q.x-p.x,dy=q.y-p.y;if(Math.abs(dx)>150||Math.abs(dy)>105)continue;let e=dx*dx+dy*dy;for(let k=0;k<p.d.length;k++)e+=Math.abs(p.d[k]-q.d[k])*.7;if(e<be){be=e;bi=j}}if(bi>=0&&be<12000){used.add(bi);out.push([p,b[bi],be])}}return out}function stereo(a,b){let m=matches(a,b),o=[];for(let [p,q,e] of m){let disp=Math.abs(p.x-q.x);if(disp<2||disp>150)continue;let z=Math.max(.35,Math.min(10,DEPTH/disp)),x=((p.x+q.x)/2-160)/120*z,y=(120-(p.y+q.y)/2)/120*z,conf=Math.max(.15,Math.min(1,1-e/12000));o.push({x,y,z,conf,color:[p.r/255,p.g/255,p.b/255],source:'stereo'})}return o}function mono(a){return a.map(p=>{let z=2+(1-Math.min(1,p.edge/650))*4;return{x:(p.x-160)/120*z,y:(120-p.y)/120*z,z,conf:.18+Math.min(.28,p.edge/1200),color:[p.r/255,p.g/255,p.b/255],source:'mono'}})}function integrate(points){for(let p of points){let k=`${Math.round(p.x/VOX)},${Math.round(p.y/VOX)},${Math.round(p.z/VOX)}`,v=vox.get(k);if(v){let ox=v.x,oy=v.y,oz=v.z,w=.12+.25*p.conf;v.x+=(p.x-v.x)*w;v.y+=(p.y-v.y)*w;v.z+=(p.z-v.z)*w;v.conf=.78*v.conf+.22*p.conf;v.color=v.color.map((c,i)=>.84*c+.16*p.color[i]);v.obs=Math.min(255,v.obs+1);v.age=0;v.velocity=Math.min(1,v.velocity*.82+Math.hypot(p.x-ox,p.y-oy,p.z-oz)*.18);v.stereo=v.stereo||p.source==='stereo'}else vox.set(k,{...p,obs:1,age:0,velocity:0,stereo:p.source==='stereo'})}for(let v of vox.values()){v.age++;let obs=Math.min(1,v.obs/7),fresh=Math.max(0,1-v.age/70),stable=1-Math.min(.7,v.velocity),depthConf=v.stereo?Math.min(1,v.conf+.25):v.conf;v.state=Math.max(0,Math.min(1,.42*depthConf+.28*obs+.18*fresh+.12*stable));v.solid=Math.max(0,Math.min(1,.55*v.conf+.25*obs+.2*stable));v.keep=v.solid>.20&&fresh>.015}if(vox.size>MAX){let a=[...vox.values()].filter(v=>v.keep).sort((a,b)=>(b.state+b.obs*.003)-(a.state+a.obs*.003));vox=new Map(a.slice(0,MAX).map(v=>[`${Math.round(v.x/VOX)},${Math.round(v.y/VOX)},${Math.round(v.z/VOX)}`,v]))}render()}function render(){if(!renderer||performance.now()-lastRender<55)return;lastRender=performance.now();let p=[],c=[];for(let v of vox.values()){if(!v.keep)continue;let q=.35+.65*v.state,depth=Math.max(.65,Math.min(1.4,1/(.65+.08*v.z)));p.push(v.x,v.y,v.z);c.push(.025+.055*q,.15+.42*q,.34+.58*q*depth)}if(window.mesh){scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose()}let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));window.mesh=new THREE.Points(g,new THREE.PointsMaterial({size:.026,vertexColors:true,transparent:true,opacity:.94,depthWrite:true,sizeAttenuation:true}));scene.add(mesh);let a=[...vox.values()],d=a.length?a.reduce((s,v)=>s+v.state,0)/a.length:0,z=a.length?a.reduce((s,v)=>s+v.conf,0)/a.length:0,so=a.length?a.reduce((s,v)=>s+v.solid,0)/a.length:0;$('stats').textContent=`Quest ${remote.length} · iPhone ${local.length} · XYZ ${vox.size} · Depth ${Math.round(z*100)}% · Solid ${Math.round(so*100)}% · 4D state ${Math.round(d*100)}%`;$('build').disabled=vox.size<30}async function spatial(){await init3d();if(!await startCamera(front))return;running=true;$('rec').disabled=false;say(conn?.open?'DUAL CAMERA · XYZ + DEPTH VOLUME LIVE':'iPHONE · XYZ + DEPTH LIVE · waiting for Quest');let t0=0;let loop=t=>{if(!running)return;if(t-t0<55){requestAnimationFrame(loop);return}t0=t;local=sample();if(conn?.open)try{conn.send({t:'frame',f:local})}catch(e){}let pts=remote.length?stereo(local,remote):mono(local);integrate(pts);frames++;requestAnimationFrame(loop)};requestAnimationFrame(loop)}$('start').onclick=spatial;$('build').onclick=()=>{render();$('play').disabled=false;say(`Dense cohesive XYZ depth volume · ${vox.size.toLocaleString()} cells`)};$('rec').onclick=()=>{recording=!recording;$('rec').textContent=recording?'Stop':'Record';say(recording?'Recording processed spatial stream':'Processed spatial stream retained')};$('play').onclick=()=>{if(!renderer)return;let s=renderer.domElement.captureStream?.(30);if(!s||!MediaRecorder){say('3D playback ready');return}let chunks=[],r=new MediaRecorder(s);r.ondataavailable=e=>e.data.size&&chunks.push(e.data);r.onstop=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='HyperStream_XYZ_Depth_4D.webm';a.click()};r.start();setTimeout(()=>r.stop(),6000);say('Rendering cohesive XYZ depth video…')};$('clear').onclick=()=>{vox.clear();frames=0;if(window.mesh){scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose();window.mesh=null}$('build').disabled=true;$('play').disabled=true;say('Spatial volume cleared')};net().catch(()=>{});</script></body></html>
