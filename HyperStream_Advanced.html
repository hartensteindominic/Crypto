<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>HyperStream Spatial World</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02050a;color:#eef7ff;font:14px system-ui}#r{position:fixed;inset:0}#u{position:fixed;z-index:2;left:10px;right:10px;bottom:10px;padding:9px;border:1px solid #ffffff22;border-radius:15px;background:#081019eF;backdrop-filter:blur(10px)}button,input{border:0;border-radius:8px;padding:8px;margin:2px}button{background:#176fc1;color:#fff;font-weight:700}input{width:190px;background:#111b25;color:#fff}.s{color:#bde9ff}.m{font-size:12px;color:#91a4b8}</style></head><body><div id=r></div><div id=u><div id=s class=s>HyperStream ready</div><div><input id=url value="ws://192.168.1.100:8787"><button id=c>Connect</button><button id=x>VR</button><button id=map>Map</button><button id=rec>Record</button><button id=ph>Phone</button><button id=save>Save</button><button id=load>Enter</button><button id=clr>Clear</button></div><div id=t class=m>Local · Cells 0 · Mesh 0 · Planes 0 · Images 0 · Frames 0</div></div><script type=module>import*as T from'https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js';const $=i=>document.getElementById(i),S=$('s'),st=v=>S.textContent=v;let sc,ca,re,grp,ws,session,map=0,rec=0,ph=0,vid,stream,frames=0,planes=0,meshes=0,images=0,cells=new Map,hist=[],pose={x:0,y:1.6,z:0},xr=0;const K='hs-cells-v3',Q=.12,N=10000;function init(){sc=new T.Scene;sc.background=new T.Color(0x02050a);ca=new T.PerspectiveCamera(70,innerWidth/innerHeight,.03,100);ca.position.set(0,1.6,3);re=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});re.setPixelRatio(Math.min(devicePixelRatio,1.5));re.setSize(innerWidth,innerHeight);re.xr.enabled=true;$('r').append(re.domElement);sc.add(new T.HemisphereLight(0xb9e7ff,0x071019,1.4));let f=new T.Mesh(new T.PlaneGeometry(20,20),new T.MeshBasicMaterial({color:0x07131d,transparent:true,opacity:.65,side:2}));f.rotation.x=-Math.PI/2;sc.add(f);sc.add(new T.GridHelper(20,40,0x1a4058,0x0d2638));grp=new T.Group;sc.add(grp);re.setAnimationLoop(()=>re.render(sc,ca));addEventListener('resize',()=>{ca.aspect=innerWidth/innerHeight;ca.updateProjectionMatrix();re.setSize(innerWidth,innerHeight)});st('Ready · adaptive spatial cells')}function key(p){return[Math.round(p.x/Q),Math.round(p.y/Q),Math.round(p.z/Q)].join(',')}function add(p){if(!p||![p.x,p.y,p.z].every(Number.isFinite))return;let k=key(p),o=cells.get(k),q=Math.max(0,Math.min(1,p.confidence??.8));if(o){o.x+=.2*(p.x-o.x);o.y+=.2*(p.y-o.y);o.z+=.2*(p.z-o.z);o.q=Math.min(1,.85*o.q+.15*q);o.h=Math.min(255,o.h+1);o.t=p.time||Date.now()}else cells.set(k,{x:p.x,y:p.y,z:p.z,q,h:1,t:p.time||Date.now(),kind:p.kind||'surface'});if(cells.size>N){let a=[...cells.entries()].sort((a,b)=>(b[1].h+b[1].q*8)-(a[1].h+a[1].q*8)).slice(0,N);cells=new Map(a)}}function ingest(d){frames++;planes=Math.max(planes,d.planes||0);meshes=Math.max(meshes,d.meshes||0);if(d.pose)pose={x:+d.pose.x||0,y:+d.pose.y||1.6,z:+d.pose.z||0};if(map)for(let p of d.points||[])add(p);if(rec)hist.push({t:d.time||Date.now(),n:cells.size});if(frames%3===0)draw();stats()}function draw(){while(grp.children.length)grp.remove(grp.children[0]);let a=[...cells.values()];if(!a.length){stats();return}let g=new T.BufferGeometry,p=new Float32Array(a.length*3),c=new Float32Array(a.length*3);for(let i=0;i<a.length;i++){let o=a[i];p.set([o.x,o.y,o.z],i*3);let k=o.kind==='mesh'?1:o.kind==='plane'?.7:.45;c.set([.15+k*.2,.55+k*.3,.8+k*.2],i*3)}g.setAttribute('position',new T.BufferAttribute(p,3));g.setAttribute('color',new T.BufferAttribute(c,3));grp.add(new T.Points(g,new T.PointsMaterial({size:.055,vertexColors:true,transparent:true,opacity:.82,sizeAttenuation:true})));stats()}function stats(){$('t').textContent=`${ws?.readyState===1?'Connected':'Local'} · Cells ${cells.size} · Mesh ${meshes} · Planes ${planes} · Images ${images} · Frames ${frames}${rec?' · REC':''}`}$('c').onclick=()=>{try{ws?.close();ws=new WebSocket($('url').value.trim());ws.onopen=()=>st('Quest connected · spatial stream ready');ws.onerror=()=>st('Connection failed · check relay IP');ws.onclose=()=>st('Disconnected · cells retained');ws.onmessage=e=>{try{ingest(JSON.parse(e.data))}catch(_){}}}catch(e){st(e.message)}};$('x').onclick=async()=>{if(!navigator.xr)return st('WebXR unavailable');try{session=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});await re.xr.setSession(session);xr=1;st('VR active · holographic world');session.onend=()=>xr=0}catch(e){st('VR failed: '+e.message)}};$('map').onclick=()=>{map=!map;$('map').textContent=map?'Map ON':'Map';st(map?'Mapping · voxel fusion active':'Mapping paused · cells retained')};$('rec').onclick=()=>{if(!map)return st('Start Map first');rec=!rec;$('rec').textContent=rec?'Stop':'Record';st(rec?'Recording spatial history':'Recording stopped')};$('ph').onclick=async()=>{if(ph){ph=0;stream?.getTracks().forEach(t=>t.stop());$('ph').textContent='Phone';st('Phone off');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});vid=document.createElement('video');vid.srcObject=stream;vid.playsInline=true;await vid.play();ph=1;$('ph').textContent='Phone ON';st('Phone enrichment active');let cv=document.createElement('canvas'),cx=cv.getContext('2d');cv.width=480;cv.height=270;(function loop(){if(!ph)return;cx.drawImage(vid,0,0,480,270);if(ws?.readyState===1)ws.send(JSON.stringify({type:'phone-image',x:pose.x,y:pose.y,z:pose.z,time:Date.now(),data:cv.toDataURL('image/jpeg',.45).split(',')[1]}));images++;stats();setTimeout(loop,1200)})()}catch(e){st('Phone unavailable: '+e.message)}};$('save').onclick=()=>{localStorage.setItem(K,JSON.stringify({v:3,q:Q,n:N,dimensions:'X Y Z T S',cells:[...cells.values()],planes,meshes,frames,hist,images,at:Date.now()}));st(`Saved ${cells.size} spatial cells`)};$('load').onclick=()=>{try{let d=JSON.parse(localStorage.getItem(K));if(!d)return st('No saved world');cells=new Map;for(let p of d.cells||[])add(p);planes=d.planes||0;meshes=d.meshes||0;frames=d.frames||0;hist=d.hist||[];images=d.images||0;draw();st(`Entered world · ${cells.size} cells`)}catch(e){st('Load failed')}};$('clr').onclick=()=>{cells.clear();hist=[];frames=planes=meshes=images=0;draw();st('World cleared')};init();stats()</script></body></html>
