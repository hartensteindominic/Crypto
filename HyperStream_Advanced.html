<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HyperStream Spatial World</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a;color:#eef7ff;font:14px system-ui}#root{position:fixed;inset:0}#ui{position:fixed;z-index:10;left:10px;right:10px;bottom:10px;padding:10px;border:1px solid #ffffff22;border-radius:16px;background:#081019ef;backdrop-filter:blur(12px)}button,input{border:0;border-radius:9px;padding:9px;margin:2px}button{background:#176fc1;color:#fff;font-weight:700}input{width:220px;background:#111b25;color:#fff}.st{color:#bde9ff}.sm{font-size:12px;color:#91a4b8}.meter{height:3px;background:#102033;margin-top:6px}.meter i{display:block;height:100%;width:0;background:#42b6ff}</style></head><body><div id="root"></div><div id="ui"><div id="s" class="st">HyperStream Spatial World ready</div><div><input id="url" value="ws://192.168.1.100:8787"><button id="connect">Connect Quest</button><button id="xr">Enter VR</button><button id="map">Map</button><button id="rec">Record</button><button id="phone">Phone</button><button id="save">Save Spatial Cells</button><button id="enter">Enter Saved</button><button id="clear">Clear</button></div><div id="stats" class="sm">Disconnected · Cells 0 · Mesh 0 · Planes 0 · Images 0 · Frames 0</div><div class="meter"><i id="m"></i></div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js';const $=id=>document.getElementById(id);let scene,camera,renderer,worldGroup,ws=null,xr=false,mapping=false,recording=false,phone=false,stream=null,frames=0,planes=0,meshes=0,images=0,history=[],cells=new Map(),lastPose={x:0,y:1.6,z:0};const KEY='hyperstream-spatial-cells-v2',CELL=.10,MAX=14000;init();function st(t){$('s').textContent=t}function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x02050a);camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.03,100);camera.position.set(0,1.6,3);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;$('root').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xb9e7ff,0x071019,1.8));const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshBasicMaterial({color:0x07131d,transparent:true,opacity:.72,side:THREE.DoubleSide}));floor.rotation.x=-Math.PI/2;scene.add(floor);const grid=new THREE.GridHelper(20,40,0x1a4058,0x0d2638);grid.position.y=.002;scene.add(grid);worldGroup=new THREE.Group();scene.add(worldGroup);renderer.setAnimationLoop(render);addEventListener('resize',resize);st('Ready · spatial-cell engine active')}function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}function cellKey(x,y,z){return `${Math.round(x/CELL)},${Math.round(y/CELL)},${Math.round(z/CELL)}`}function addCell(p){if(!p||![p.x,p.y,p.z].every(Number.isFinite))return;const k=cellKey(p.x,p.y,p.z),conf=Math.max(0,Math.min(1,p.confidence??.8)),old=cells.get(k);if(old){old.x+=.18*(p.x-old.x);old.y+=.18*(p.y-old.y);old.z+=.18*(p.z-old.z);old.confidence=Math.max(old.confidence,conf);old.hits=Math.min(255,old.hits+1);old.last=p.time||Date.now();if(p.kind)old.kind=p.kind}else cells.set(k,{x:p.x,y:p.y,z:p.z,kind:p.kind||'surface',confidence:conf,hits:1,last:p.time||Date.now()});if(cells.size>MAX){const keep=[...cells.entries()].sort((a,b)=>b[1].hits-a[1].hits).slice(0,MAX);cells=new Map(keep)}}function ingest(d){frames++;planes=Math.max(planes,d.planes||0);meshes=Math.max(meshes,d.meshes||0);if(d.pose){lastPose={x:+d.pose.x||0,y:+d.pose.y||1.6,z:+d.pose.z||0}}for(const p of d.points||[])addCell(p);if(recording)history.push({time:d.time||Date.now(),cells:cells.size,planes,meshes});rebuild()}function rebuild(){while(worldGroup.children.length)worldGroup.remove(worldGroup.children[0]);const a=[...cells.values()];if(a.length){const pos=new Float32Array(a.length*3),sizes=new Float32Array(a.length);for(let i=0;i<a.length;i++){pos[i*3]=a[i].x;pos[i*3+1]=a[i].y;pos[i*3+2]=a[i].z;sizes[i]=a[i].kind==='mesh'?.055:a[i].kind==='plane'?.075:.045}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));const mat=new THREE.PointsMaterial({color:0x55bce8,size:.05,sizeAttenuation:true,transparent:true,opacity:.82});worldGroup.add(new THREE.Points(geo,mat));}updateStats()}function render(){renderer.render(scene,camera);if(xr&&renderer.xr.isPresenting){const p=renderer.xr.getCamera().position;lastPose={x:p.x,y:p.y,z:p.z}}}function updateStats(){$('stats').textContent=`${ws?.readyState===1?'CONNECTED':'Local'} · Cells ${cells.size} · Mesh ${meshes} · Planes ${planes} · Images ${images} · Frames ${frames}${recording?' · REC':''}`;$('m').style.width=Math.min(100,cells.size/MAX*100)+'%'}$('connect').onclick=()=>{try{ws?.close();ws=new WebSocket($('url').value.trim());ws.onopen=()=>st('QUEST CONNECTED · saving spatial cells');ws.onclose=()=>st('Quest disconnected · spatial cells retained');ws.onerror=()=>st('Connection failed · verify relay IP');ws.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='phone-image'){images++;return}ingest(d)}catch(_){}}}catch(e){st('Connection error: '+e.message)}};$('xr').onclick=async()=>{if(!navigator.xr)return st('WebXR unavailable · use Quest Browser');try{const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});renderer.xr.setSession(s);xr=true;st('VR ACTIVE · spatial cells visible');s.addEventListener('end',()=>{xr=false;st('VR ended · cells retained')})}catch(e){st('VR start failed: '+e.message)}};$('map').onclick=()=>{mapping=!mapping;$('map').textContent=mapping?'Mapping ON':'Map';st(mapping?'MAPPING ACTIVE · incoming geometry is being voxelized into spatial cells':'Mapping paused · cells retained');updateStats()};$('rec').onclick=()=>{if(!mapping)return st('Start Map first');recording=!recording;$('rec').textContent=recording?'Stop Record':'Record';st(recording?'RECORDING CELL HISTORY':'Recording stopped · cells retained')};$('phone').onclick=async()=>{if(phone){phone=false;stream?.getTracks().forEach(t=>t.stop());$('phone').textContent='Phone';st('Phone off');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});const v=document.createElement('video');v.srcObject=stream;v.playsInline=true;await v.play();phone=true;$('phone').textContent='Phone ON';st('PHONE ENRICHMENT ACTIVE · imagery follows current spatial position');const cap=document.createElement('canvas');cap.width=640;cap.height=360;const cx=cap.getContext('2d');(function loop(){if(!phone)return;cx.drawImage(v,0,0,640,360);if(ws?.readyState===1)ws.send(JSON.stringify({type:'phone-image',data:cap.toDataURL('image/jpeg',.5).split(',')[1],x:lastPose.x,y:lastPose.y,z:lastPose.z,time:Date.now()}));images++;updateStats();setTimeout(loop,1000)})()}catch(e){st('Phone camera unavailable: '+e.message)}};$('save').onclick=()=>{const d={version:2,dimensions:['X','Y','Z','T','S'],created:Date.now(),cellSize:CELL,maxCells:MAX,planes,meshes,frames,history,cells:[...cells.values()]};localStorage.setItem(KEY,JSON.stringify(d));st(`SPATIAL CELLS SAVED · ${cells.size} cells`)};$('enter').onclick=()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(!d)return st('No saved spatial world');cells.clear();for(const p of d.cells||[])addCell(p);planes=d.planes||0;meshes=d.meshes||0;frames=d.frames||0;history=d.history||[];rebuild();st(`ENTERED SAVED WORLD · ${cells.size} spatial cells restored`)}catch(e){st('Saved world error: '+e.message)}};$('clear').onclick=()=>{mapping=false;recording=false;cells.clear();history=[];planes=meshes=frames=images=0;rebuild();st('Spatial cells cleared')};updateStats();</script></body></html>
