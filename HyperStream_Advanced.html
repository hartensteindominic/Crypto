<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HyperStream Spatial</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font:14px system-ui}#c{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:10px;border:1px solid #fff2;border-radius:18px;background:#111d;backdrop-filter:blur(18px)}button{border:0;border-radius:11px;padding:10px;margin:3px;background:#1677ff;color:#fff;font-weight:700}button:disabled{opacity:.35}.status{color:#9ad0ff}.small{color:#aaa;font-size:12px}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000e;align-items:center;justify-content:center;padding:15px}.on{display:flex}.card{width:min(430px,100%);background:#18181b;border-radius:20px;padding:16px;text-align:center}.qr{width:230px;height:230px;background:#fff;margin:12px auto}.qr img{width:100%;height:100%}#qv{width:100%;max-height:60vh;object-fit:cover;border-radius:14px}.target{position:absolute;inset:18%;border:3px solid #48a0ff;border-radius:18px}</style></head><body><canvas id=c></canvas><div class=ui><div class=status id=s>Starting…</div><div><button id=q>Scan QR</button><button id=co>Connect</button><button id=sc>Scan</button><button id=re disabled>Record</button><button id=bu disabled>Build Hologram</button><button id=pl disabled>Play</button><button id=cl>Clear</button></div><div class=small id=st>Quest 0 · iPhone 0 · fused 0 · frames 0 · layers 0</div></div><div class=modal id=pm><div class=card><h2>Pair iPhone</h2><div class=qr><img id=qi></div><b id=pc>------</b><p class=small id=ps>Waiting for iPhone…</p><button id=x>Close</button></div></div><div class=modal id=qm><div class=card><h2>Scan QR</h2><div style="position:relative"><video id=qv autoplay playsinline muted></video><div class=target></div></div><p class=small id=qs>Center the QR in the box.</p><button id=qx>Cancel</button></div></div><script src=https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js></script><script src=https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js></script><script src=https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js></script><script src=https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js></script><script>const $=x=>document.getElementById(x);let scn,cam,ren,ctl,peer,conn,id,stream,remoteStream,qrStream,frames=[],recording=false,rec,chunks=[],world,local=0,remote=0,fused=0;const L=9,MAX=120000;function msg(x){$('s').textContent=x}function material(z,o){return new THREE.PointsMaterial({size:z,vertexColors:true,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false})}function init(){scn=new THREE.Scene();scn.fog=new THREE.FogExp2(0,0.0018);cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.03,500);cam.position.set(0,1,7);ren=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true});ren.setPixelRatio(Math.min(devicePixelRatio||1,1.6));ren.setSize(innerWidth,innerHeight);ctl=new THREE.OrbitControls(cam,ren.domElement);ctl.enableDamping=true;ctl.autoRotate=true;scn.add(new THREE.GridHelper(12,24,0x204080,0x101015));ren.setAnimationLoop(()=>{ctl.update();ren.render(scn,cam)});addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});host()}function host(){peer=new Peer();peer.on('open',x=>{id=x;msg('Ready · Quest spatial node')});peer.on('connection',c=>attach(c))}function attach(c){conn=c;c.on('open',()=>{msg('iPhone connected · cameras synchronized');$('ps').textContent='iPhone connected';c.send({t:'ready'})});c.on('data',d=>{if(d.t==='spatial')receive(d);if(d.t==='hello')msg('iPhone camera active')});c.on('close',()=>msg('iPhone disconnected'))}async function camera(v){if(!navigator.mediaDevices?.getUserMedia)throw Error();for(const x of [{video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false},{video:true,audio:false}])try{let z=await navigator.mediaDevices.getUserMedia(x);v.srcObject=z;v.muted=true;await v.play();return z}catch(e){}throw Error()}function points(v,w=240,step=2){let h=Math.max(120,Math.round((v.videoHeight||720)/(v.videoWidth||1280)*w)),c=document.createElement('canvas');c.width=w;c.height=h;let x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,w,h);let d=x.getImageData(0,0,w,h).data,p=[],col=[];for(let y=2;y<h-2;y+=step)for(let X=2;X<w-2;X+=step){let i=(y*w+X)*4,r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,l=.299*r+.587*g+.114*b;if(l<.025||l>.985)continue;let edge=Math.abs((.299*d[i-4]+.587*d[i-3]+.114*d[i-2])-(.299*d[i+4]+.587*d[i+5]+.114*d[i+6]))/255;let z=(1-l)*4.8+edge*2-2.4;p.push((X/w-.5)*4,(.5-y/h)*3+.25,z);col.push(r,g,b)}return[p,col]}function cloud(p,c,size=.045,opacity=.9){let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));let o=new THREE.Points(g,material(size,opacity));scn.add(o);return o}async function startQuest(){if(stream)return;let v=document.createElement('video');stream=await camera(v);msg('Quest camera scanning · move around space');function loop(){if(!stream)return;let [p,c]=points(v);local=p.length/3;setLocal(p,c);if(recording)frames.push({p,c,src:'quest',t:performance.now()});if(conn?.open)conn.send({t:'spatial',p,c,n:local,t:performance.now()});stats();requestAnimationFrame(loop)}loop()}function setLocal(p,c){if(window.lp){scn.remove(window.lp);window.lp.geometry.dispose()}window.lp=cloud(p,c,.04,.8)}function receive(d){remote=d.n||0;if(window.rp){scn.remove(window.rp);window.rp.geometry.dispose()}window.rp=cloud(d.p,d.c,.04,.8);if(recording)frames.push({p:d.p,c:d.c,src:'iphone',t:d.t||performance.now()});fused=local+remote;stats()}function stats(){$('st').textContent=`Quest ${local.toLocaleString()} · iPhone ${remote.toLocaleString()} · fused ${fused.toLocaleString()} · frames ${frames.length} · layers ${L}`}function build(){if(!frames.length)return msg('Record first');if(world){scn.remove(world);world.geometry.dispose()}let p=[],c=[],n=Math.min(frames.length,120);for(let f=0;f<frames.length;f+=Math.max(1,Math.floor(frames.length/n))){let a=frames[f],off=(f/(frames.length-1||1)-.5)*2.5;for(let i=0;i<a.p.length&&p.length/3<MAX;i+=3){p.push(a.p[i],a.p[i+1],a.p[i+2]+off);c.push(a.c[i],a.c[i+1],a.c[i+2])}}world=cloud(p,c,.052,.95);for(let k=1;k<L;k++){let lp=[],lc=[];for(let i=k*3;i<p.length;i+=L*3){lp.push(p[i],p[i+1],p[i+2]);lc.push(c[i],c[i+1],c[i+2])}cloud(lp,lc,.032+k*.002,.12)}$('bu').disabled=false;msg(`Hologram ready · ${(p.length/3).toLocaleString()} fused nodes · ${L} layers`);stats()}$('sc').onclick=async()=>{try{await startQuest();$('re').disabled=false}catch(e){msg('Camera permission required')}};$('re').onclick=()=>{recording=!recording;$('re').textContent=recording?'Stop':'Record';if(recording){frames=[];chunks=[];let ms=ren.domElement.captureStream?.(30);if(ms&&MediaRecorder){rec=new MediaRecorder(ms);rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{$('pl').dataset.u=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));$('pl').disabled=false};rec.start()}msg('Recording Quest + iPhone spatial fusion')}else{rec?.stop();$('bu').disabled=!frames.length;msg(`${frames.length} synchronized frames captured`);stats()}};$('bu').onclick=build;$('pl').onclick=()=>{let u=$('pl').dataset.u;if(u)window.open(u)};$('cl').onclick=()=>{frames=[];if(world){scn.remove(world);world=null}msg('Spatial memory cleared');stats()};function link(){return location.href.split('?')[0]+'?host='+encodeURIComponent(id)}$('co').onclick=()=>{if(!id)return msg('Preparing connection…');$('qi').src='https://api.qrserver.com/v1/create-qr-code/?size=600x600&data='+encodeURIComponent(link());$('pc').textContent=id.slice(-6).toUpperCase();$('pm').classList.add('on')};$('x').onclick=()=>$('pm').classList.remove('on');$('q').onclick=scanQR;$('qx').onclick=()=>{qrStream?.getTracks().forEach(t=>t.stop());qrStream=null;$('qm').classList.remove('on')};async function scanQR(){$('qm').classList.add('on');let v=$('qv');try{qrStream=await camera(v)}catch(e){$('qs').textContent='Allow camera access on Quest';return}let c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true}),bd='';async function loop(){if(!$('qm').classList.contains('on'))return;c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);let q=null;try{if('BarcodeDetector'in window){let b=new BarcodeDetector({formats:['qr_code']});let z=await b.detect(c);if(z[0])q=z[0].rawValue}}catch(e){}if(!q&&window.jsQR){let n=Math.min(c.width,c.height),sx=(c.width-n)/2,sy=(c.height-n)/2,d=x.getImageData(sx,sy,n,n);let z=jsQR(d.data,n,n,{inversionAttempts:'attemptBoth'});q=z?.data}if(q&&q!==bd){bd=q;try{let u=new URL(q),h=u.searchParams.get('host');if(h){qrStream.getTracks().forEach(t=>t.stop());qrStream=null;$('qm').classList.remove('on');connectTo(h);return}}catch(e){}}requestAnimationFrame(loop)}loop()}function connectTo(host){msg('QR recognized · connecting…');peer=new Peer();peer.on('open',()=>{conn=peer.connect(host,{reliable:true});conn.on('open',async()=>{msg('Connected · starting iPhone camera');let v=document.createElement('video');try{remoteStream=await camera(v);sendPhone(v)}catch(e){msg('iPhone camera permission required')}});conn.on('data',d=>{if(d.t==='ready')msg('Connected · spatial cameras synced')})});peer.on('error',e=>msg('Connection failed · scan QR again'))}function sendPhone(v){msg('iPhone camera active · sending spatial data');function loop(){if(!conn?.open)return;let [p,c]=points(v,220,3);remote=p.length/3;conn.send({t:'spatial',p,c,n:remote,t:performance.now()});stats();setTimeout(loop,100)}loop()}let host=new URLSearchParams(location.search).get('host');if(host)connectTo(host);else init();</script></body></html>
