<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>HyperStream Spatial</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font:14px system-ui,-apple-system,sans-serif}#c{position:fixed;inset:0;width:100%;height:100%}.top{position:fixed;z-index:5;top:12px;left:14px;font-weight:800}.ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:11px;border:1px solid #fff2;border-radius:18px;background:#111d;backdrop-filter:blur(18px)}button{border:0;border-radius:11px;padding:10px;margin:3px;background:#286cff;color:#fff;font-weight:700}button:disabled{opacity:.35}.row{display:flex;gap:4px;flex-wrap:wrap}.status{padding:3px;color:#9ad0ff}.small{color:#aaa;font-size:12px}.modal{display:none;position:fixed;z-index:20;inset:0;background:#000e;align-items:center;justify-content:center;padding:18px}.modal.on{display:flex}.card{width:min(430px,100%);background:#18181b;border:1px solid #fff2;border-radius:20px;padding:17px;text-align:center}.qrbox{width:230px;height:230px;background:#fff;margin:12px auto;border-radius:12px}.qrbox img{width:100%;height:100%}#qrVideo{width:100%;max-height:55vh;object-fit:cover;border-radius:14px;background:#050505}.target{position:absolute;inset:18% 10%;border:3px solid #4da3ff;border-radius:18px;pointer-events:none;box-shadow:0 0 30px #1683ff55}.ok{color:#30d158}.bad{color:#ff453a}</style></head><body><canvas id="c"></canvas><div class="top">HyperStream <span style="opacity:.4">SPATIAL</span></div><div class="ui"><div class="status" id="status">Starting spatial engine…</div><div class="row"><button id="scan">Start Camera</button><button id="record" disabled>Record</button><button id="build" disabled>Build Hologram</button><button id="connect">Show QR</button><button id="scanQR">Scan QR</button><button id="play" disabled>Play Recording</button><button id="clear">Clear</button></div><div class="small" id="stats">Nodes 0 · Layers 0 · Local 0 · Remote 0 · Frames 0 · Device 0</div></div><div class="modal" id="pair"><div class="card"><h2>Spatial Pairing</h2><p class="small">Scan this QR from the other device.</p><div class="qrbox"><img id="qrImg"></div><b id="code">------</b><p class="small" id="pairState">Waiting for second camera…</p><button id="closePair">Close</button><button id="copy">Copy Link</button></div></div><div class="modal" id="qrModal"><div class="card"><h2>Scan Spatial QR</h2><div style="position:relative"><video id="qrVideo" playsinline autoplay muted></video><div class="target"></div></div><p class="small" id="qrState">Point the headset/phone camera at the complete QR.</p><button id="closeQR">Cancel</button></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><script>'use strict';const $=id=>document.getElementById(id);let scene,camera,renderer,controls,peer,conn,peerId,camStream,camVideo,qrStream,recording=false,recorder,chunks=[],frames=[],localN=0,remoteN=0,nodes=[],layers=[],built=null;const MAX=120000,LAYER_COUNT=9;function status(s){$('status').textContent=s}function mat(size,op){return new THREE.PointsMaterial({size,vertexColors:true,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true})}function cloud(name,size,op){let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute([],3));g.setAttribute('color',new THREE.Float32BufferAttribute([],3));let o=new THREE.Points(g,mat(size,op));o.name=name;scene.add(o);return o}function init(){scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x000000,.0016);camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.03,600);camera.position.set(0,1,7);renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.setSize(innerWidth,innerHeight);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.055;controls.autoRotate=true;controls.autoRotateSpeed=.15;scene.add(new THREE.GridHelper(14,28,0x204080,0x101015));nodes=Array.from({length:6},(_,i)=>cloud('node'+i,i<2?.055:.04,i<2?.9:.28));layers=Array.from({length:LAYER_COUNT},(_,i)=>cloud('layer'+i,.028+i*.004,.11));addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});createHost()}function createHost(){try{peer=new Peer();peer.on('open',id=>{peerId=id;status('Ready · Show QR or Scan QR')});peer.on('connection',attach)}catch(e){status('Connection service unavailable')}}function attach(c){conn=c;c.on('open',async()=>{ $('pairState').textContent='Connected · activating both cameras';status('Second device connected · activating camera');await startLocalCamera();if(conn?.open)conn.send({t:'hello'})});c.on('data',d=>{if(d?.t==='spatial')receive(d)});c.on('close',()=>{remoteN=0;status('Second device disconnected');updateStats()})}async function cameraFor(v,qr=false){if(!navigator.mediaDevices?.getUserMedia)throw Error('Camera unavailable');let tries=qr?[{video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false},{video:{width:{ideal:640},height:{ideal:480}},audio:false},{video:true,audio:false}]:[{video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false},{video:{width:{ideal:960},height:{ideal:540}},audio:false},{video:true,audio:false}];let err;for(let c of tries)try{let s=await navigator.mediaDevices.getUserMedia(c);v.srcObject=s;v.muted=true;v.playsInline=true;await v.play();return s}catch(e){err=e}throw err||Error('Camera failed')}async function startLocalCamera(){if(camStream)return true;camVideo=camVideo||document.createElement('video');try{camStream=await cameraFor(camVideo);$('scan').textContent='Camera Active';$('record').disabled=false;startSampling();return true}catch(e){status('Camera permission required');return false}}function startSampling(){if(!camStream||camVideo._hs)return;camVideo._hs=true;sampleLocal()}function sampleLocal(){if(!camStream)return;let w=260,h=Math.max(140,Math.round((camVideo.videoHeight||720)/(camVideo.videoWidth||1280)*w)),c=document.createElement('canvas');c.width=w;c.height=h;let x=c.getContext('2d',{willReadFrequently:true});x.drawImage(camVideo,0,0,w,h);let d=x.getImageData(0,0,w,h).data,p=[],cl=[];for(let y=2;y<h-2;y+=2)for(let xx=2;xx<w-2;xx+=2){let i=(y*w+xx)*4,r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,l=.299*r+.587*g+.114*b;if(l<.025||l>.985)continue;let edge=Math.abs((.299*d[i-4]+.587*d[i-3]+.114*d[i-2])-(.299*d[i+4]+.587*d[i+5]+.114*d[i+6]))/255;let z=(1-l)*5+edge*2.1-2.5;p.push((xx/w-.5)*4.4,(.5-y/h)*3.3+.25,z);cl.push(r,g,b)}localN=p.length/3;setCloud(nodes[0],p,cl);for(let n=1;n<6;n++)setCloud(nodes[n],jitter(p,.012*n),cl);if(recording)pushFrame(p,cl,'local');if(conn?.open)conn.send({t:'spatial',p,c:cl,n:localN});updateStats();setTimeout(sampleLocal,80)}function jitter(a,j){let o=new Array(a.length);for(let i=0;i<a.length;i++)o[i]=a[i]+(Math.random()-.5)*j;return o}function setCloud(o,p,c){o.geometry.setAttribute('position',new THREE.Float32BufferAttribute(p,3));o.geometry.setAttribute('color',new THREE.Float32BufferAttribute(c,3));o.geometry.computeBoundingSphere()}function pushFrame(p,c,s){frames.push({p:p.slice(),c:c.slice(),s});if(frames.length>300)frames.shift()}function receive(d){remoteN=d.n||0;setCloud(nodes[1],d.p||[],d.c||[]);for(let i=2;i<6;i++)setCloud(nodes[i],jitter(d.p||[],.012*i),d.c||[]);if(recording)pushFrame(d.p||[],d.c||[],'remote');updateStats()}function updateStats(){let total=nodes.reduce((s,n)=>s+(n.geometry.attributes.position?.count||0),0);$('stats').textContent=`Nodes ${total.toLocaleString()} · Layers ${layers.length} · Local ${localN.toLocaleString()} · Remote ${remoteN.toLocaleString()} · Frames ${frames.length} · Device ${conn?.open?1:0}`}function buildHologram(){if(!frames.length)return status('Record synchronized spatial data first');if(built){scene.remove(built);built.geometry.dispose();built.material.dispose()}let p=[],c=[],stride=Math.max(1,Math.floor(frames.length/120));for(let fi=0;fi<frames.length;fi+=stride){let f=frames[fi],off=(fi/Math.max(1,frames.length-1)-.5)*3;for(let i=0;i<f.p.length&&p.length/3<MAX;i+=3){p.push(f.p[i],f.p[i+1],f.p[i+2]+off);c.push(f.c[i],f.c[i+1],f.c[i+2])}}let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));built=new THREE.Points(g,mat(.052,.96));scene.add(built);for(let i=0;i<layers.length;i++){let lp=[],lc=[];for(let j=i*3;j<p.length;j+=LAYER_COUNT*3){lp.push(p[j],p[j+1],p[j+2]);lc.push(c[j],c[j+1],c[j+2])}setCloud(layers[i],lp,lc)}$('build').disabled=false;controls.autoRotate=true;status(`Hologram ready · ${(p.length/3).toLocaleString()} nodes · ${layers.length} layers`);updateStats()}$('scan').onclick=()=>startLocalCamera();$('record').onclick=()=>{recording=!recording;$('record').textContent=recording?'Stop Recording':'Record';if(recording){frames=[];status(conn?.open?'Recording both cameras · synchronized spatial capture':'Recording local camera · waiting for second device');let s=renderer.domElement.captureStream?.(30);if(s&&window.MediaRecorder){try{chunks=[];recorder=new MediaRecorder(s,{mimeType:'video/webm'});recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);recorder.onstop=()=>{$('play').dataset.url=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));$('play').disabled=false};recorder.start()}catch(e){}}}else{recorder?.stop();$('build').disabled=!frames.length;status(`${frames.length} synchronized spatial frames captured`)}};$('build').onclick=buildHologram;$('play').onclick=()=>{let u=$('play').dataset.url;if(!u)return;let w=window.open();if(w)w.document.write(`<video src="${u}" controls autoplay style="width:100%;height:100%;background:#000"></video>`)};$('clear').onclick=()=>{frames=[];if(built){scene.remove(built);built.geometry.dispose();built.material.dispose();built=null}nodes.forEach(n=>setCloud(n,[],[]));layers.forEach(l=>setCloud(l,[],[]));$('build').disabled=true;updateStats();status('Spatial memory cleared')};function makeLink(){return location.href.split('?')[0]+'?host='+encodeURIComponent(peerId)}$('connect').onclick=()=>{if(!peerId)return status('Preparing connection…');$('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=600x600&data='+encodeURIComponent(makeLink());$('code').textContent=peerId.slice(-6).toUpperCase();$('pair').classList.add('on')};$('closePair').onclick=()=>$('pair').classList.remove('on');$('copy').onclick=()=>navigator.clipboard?.writeText(makeLink());$('scanQR').onclick=scanQR;async function scanQR(){$('qrModal').classList.add('on');let v=$('qrVideo');try{qrStream=await cameraFor(v,true)}catch(e){$('qrState').textContent='Camera permission required';return}let c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});async function loop(){if(!$('qrModal').classList.contains('on'))return;if(v.readyState>=2){c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);let q=null;try{if('BarcodeDetector'in window){let b=new BarcodeDetector({formats:['qr_code']});let z=await b.detect(c);if(z.length)q={data:z[0].rawValue}}}catch(e){}if(!q&&window.jsQR){let s=Math.min(c.width,c.height),sx=(c.width-s)/2,sy=(c.height-s)/2,img=x.getImageData(sx,sy,s,s);q=jsQR(img.data,s,s,{inversionAttempts:'attemptBoth'})}if(q?.data)try{let u=new URL(q.data),h=u.searchParams.get('host');if(h){$('qrState').textContent='QR recognized · connecting…';closeQR();startClient(h);return}}catch(e){}}requestAnimationFrame(loop)}loop()}function closeQR(){qrStream?.getTracks().forEach(t=>t.stop());qrStream=null;$('qrModal').classList.remove('on')}$('closeQR').onclick=closeQR;function startClient(host){status('QR recognized · connecting…');if(peer)try{peer.destroy()}catch(e){}peer=new Peer();peer.on('open',()=>{status('Connected to session · starting camera…');conn=peer.connect(host,{reliable:true});conn.on('open',async()=>{status('Connected · activating this camera');await startLocalCamera();if(conn?.open)conn.send({t:'hello'})});conn.on('data',d=>{if(d?.t==='spatial')receive(d)});conn.on('close',()=>status('Connection closed'))});peer.on('error',e=>status('Connection failed · scan QR again'))}let host=new URLSearchParams(location.search).get('host');init();if(host)setTimeout(()=>startClient(host),400);</script></body></html>
