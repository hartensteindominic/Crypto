<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>HyperStream World Mapper</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02050a;color:#eef7ff;font:14px system-ui}#v{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:10px;border:1px solid #ffffff22;border-radius:18px;background:#080d14ed;backdrop-filter:blur(12px)}button{border:0;border-radius:10px;padding:9px 11px;margin:2px;background:#176fc1;color:white;font-weight:700}.st{color:#bde9ff}.sm{font-size:12px;color:#91a4b8}.meter{height:3px;background:#102033}.meter i{display:block;height:100%;width:0;background:#42b6ff}</style></head><body><canvas id=v></canvas><div class=ui><div id=s class=st>HyperStream World ready</div><div><button id=map>Map World</button><button id=connect>Connect Quest</button><button id=phone>Phone Enrich</button><button id=save>Save World</button><button id=enter>Enter World</button><button id=clear>Clear</button></div><div id=stats class=sm>Quest XR · Planes 0 · Meshes 0 · Surfaces 0 · XYZ 0 · 5D 0%</div><div class=meter><i id=m></i></div></div><script>(()=>{const $=i=>document.getElementById(i),c=$('v'),g=c.getContext('2d');let W,H,D,session=null,ref=null,run=0,phone=0,world=[],planes=0,meshes=0,frames=0,images=0,pc=null,ch=null,video=null,stream=null;const KEY='hyperstream-world-xr';function st(t){$('s').textContent=t}function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);draw()}addEventListener('resize',size);size();function draw(){g.fillStyle='#02050a';g.fillRect(0,0,W,H);let n=world.length;for(const o of world){let sx=W*.13/(.7+Math.max(.1,o.z)*.08),px=W/2+o.x*sx,py=H/2-o.y*sx;if(px<0||px>W||py<0||py>H)continue;g.globalAlpha=Math.min(.9,.2+o.conf*.7);g.fillStyle=o.kind==='mesh'?'#66d8ff':o.kind==='plane'?'#3888b5':'#315a78';g.fillRect(px-3,py-3,6,6)}g.globalAlpha=1;g.strokeStyle='#173a55';g.strokeRect(W*.12,H*.07,W*.76,H*.78);let cov=Math.min(100,n/30);$('stats').textContent=`Quest XR · Planes ${planes} · Meshes ${meshes} · Surfaces ${n} · XYZ ${n} · 5D ${Math.min(100,(frames?55:0)+(planes?20:0)+(meshes?25:0))}%`;$('m').style.width=cov+'%'}function addPoint(x,y,z,kind,conf=.7){world.push({x,y,z,kind,conf});if(world.length>5000)world.splice(0,world.length-5000);draw()}function matrixPoint(m){if(!m)return null;return{x:m[12]||0,y:m[13]||0,z:m[14]||0}}async function startXR(){if(!navigator.xr)return st('WebXR is not available here. Open this page in Quest Browser.');if(!navigator.xr.isSessionSupported||!(await navigator.xr.isSessionSupported('immersive-vr')))return st('Quest VR session unavailable. Open HyperStream inside Quest Browser.');try{session=await navigator.xr.requestSession('immersive-vr',{requiredFeatures:['local-floor'],optionalFeatures:['bounded-floor','plane-detection','mesh-detection','anchors']});session.addEventListener('end',()=>{run=0;session=null;ref=null;st('Quest mapping ended · world retained');draw()});ref=await session.requestReferenceSpace('local-floor');run=1;frames=0;st('QUEST MAPPING ACTIVE · move slowly around the room');session.requestAnimationFrame(frame)}catch(e){st('Quest mapping failed: '+e.message)}}function frame(t,fr){if(!session||!run)return;frames++;let pose=fr.getViewerPose(ref);if(pose){let p=pose.transform.position;addPoint(p.x,p.y,p.z,'pose',.55)}let wi=fr.worldInformation;if(wi){let ps=wi.detectedPlanes;if(ps){planes=ps.size||ps.length||0;for(const pl of ps){let p=pl.lastChangedTime?null:null;if(pl.planeSpace){try{let sp=fr.getPose(pl.planeSpace,ref);let q=matrixPoint(sp?.transform.matrix);if(q)addPoint(q.x,q.y,q.z,'plane',.85)}catch(_){}}}}let ms=wi.detectedMeshes;if(ms){meshes=ms.size||ms.length||0;for(const me of ms){if(me.meshSpace)try{let sp=fr.getPose(me.meshSpace,ref),q=matrixPoint(sp?.transform.matrix);if(q)addPoint(q.x,q.y,q.z,'mesh',.95)}catch(_){} }}}draw();session.requestAnimationFrame(frame)}$('map').onclick=()=>run?(run=0,st('Mapping paused · world retained')):startXR();$('connect').onclick=async()=>{if(!window.RTCPeerConnection)return st('WebRTC unavailable');try{pc=new RTCPeerConnection();ch=pc.createDataChannel('hyperstream-world');ch.onopen=()=>st('QUEST DATA LINK CONNECTED');ch.onmessage=e=>{try{let d=JSON.parse(e.data);if(d.type==='world'){(d.points||[]).forEach(p=>addPoint(p.x,p.y,p.z,p.kind||'remote',p.conf||.6))}}catch(_){}};let o=await pc.createOffer();await pc.setLocalDescription(o);st('Quest data link created · use your existing QR pairing flow')}catch(e){st('Connection error: '+e.message)}};$('phone').onclick=async()=>{phone=!phone;if(!phone){stream?.getTracks().forEach(t=>t.stop());st('Phone enrichment off');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});video=document.createElement('video');video.srcObject=stream;video.playsInline=true;await video.play();images++;st('PHONE ENRICHMENT ACTIVE · Quest remains primary mapper')}catch(e){phone=0;st('Phone camera unavailable')}};$('save').onclick=()=>{localStorage.setItem(KEY,JSON.stringify({v:8,dimensions:'X Y Z T S',created:Date.now(),planes,meshes,world}));st('WORLD SAVED · '+world.length+' spatial records')};$('enter').onclick=()=>{try{let d=JSON.parse(localStorage.getItem(KEY));if(!d)return st('No saved world yet');world=d.world||[];planes=d.planes||0;meshes=d.meshes||0;draw();st('WORLD LOADED · '+world.length+' spatial records')}catch(e){st('Saved world invalid')}};$('clear').onclick=()=>{world=[];planes=meshes=frames=0;draw();st('World cleared')};draw();st('Ready · Quest-first WebXR mapper')})();</script></body></html>
