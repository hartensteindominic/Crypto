<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>HyperStream World</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02050a;color:#eef7ff;font:14px system-ui}#v{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:10px;border:1px solid #ffffff22;border-radius:18px;background:#080d14ed;backdrop-filter:blur(12px)}button,input{border:0;border-radius:10px;padding:9px;margin:2px}button{background:#176fc1;color:#fff;font-weight:700}input{width:180px;background:#111b25;color:#fff}.st{color:#bde9ff}.sm{font-size:12px;color:#91a4b8}.meter{height:3px;background:#102033}.meter i{display:block;height:100%;width:0;background:#42b6ff}</style></head><body><canvas id=v></canvas><div class=ui><div id=s class=st>HyperStream World ready</div><div><input id=url value="ws://192.168.1.100:8787"><button id=connect>Connect</button><button id=map>Map World</button><button id=rec>Record</button><button id=phone>Phone Enrich</button><button id=save>Save World</button><button id=enter>Enter World</button><button id=clear>Clear</button></div><div id=stats class=sm>Relay offline · Planes 0 · Meshes 0 · Vertices 0 · Images 0 · 5D 0%</div><div class=meter><i id=m></i></div></div><script>(()=>{const $=i=>document.getElementById(i),c=$('v'),g=c.getContext('2d');let W,H,D,ws=null,mapping=false,recording=false,phone=false,planes=0,meshes=0,frames=0,images=0,history=[],pts=[],pics=[],stream,video,lastPose={x:0,y:0,z:0};const KEY='hyperstream-world-native-v2';function st(t){$('s').textContent=t}function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);draw()}addEventListener('resize',size);size();function draw(){g.fillStyle='#02050a';g.fillRect(0,0,W,H);g.strokeStyle='#173a55';g.strokeRect(W*.08,H*.06,W*.84,H*.82);if(!pts.length&&!pics.length){g.fillStyle='#91a4b8';g.textAlign='center';g.font='18px system-ui';g.fillText('Connect Quest, then Map World',W/2,H/2);g.textAlign='left'}const cam={x:0,y:1.5,z:-3};for(const p of pts){let dx=p.x-cam.x,dz=p.z-cam.z,dy=p.y-cam.y;if(dz<=.1)continue;let f=Math.min(W,H)*.7/dz,px=W/2+dx*f,py=H/2-dy*f;if(px<-20||px>W+20||py<-20||py>H+20)continue;let r=p.kind==='mesh'?1.8:p.kind==='plane'?3:2;g.globalAlpha=.2+.75*p.confidence;g.fillStyle=p.kind==='mesh'?'#65d8ff':p.kind==='plane'?'#79a9c8':'#9bb5c7';g.fillRect(px-r,py-r,r*2,r*2)}g.globalAlpha=1;for(const im of pics.slice(-12)){if(!im.img)continue;let dx=im.x-cam.x,dz=im.z-cam.z;if(dz<=.2)continue;let f=Math.min(W,H)*.5/dz,px=W/2+dx*f,py=H/2-(im.y-cam.y)*f,w=Math.max(40,Math.min(150,f*.5)),h=w*.56;try{g.globalAlpha=.8;g.drawImage(im.img,px-w/2,py-h/2,w,h)}catch(_){}}g.globalAlpha=1;let five=Math.min(100,(frames?35:0)+(planes?20:0)+(meshes?30:0)+(pics.length?15:0));$('stats').textContent=`${ws?.readyState===1?'CONNECTED':'Relay offline'} · Planes ${planes} · Meshes ${meshes} · Vertices ${pts.length} · Images ${images} · 5D ${five}%${recording?' · REC':''}`;$('m').style.width=Math.min(100,pts.length/30)+'%'}function addPacket(d){if(!d.points)return;frames++;planes=Math.max(planes,d.planes||0);meshes=Math.max(meshes,d.meshes||0);for(const p of d.points){if(!Number.isFinite(p.x)||!Number.isFinite(p.y)||!Number.isFinite(p.z))continue;pts.push(p);if(p.kind==='camera')lastPose=p}if(pts.length>30000)pts.splice(0,pts.length-30000);if(recording)history.push({t:d.time,planes,meshes,count:pts.length});draw()}function connect(){try{ws?.close();ws=new WebSocket($('url').value.trim());ws.onopen=()=>st('QUEST CONNECTED · native spatial stream active');ws.onclose=()=>st('Quest disconnected · saved world retained');ws.onerror=()=>st('Relay connection failed · check IP/port');ws.onmessage=e=>{try{let d=JSON.parse(e.data);if(d.type==='phone-image'){const im=new Image();im.onload=()=>{pics.push({x:d.x||lastPose.x,y:d.y||lastPose.y,z:d.z||lastPose.z,img:im});images++;draw()};im.src='data:image/jpeg;base64,'+d.data}else addPacket(d)}catch(_){}}}catch(e){st(e.message)}}$('connect').onclick=connect;$('map').onclick=()=>{mapping=!mapping;$('map').textContent=mapping?'Mapping…':'Map World';st(mapping?'QUEST WORLD MAPPING · walk around the room':'Mapping paused · world retained')};$('rec').onclick=()=>{if(!mapping)return st('Start Map World first');recording=!recording;$('rec').textContent=recording?'Stop Record':'Record';st(recording?'RECORDING 3D WORLD HISTORY':'Recording stopped · world retained')};async function startPhone(){if(phone){phone=false;stream?.getTracks().forEach(t=>t.stop());$('phone').textContent='Phone Enrich';st('Phone enrichment off');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:960},height:{ideal:540}},audio:false});video=document.createElement('video');video.srcObject=stream;video.playsInline=true;await video.play();phone=true;$('phone').textContent='Phone Live';st('PHONE ENRICHMENT · sending real images into world');const cap=document.createElement('canvas'),cx=cap.getContext('2d');cap.width=480;cap.height=270;(function loop(){if(!phone)return;cx.drawImage(video,0,0,480,270);let b=cx.canvas.toDataURL('image/jpeg',.45).split(',')[1];if(ws?.readyState===1)ws.send(JSON.stringify({type:'phone-image',data:b,x:lastPose.x,y:lastPose.y,z:lastPose.z,time:Date.now()}));setTimeout(loop,900)})()}catch(e){st('Phone camera unavailable: '+e.message)}}$('phone').onclick=startPhone;$('save').onclick=()=>{const d={v:2,dimensions:'X Y Z T S',created:Date.now(),planes,meshes,points:pts,images:pics.map(p=>({x:p.x,y:p.y,z:p.z})),history};localStorage.setItem(KEY,JSON.stringify(d));st('WORLD SAVED · '+pts.length+' real spatial vertices')};$('enter').onclick=()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(!d)return st('No saved world yet');pts=d.points||[];planes=d.planes||0;meshes=d.meshes||0;history=d.history||[];draw();st('ENTERED SAVED WORLD · '+pts.length+' vertices')}catch(e){st('Saved world invalid')}};$('clear').onclick=()=>{pts=[];pics=[];planes=meshes=frames=images=0;history=[];draw();st('World cleared')};draw();st('Ready · native Quest world engine')})();</script></body></html>
