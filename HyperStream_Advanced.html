<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HyperStream</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020307;color:#fff;font:14px system-ui}#c{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:10px;border:1px solid #ffffff22;border-radius:18px;background:#10131de8;backdrop-filter:blur(14px)}button{border:0;border-radius:11px;padding:10px;margin:3px;background:#1677ff;color:#fff;font-weight:700}button:disabled{opacity:.35}.status{color:#9bd4ff}.small{color:#aaa;font-size:12px}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000e;align-items:center;justify-content:center;padding:15px}.on{display:flex}.card{width:min(430px,100%);background:#181a20;border-radius:20px;padding:16px;text-align:center}.qr{width:260px;height:260px;background:#fff;margin:12px auto;padding:8px}.qr canvas{width:100%;height:100%}#qv{width:100%;max-height:60vh;object-fit:cover;border-radius:14px}.target{position:absolute;inset:18%;border:3px solid #48a0ff;border-radius:18px}</style></head><body><canvas id=c></canvas><div class=ui><div class=status id=s>HyperStream ready</div><div><button id=q>Scan QR</button><button id=co>Show QR</button><button id=sc>Start Spatial</button><button id=re disabled>Record</button><button id=bu disabled>Build Hologram</button><button id=pl disabled>Play</button><button id=cl>Clear</button></div><div class=small id=st>Quest 0 · iPhone 0 · fused 0 · ready</div></div><div class=modal id=pm><div class=card><h2>Connect Quest</h2><div class=qr><canvas id=qc></canvas></div><div id=pair>Preparing QR…</div><p class=small id=ps>Keep this screen open and scan it with Quest.</p><button id=x>Close</button></div></div><div class=modal id=qm><div class=card><h2>Scan QR</h2><div style="position:relative"><video id=qv autoplay playsinline muted></video><div class=target></div></div><p class=small id=qs>Center the iPhone QR in the box.</p><button id=qx>Cancel</button></div></div><script>const $=id=>document.getElementById(id);let peer,conn,id,threeReady=false,stream=null,recording=false,frames=[],local={p:[],c:[]},remote={p:[],c:[]},world=null,rec,chunks=[];const host=!new URLSearchParams(location.search).has('host');const say=x=>{$('s').textContent=x};const load=u=>new Promise((ok,no)=>{let s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});async function peerStart(){if(peer)return;await load('https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js');peer=new Peer(undefined,{debug:0});peer.on('open',x=>{id=x;if(host)say('iPhone ready · Show QR')});peer.on('error',e=>say('Connection error · try Scan QR again'))}async function makeQR(){await peerStart();await load('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js');let u=location.href.split('?')[0]+'?host='+encodeURIComponent(id),q=qrcode(0,'M');q.addData(u);q.make();let cv=$('qc'),ctx=cv.getContext('2d'),n=q.getModuleCount(),sc=Math.floor(720/(n+8));cv.width=cv.height=(n+8)*sc;ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#000';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))ctx.fillRect((x+4)*sc,(y+4)*sc,sc,sc);$('pair').textContent='PAIR '+id.slice(-6).toUpperCase()}async function showQR(){$('pm').classList.add('on');$('pair').textContent='Preparing QR…';try{await makeQR()}catch(e){$('pair').textContent='QR library unavailable';say('QR generator failed · reload once')}}async function boot3(){if(threeReady)return;try{await load('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');await load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js')}catch(e){say('3D engine failed to load');return}window.S=new THREE.Scene();window.C=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.03,200);C.position.set(0,1.2,6);window.R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(devicePixelRatio||1,1.5));R.setSize(innerWidth,innerHeight);window.T=new THREE.OrbitControls(C,R.domElement);T.enableDamping=true;T.autoRotate=true;T.autoRotateSpeed=.3;S.add(new THREE.GridHelper(12,24,0x204060,0x111318));R.setAnimationLoop(()=>{T.update();R.render(S,C)});addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});threeReady=true}function draw(p,c,size,op){let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));let o=new THREE.Points(g,new THREE.PointsMaterial({size,vertexColors:true,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false}));S.add(o);return o}function redraw(){if(!threeReady)return;for(let k of ['qa','ip','fu'])if(window[k]){S.remove(window[k]);window[k]=null}if(local.p.length)window.qa=draw(local.p,local.c,.035,.7);if(remote.p.length)window.ip=draw(remote.p,remote.c,.035,.7);let p=[],c=[],n=Math.min(local.p.length,remote.p.length);for(let i=0;i<n&&p.length<90000;i+=3){p.push((local.p[i]+remote.p[i])*.5,(local.p[i+1]+remote.p[i+1])*.5,(local.p[i+2]+remote.p[i+2])*.5);c.push((local.c[i]+remote.c[i])*.5,(local.c[i+1]+remote.c[i+1])*.5,(local.c[i+2]+remote.c[i+2])*.5)}if(p.length)window.fu=draw(p,c,.055,.9);$('st').textContent=`Quest ${(local.p.length/3)|0} · iPhone ${(remote.p.length/3)|0} · fused ${(p.length/3)|0} · LIVE SPATIAL`}function sample(v){let w=180,h=Math.max(100,Math.round((v.videoHeight/v.videoWidth)*w)),cv=document.createElement('canvas');cv.width=w;cv.height=h;let x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,w,h);let d=x.getImageData(0,0,w,h).data,p=[],c=[];for(let y=2;y<h-2;y+=4)for(let X=2;X<w-2;X+=4){let i=(y*w+X)*4,r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,l=.299*r+.587*g+.114*b;if(l<.03||l>.97)continue;p.push((X/w-.5)*3.5,(.5-y/h)*2.6,(1-l)*4.2-2.1);c.push(r,g,b)}return{p,c}}async function startSpatial(){await peerStart();await boot3();if(stream)return;if(!conn?.open){say(host?'Waiting for Quest connection…':'Connect to iPhone first');return}let v=document.createElement('video');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:360}},audio:false});v.srcObject=stream;await v.play()}catch(e){say('Camera permission required');return}$('re').disabled=false;say('Dual spatial processing active');let last=0;function loop(t){if(!stream)return;if(t-last<100){requestAnimationFrame(loop);return}last=t;local=sample(v);conn.send({t:'spatial',p:local.p,c:local.c});if(recording)frames.push({p:local.p,c:local.c,side:host?'iphone':'quest'});redraw();requestAnimationFrame(loop)}requestAnimationFrame(loop)}function receive(d){if(d?.t!=='spatial')return;remote={p:d.p||[],c:d.c||[]};if(recording)frames.push({p:remote.p,c:remote.c,side:host?'quest':'iphone'});redraw()}async function connect(h){await peerStart();say('Connecting…');conn=peer.connect(h,{reliable:true});conn.on('open',()=>{conn.send({t:'hello'});say('CONNECTED · Quest + iPhone');$('sc').disabled=false});conn.on('data',d=>{if(d.t==='hello')say('CONNECTED · dual spatial link');else receive(d)});conn.on('close',()=>say('Connection closed'))}async function scanQR(){$('qm').classList.add('on');try{await load('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js');let v=$('qv'),st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});v.srcObject=st;await v.play();let cv=document.createElement('canvas'),x=cv.getContext('2d',{willReadFrequently:true});async function loop(){if(!$('qm').classList.contains('on')){st.getTracks().forEach(t=>t.stop());return}cv.width=v.videoWidth;cv.height=v.videoHeight;x.drawImage(v,0,0);let n=Math.min(cv.width,cv.height),sx=(cv.width-n)/2,sy=(cv.height-n)/2,d=x.getImageData(sx,sy,n,n),q=jsQR(d.data,n,n,{inversionAttempts:'attemptBoth'});if(q)try{let u=new URL(q.data),h=u.searchParams.get('host');if(h){st.getTracks().forEach(t=>t.stop());$('qm').classList.remove('on');await connect(h);return}}catch(e){}requestAnimationFrame(loop)}loop()}catch(e){$('qs').textContent='Camera permission required'}}function build(){if(!frames.length){say('Record a session first');return}if(world)S.remove(world);let p=[],c=[];for(let f=0;f<frames.length;f+=Math.max(1,Math.floor(frames.length/100))){let a=frames[f],off=a.side==='iphone'?.7:-.7;for(let i=0;i<a.p.length&&p.length<90000;i+=3){p.push(a.p[i]+off,a.p[i+1],a.p[i+2]+(f/frames.length-.5));c.push(a.c[i],a.c[i+1],a.c[i+2])}}world=draw(p,c,.055,.94);$('pl').disabled=false;say(`Hologram built · ${(p.length/3)|0} nodes`)}function clear(){frames=[];if(world)S.remove(world);world=null;for(let k of ['qa','ip','fu'])if(window[k])S.remove(window[k]);local=remote={p:[],c:[]};say('Spatial map cleared')}$('q').onclick=scanQR;$('co').onclick=showQR;$('x').onclick=()=>$('pm').classList.remove('on');$('qx').onclick=()=>$('qm').classList.remove('on');$('sc').onclick=startSpatial;$('bu').onclick=build;$('cl').onclick=clear;$('re').onclick=()=>{recording=!recording;$('re').textContent=recording?'Stop':'Record';if(recording){frames=[];if(window.MediaRecorder&&R?.domElement.captureStream){rec=new MediaRecorder(R.domElement.captureStream(30));chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{$('pl').dataset.u=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));$('pl').disabled=false};rec.start()}say('Recording dual spatial map')}else{rec?.stop();$('bu').disabled=!frames.length;say(`${frames.length} frames captured`)}};$('pl').onclick=()=>{if($('pl').dataset.u)open($('pl').dataset.u)};$('bu').disabled=true;$('sc').disabled=true;(async()=>{if(host){await peerStart();say('iPhone ready · Show QR');}else{await peerStart();say('Quest ready · Scan QR')}})();</script></body></htm
