<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HyperStream Spatial</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:14px system-ui,sans-serif}#view{position:fixed;inset:0;width:100%;height:100%}.bar{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:10px;border:1px solid #ffffff22;border-radius:18px;background:#111c;backdrop-filter:blur(14px)}button{border:0;border-radius:10px;padding:10px 12px;margin:3px;background:#1677ff;color:#fff;font-weight:700}button:disabled{opacity:.35}.status{color:#9dd5ff;font-weight:700}.stats{color:#aaa;font-size:12px;margin-top:4px}.modal{display:none;position:fixed;z-index:20;inset:0;background:#000d;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.card{width:min(430px,100%);background:#18181b;border-radius:20px;padding:16px;text-align:center}.qr{width:270px;height:270px;margin:10px auto;background:#fff;padding:8px}.qr canvas{width:100%;height:100%}video{width:100%;max-height:55vh;object-fit:cover;border-radius:14px}.scanbox{position:relative}.aim{position:absolute;inset:18%;border:3px solid #4da3ff;border-radius:16px;pointer-events:none}.hint{color:#aaa;font-size:12px}.err{color:#ff9b9b}</style></head><body><canvas id="view"></canvas><div class="bar"><div id="status" class="status">HyperStream ready</div><div><button id="pair">Show QR</button><button id="scan">Scan QR</button><button id="start" disabled>Start Spatial</button><button id="record" disabled>Record</button><button id="build" disabled>Build Hologram</button><button id="play" disabled>Play</button><button id="clear">Clear</button></div><div id="stats" class="stats">Quest 0 · iPhone 0 · fused 0 · frames 0 · layers 8</div></div><div id="pairBox" class="modal"><div class="card"><h2>Connect iPhone → Quest</h2><div class="qr"><canvas id="qr"></canvas></div><div id="code">------</div><p id="pairText" class="hint">On Quest, tap Scan QR and scan this code.</p><button id="closePair">Close</button></div></div><div id="scanBox" class="modal"><div class="card"><h2>Scan iPhone QR</h2><div class="scanbox"><video id="scanner" autoplay playsinline muted></video><div class="aim"></div></div><p id="scanText" class="hint">Center the QR inside the box.</p><button id="closeScan">Cancel</button></div></div><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const isQuest=!!params.get('host');const state={peer:null,conn:null,id:null,cam:null,video:null,connected:false,spatial:false,recording:false,frames:[],remote:[],localCount:0,remoteCount:0,points:[],recorded:[],media:null,chunks:[],renderer:null,scene:null,camera:null,controls:null,ready3:false};const LAYERS=8,MAX=90000;function status(t,err=false){$('status').textContent=t;$('status').className=err?'status err':'status'}function stat(){const fused=Math.min(MAX,Math.round(state.localCount+state.remoteCount-Math.min(state.localCount,state.remoteCount)*.22));$('stats').textContent=`Quest ${isQuest?state.localCount.toLocaleString():state.remoteCount.toLocaleString()} · iPhone ${isQuest?state.remoteCount.toLocaleString():state.localCount.toLocaleString()} · fused ${fused.toLocaleString()} · frames ${state.frames.length} · layers ${LAYERS}`}function load(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('load'));document.head.appendChild(s)})}async function ensurePeer(){if(!window.Peer){status('Loading connection…');await load('https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js')}if(state.peer)return;state.peer=new Peer(undefined,{debug:1});state.peer.on('open',id=>{state.id=id;if(!isQuest){status('iPhone ready · QR is available')}else{status('Quest ready · scan iPhone QR')}});state.peer.on('error',e=>{const m=e?.type||'connection error';status(`Connection error: ${m}`,true);console.error(e)});state.peer.on('disconnected',()=>{state.connected=false;status('Connection server disconnected',true)});state.peer.on('connection',accept)}function accept(c){if(state.conn?.open)c.close();state.conn=c;wire(c,true)}function wire(c,incoming){c.on('open',async()=>{state.connected=true;status('CONNECTED · Quest + iPhone linked');$('start').disabled=false; $('record').disabled=false;c.send({type:'hello',role:isQuest?'quest':'iphone'});if(incoming&&!isQuest)status('CONNECTED · Quest linked to iPhone');if(state.spatial)beginSpatial()});c.on('data',d=>{if(d?.type==='hello'){state.connected=true;$('start').disabled=false;$('record').disabled=false;status('CONNECTED · dual cameras ready')}if(d?.type==='frame')receive(d)});c.on('close',()=>{state.connected=false;state.spatial=false;status('Connection closed',true)});c.on('error',e=>status('Device connection error',true))}async function connect(host){await ensurePeer();status('QR recognized · connecting…');if(state.conn){try{state.conn.close()}catch(e){}}const c=state.peer.connect(host,{reliable:true});state.conn=c;wire(c,false)}async function makeQR(text){if(!window.qrcode)await load('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js');const q=qrcode(0,'M');q.addData(text);q.make();const cv=$('qr'),ctx=cv.getContext('2d'),n=q.getModuleCount(),pad=4,scale=Math.floor(700/(n+pad*2));cv.width=cv.height=(n+pad*2)*scale;ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#000';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))ctx.fillRect((x+pad)*scale,(y+pad)*scale,scale,scale)}async function showQR(){await ensurePeer();if(!state.id){status('Preparing QR…');return}const u=location.href.split('?')[0]+'?host='+encodeURIComponent(state.id);try{await makeQR(u);$('code').textContent=state.id.slice(-8).toUpperCase();$('pairBox').classList.add('show')}catch(e){status('QR generator failed',true)}}async function openScanner(){await ensurePeer();$('scanBox').classList.add('show');const v=$('scanner');try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});v.srcObject=s;await v.play();state.scanStream=s}catch(e){$('scanText').textContent='Camera permission is required on Quest.';return}if(!window.jsQR)try{await load('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js')}catch(e){$('scanText').textContent='QR scanner failed to load.';return}const cv=document.createElement('canvas'),ctx=cv.getContext('2d',{willReadFrequently:true});async function loop(){if(!$('scanBox').classList.contains('show'))return;if(v.readyState<2){requestAnimationFrame(loop);return}cv.width=v.videoWidth;cv.height=v.videoHeight;ctx.drawImage(v,0,0);const q=jsQR(ctx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:'attemptBoth'});if(q){try{const u=new URL(q.data);const host=u.searchParams.get('host');if(host){state.scanStream.getTracks().forEach(t=>t.stop());$('scanBox').classList.remove('show');await connect(host);return}}catch(e){}}requestAnimationFrame(loop)}loop()}async function camera(){if(state.cam)return;state.video=document.createElement('video');state.video.autoplay=true;state.video.playsInline=true;state.video.muted=true;try{state.cam=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:960},height:{ideal:540},frameRate:{ideal:24,max:30}},audio:false});state.video.srcObject=state.cam;await state.video.play();return true}catch(e){status('Camera permission required',true);return false}}function sample(){const v=state.video;if(!v||v.readyState<2)return null;const w=160,h=Math.max(100,Math.round((v.videoHeight/v.videoWidth||.5625)*w)),cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,w,h);const d=x.getImageData(0,0,w,h).data,p=[],c=[];for(let y=1;y<h-1;y+=3)for(let X=1;X<w-1;X+=3){const i=(y*w+X)*4,r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,l=.299*r+.587*g+.114*b;const edge=Math.abs((d[i-4]+d[i+4]-2*d[i])/255);if(l<.025||l>.99)continue;const z=(1-l)*3.6+edge*1.4-1.8;p.push((X/w-.5)*3.4,(.5-y/h)*2.5,z);c.push(r,g,b)}return{p,c,n:p.length/3,t:Date.now(),role:isQuest?'quest':'iphone'}}function receive(f){if(!f?.p)return;state.remote=f;state.remoteCount=f.n||f.p.length/3;state.points.push(f);if(state.recording)state.frames.push(f);stat()}async function beginSpatial(){if(state.spatial)return;if(!state.connected){status('Connect Quest + iPhone first',true);return}const ok=await camera();if(!ok)return;state.spatial=true;status('DUAL SPATIAL ACTIVE · processing both cameras');let last=0;const loop=t=>{if(!state.spatial)return;if(t-last>110){last=t;const f=sample();if(f){state.localCount=f.n;if(state.recording)state.frames.push(f);if(state.conn?.open)state.conn.send({type:'frame',...f});stat()}}requestAnimationFrame(loop)};requestAnimationFrame(loop)}async function init3(){if(state.ready3)return;await load('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');await load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js');const canvas=$('view');state.scene=new THREE.Scene();state.camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.02,200);state.camera.position.set(0,1,6);state.renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});state.renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));state.renderer.setSize(innerWidth,innerHeight);state.controls=new THREE.OrbitControls(state.camera,canvas);state.controls.enableDamping=true;state.scene.add(new THREE.GridHelper(10,20,0x204060,0x101018));state.renderer.setAnimationLoop(()=>{state.controls.update();state.renderer.render(state.scene,state.camera)});addEventListener('resize',()=>{state.camera.aspect=innerWidth/innerHeight;state.camera.updateProjectionMatrix();state.renderer.setSize(innerWidth,innerHeight)});state.ready3=true}function points(p,c,size,op){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));const m=new THREE.PointsMaterial({size,vertexColors:true,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false});const o=new THREE.Points(g,m);state.scene.add(o);return o}async function build(){if(!state.frames.length){status('Record a session first',true);return}await init3();status('Building dual hologram…');await new Promise(r=>requestAnimationFrame(r));const p=[],c=[];for(let fi=0;fi<state.frames.length&&p.length/3<MAX;fi+=Math.max(1,Math.floor(state.frames.length/80))){const f=state.frames[fi],shift=f.role==='iphone'?.65:-.65,time=(fi/state.frames.length-.5)*1.4;for(let i=0;i<f.p.length&&p.length/3<MAX;i+=3){p.push(f.p[i]+shift,f.p[i+1],f.p[i+2]+time);c.push(f.c[i],f.c[i+1],f.c[i+2])}}points(p,c,.05,.9);for(let k=1;k<LAYERS;k++){const a=[],b=[];for(let i=k*3;i<p.length;i+=LAYERS*3){a.push(p[i],p[i+1],p[i+2]);b.push(c[i],c[i+1],c[i+2])}points(a,b,.025+k*.001,.10)}$('play').disabled=false;status(`HOLOGRAM READY · ${(p.length/3).toLocaleString()} fused nodes`);stat()}function record(){state.recording=!state.recording;$('record').textContent=state.recording?'Stop':'Record';if(state.recording){state.frames=[];state.chunks=[];if(state.renderer?.domElement.captureStream&&window.MediaRecorder){try{state.media=new MediaRecorder(state.renderer.domElement.captureStream(30));state.media.ondataavailable=e=>e.data.size&&state.chunks.push(e.data);state.media.onstop=()=>{$('play').dataset.url=URL.createObjectURL(new Blob(state.chunks,{type:'video/webm'}));$('play').disabled=false};state.media.start()}catch(e){}}status('Recording dual spatial session')}else{state.media?.stop();$('build').disabled=false;status(`${state.frames.length} spatial frames captured`);stat()}}$('pair').onclick=showQR;$('scan').onclick=openScanner;$('start').onclick=beginSpatial;$('record').onclick=record;$('build').onclick=build;$('play').onclick=()=>{if($('play').dataset.url)window.open($('play').dataset.url);else status('Build hologram first')};$('clear').onclick=()=>{state.frames=[];state.points=[];status('Spatial memory cleared');stat()};$('closePair').onclick=()=>$('pairBox').classList.remove('show');$('closeScan').onclick=()=>{$('scanBox').classList.remove('show');state.scanStream?.getTracks().forEach(t=>t.stop())};(async()=>{try{await ensurePeer();if(isQuest){status('Quest ready · tap Scan QR')}else{status('iPhone ready · tap Show QR')}}catch(e){status('Startup failed. Refresh once.',true)}})();</script></body></html>
