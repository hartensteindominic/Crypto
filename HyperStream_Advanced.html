ipt>(()=>{'use strict';const $=i=>document.getElementById(i),cv=$('v'),g=cv.getContext('2d'),cap=document.createElement('canvas'),cg=cap.getContext('2d',{willReadFrequently:true}),tex=document.createElement('canvas'),tx=tex.getContext('2d');let W,H,D,video,stream,front=0,running=0,mode=0,raf,last=0,cells=new Map(),prev=[],pose={x:0,y:0,r:0},pc=null,channel=null,scanStream=null;const C=.16,MAX=1800;function st(t){$('s').textContent=t}function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0);draw()}addEventListener('resize',size);size();function draw(){g.fillStyle='#02050a';g.fillRect(0,0,W,H);let a=[...cells.values()].filter(o=>o.keep).sort((a,b)=>b.z-a.z);for(const o of a){let dx=o.x-pose.x,dz=o.z,ca=Math.cos(pose.r),sa=Math.sin(pose.r),rx=dx*ca-dz*sa,rz=dx*sa+dz*ca;if(rz<.15)continue;let k=Math.min(W,H)*.14/(.75+rz*.13),px=W/2+rx*k,py=H/2-o.y*k,sz=Math.max(4,Math.min(42,k*C*(.7+o.conf)));g.globalAlpha=Math.min(.94,.28+o.conf*.66);if(o.img){let q=o.img,w=Math.max(8,sz*2.2),h=w*q.h/q.w;g.save();g.translate(px,py);g.rotate(o.angle);if(mode===1){g.globalAlpha=.35+o.depth*.6;g.filter='saturate(1.5) contrast(1.2)'}g.drawImage(q,-w/2,-h/2,w,h);g.restore()}else{g.fillStyle='#64c8ff';g.fillRect(px-sz/2,py-sz/2,sz,sz)}}g.globalAlpha=1;g.strokeStyle='#173a55';g.strokeRect(W*.12,H*.07,W*.76,H*.78);let n=a.length,d=n?a.reduce((s,o)=>s+o.depth,0)/n:0,t=n?a.reduce((s,o)=>s+o.time,0)/n:0,sp=n?a.reduce((s,o)=>s+o.space,0)/n:0;$('stats').textContent=`World ${cells.size} · Images ${n} · Depth ${d*100|0}% · Coverage ${Math.min(100,n/18)|0}% · 5D ${((t+sp)/2*100)|0}% · ${navigator.connection?.effectiveType||'Local'}`;$('m').style.width=Math.min(100,n/18)+'%';$('lock').disabled=n<8}function features(){if(!video||video.readyState<2)return[];let w=320,h=240;cap.width=w;cap.height=h;cg.drawImage(video,0,0,w,h);let p=cg.getImageData(0,0,w,h).data,a=[];for(let y=8;y<h-8;y+=8)for(let X=8;X<w-8;X+=8){let i=(y*w+X)*4,L=.2 video.muted=true;video.playsInline=true;await video.play();return 1}catch(e){st('Camera blocked. Allow camera access and retry.');return 0}}async function start(){if(running){running=0;cancelAnimationFrame(raf);$('start').textContent='Start Spatial';st('Spatial paused · world retained');return}st('Starting image-space processor…');if(!await camera())return;running=1;$('start').textContent='Stop Spatial';st('LIVE · camera images → 3D surfaces → 5D world');loop()}function loop(t=0){if(!running)return;if(t-last>70){last=t;let a=features();if(a.length){motion(a);fuse(a);prev=a;if(channel?.readyState==='open')try{channel.send(JSON.stringify({v:5,type:'surface',pose,items:a.slice(0,100),time:performance.now()}))}catch(_){}}}raf=requestAnimationFrame(loop)}$('start').onclick=start;$('flip').onclick=async()=>{front=!front;st('Switching lens…');if(await camera())st(`${front?'Front':'Back'} camera · one world`)};$('mode').onclick=()=>{mode=(mode+1)%3;$('mode').textContent=['Hologram','Depth','Structure'][mode];draw()};$('lock').onclick=()=>{running=0;cancelAnimationFrame(raf);$('start').textContent='Start Spatial';st('SPATIAL LOCKED · image surfaces preserved')};$('clear').onclick=()=>{cells.clear();prev=[];pose={x:0,y:0,r:0};draw();st('3D world cleared')};function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}function dec(s){try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch(_){return null}}async function qr(payload,title){$('qm').classList.add('on');$('qtitle').textContent=title;let c=$('qr'),z=c.getContext('2d');c.width=c.height=560;z.fillStyle='#fff';z.fillRect(0,0,560,560);let ok=0;for(const u of ['https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js','https://unpkg.com/qrcode-generator@1.4.4/qrcode.js'])try{await new Promise((a,b)=>{let s=document.createElement('script');s.src=u;s.onload=a;s.onerror=b;document.head.appendChild(s)});if(window.qrcode){ok=1;break}}catch(_){}if(!ok){$('qt').textContent='QR encoder could not load. Use HTTPS and retry.';return}try{let q=qrcode(0,'H');q.addData(enc(payload));q.make();let n=q.getModuleCount(),k=Math.floor(500/n);z.fillStyle='#000';for(let y=0;y<n;y++)for(let X=0;X<n;X++)if(q.isDark(y,X))z.fillRect(30+X*k,30+y*k,k,k);$('qt').textContent=`REAL QR · ${title}` }catch(e){$('qt').textContent='QR error: '+e.message}}function bind(c){channel=c;c.onopen=()=>st('QUEST CONNECTED · dual 5D surface processing');c.onclose=()=>st('Quest disconnected · local world retained');c.onmessage=e=>{try{let d=JSON.parse(e.data);if(d.items)fuse(d.items,1)}catch(_){}}}async function connect(){if(!window.RTCPeerConnection)return st('WebRTC unavailable · phone mode still works');try{pc=new RTCPeerConnection();bind(pc.createDataChannel('hyperstream'));let o=await pc.createOffer();await pc.setLocalDescription(o);await new Promise(r=>setTimeout(r,900));await qr({v:5,k:'offer',s:pc.localDescription},'SCAN ON QUEST')}catch(e){st('Quest offer failed: '+e.message)}}$('connect').onclick=connect;async function handle(raw){let d=dec(raw);if(!d)return $('msg').textContent='Not a HyperStream QR.';if(d.k==='offer'){pc=new RTCPeerConnection();pc.ondatachannel=e=>bind(e.channel);await pc.setRemoteDescription(d.s);let a=await pc.createAnswer();await pc.setLocalDescription(a);await new Promise(r=>setTimeout(r,500));$('msg').textContent='Offer accepted. Return the Answer QR to the phone.';await qr({v:5,k:'answer',s:pc.localDescription},'RETURN ANSWER TO PHONE');return}if(d.k==='answer'&&pc){await pc.setRemoteDescription(d.s);$('msg').textContent='Answer accepted · connecting…';return}$('msg').textContent='Wrong QR stage.'}$('scan').onclick=async()=>{$('smx').classList.add('on');try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});$('sv').srcObject=scanStream;await $('sv').play();if(!('BarcodeDetector'in window)){$('msg').textContent='QR scanner unavailable in this browser. Use Quest Browser/Chrome.';return}let bd=new BarcodeDetector({f
