<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HyperStream Spatial Hologram</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02050a;color:#eef7ff;font:14px system-ui,sans-serif}#view{position:fixed;inset:0;width:100%;height:100%;display:block}.ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:10px;border:1px solid #ffffff20;border-radius:18px;background:#080d14ed;backdrop-filter:blur(14px)}.row{display:flex;flex-wrap:wrap;gap:4px}button{border:0;border-radius:10px;padding:9px 11px;background:#176fc1;color:#fff;font-weight:700;cursor:pointer}button:active{transform:scale(.97)}button:disabled{opacity:.35}.status{color:#bde8ff}.small{color:#91a0b2;font-size:12px}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000d;align-items:center;justify-content:center;padding:14px}.modal.on{display:flex}.card{width:min(430px,100%);padding:16px;border-radius:18px;background:#151b23;text-align:center}.card video{width:100%;max-height:55vh;border-radius:12px}.qr{width:260px;height:260px;background:#fff;margin:12px auto;display:grid;place-items:center}.qr canvas{width:100%;height:100%}.meter{height:3px;background:#132438;margin-top:7px;border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#3aa9ff;transition:width .2s}
</style></head>
<body>
<canvas id="view"></canvas>
<div class="ui">
 <div class="status" id="status">HyperStream ready</div>
 <div class="row">
  <button id="start">Start Spatial</button><button id="connect">Connect Quest</button><button id="scan">Scan QR</button><button id="flip">Flip Camera</button><button id="mode">Hologram</button><button id="lock" disabled>Lock Space</button><button id="clear">Clear</button>
 </div>
 <div class="small" id="stats">XYZ 0 · Depth 0% · Solid 0% · Coverage 0% · 5D 0% · Local</div><div class="meter"><i id="meter"></i></div>
</div>
<div class="modal" id="qrbox"><div class="card"><b>Connect Quest</b><div class="qr"><canvas id="qr"></canvas></div><div class="small" id="qrtext">Preparing secure local pairing…</div><button id="closeqr">Close</button></div></div>
<div class="modal" id="scanbox"><div class="card"><b>Scan Quest QR</b><video id="scanvideo" autoplay playsinline muted></video><p id="scanmsg" class="small">Point the phone at the Quest QR.</p><button id="closescan">Cancel</button></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), view=$('view'),ctx=view.getContext('2d');
let W=innerWidth,H=innerHeight,D=1,media=null,video=null,front=false,running=false,locked=false,mode=0,raf=0,lastTick=0,frameNo=0;
let cells=new Map(),prev=null,pose={x:0,y:0,z:0,heading:0},remoteFrames=0,peer=null,conn=null,scannerStream=null;
const CELL=.075,MAX=11000;
function status(t){$('status').textContent=t}
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;view.width=W*D;view.height=H*D;ctx.setTransform(D,0,0,D,0,0);render()}addEventListener('resize',resize);resize();
function network(){const c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;return c?`${c.effectiveType||'net'} ${c.downlink?c.downlink.toFixed(1)+'Mbps':''}`:'Network'}
function project(v){let dx=v.x-pose.x,dy=v.y-pose.y,dz=v.z-pose.z;let ca=Math.cos(pose.heading),sa=Math.sin(pose.heading),rx=dx*ca-dz*sa,rz=dx*sa+dz*ca;let s=Math.min(W,H)*.105/(.72+Math.max(.05,rz)*.10);return{x:W/2+rx*s,y:H/2-dy*s,r:Math.max(.7,3.8*s/Math.min(W,H)*500*(.45+v.solid)),z:rz}}
function render(){ctx.fillStyle='#02050a';ctx.fillRect(0,0,W,H);let a=[...cells.values()].filter(v=>v.keep);a.sort((p,q)=>q.z-p.z);for(const v of a){let p=project(v);if(p.z<-.5||p.x<-20||p.x>W+20||p.y<-20||p.y>H+20)continue;ctx.globalAlpha=Math.max(.12,Math.min(.92,v.solid));if(mode===0)ctx.fillStyle=`rgb(${7+35*v.state},${55+105*v.state},${115+125*v.state})`;else if(mode===1){let d=Math.max(0,Math.min(1,v.z/7));ctx.fillStyle=`rgb(${25+170*d},${90+90*(1-d)},255)`}else ctx.fillStyle='#d9efff';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.strokeStyle='#153550';ctx.strokeRect(W*.16,H*.10,W*.68,H*.72);let n=a.length,dep=n?a.reduce((s,v)=>s+v.depth,0)/n:0,sol=n?a.reduce((s,v)=>s+v.solid,0)/n:0,st=n?a.reduce((s,v)=>s+v.state,0)/n:0,cov=Math.min(100,n/90);$('stats').textContent=`XYZ ${cells.size} · Depth ${Math.round(dep*100)}% · Solid ${Math.round(sol*100)}% · Coverage ${Math.round(cov)}% · 5D ${Math.round(st*100)}% · ${network()}`;$('meter').style.width=cov+'%';$('lock').disabled=n<20}
function grayFeatures(){if(!video||video.readyState<2)return[];const w=320,h=240;const sc=grayFeatures.canvas||(grayFeatures.canvas=document.createElement('canvas'));sc.width=w;sc.height=h;const x=sc.getContext('2d',{willReadFrequently:true});x.drawImage(video,0,0,w,h);const d=x.getImageData(0,0,w,h).data,out=[];for(let y=6;y<h-6;y+=5)for(let xx=6;xx<w-6;xx+=5){let i=(y*w+xx)*4,g=.299*d[i]+.587*d[i+1]+.114*d[i+2],l=.299*d[i-4]+.587*d[i-3]+.114*d[i-2],r=.299*d[i+4]+.587*d[i+5]+.114*d[i+6],u=.299*d[i-4*w]+.587*d[i-4*w+1]+.114*d[i-4*w+2],dn=.299*d[i+4*w]+.587*d[i+4*w+1]+.114*d[i+4*w+2],e=Math.abs(g-l)+Math.abs(g-r)+Math.abs(g-u)+Math.abs(g-dn);if(e>18)out.push({x:xx,y,e,r:d[i]/255,g:d[i+1]/255,b:d[i+2]/255})}return out.sort((a,b)=>b.e-a.e).slice(0,700)}
function fuse(fs,remote=false){for(const p of fs){let z=Math.max(.35,Math.min(8,1.0+(1-Math.min(1,p.e/500))*5.8));let x=(p.x-160)/105*z+pose.x,y=(120-p.y)/105*z+pose.y;let k=`${Math.round(x/CELL)},${Math.round(y/CELL)},${Math.round(z/CELL)}`;let v=cells.get(k);if(!v){cells.set(k,{x,y,z,depth:Math.min(1,p.e/280),solid:remote?.30:.18,state:remote?.28:.16,hits:1,age:0,r:p.r,g:p.g,b:p.b,keep:true})}else{v.x+=.14*(x-v.x);v.y+=.14*(y-v.y);v.z+=.14*(z-v.z);v.depth=.82*v.depth+.18*Math.min(1,p.e/280);v.hits=Math.min(255,v.hits+1);v.age=0;v.r=.9*v.r+.1*p.r;v.g=.9*v.g+.1*p.g;v.b=.9*v.b+.1*p.b}}for(const v of cells.values()){v.age++;let obs=Math.min(1,v.hits/7),fresh=Math.max(0,1-v.age/45);v.solid=Math.min(1,.18*v.depth+.62*obs+.20*fresh);v.state=Math.min(1,.46*v.solid+.28*obs+.16*fresh+.10*(remote?1:0));v.keep=v.solid>.23&&fresh>.02}if(cells.size>MAX){let a=[...cells.entries()].filter(e=>e[1].keep).sort((a,b)=>b[1].state-a[1].state).slice(0,MAX);cells=new Map(a)}render()}
function estimateMotion(fs){if(!prev||!fs.length||!prev.length)return;let n=Math.min(80,fs.length),sx=0,sy=0,c=0;for(let i=0;i<n;i++){let p=fs[i],best=null,be=1e9;for(let j=0;j<Math.min(180,prev.length);j++){let q=prev[j],dx=p.x-q.x,dy=p.y-q.y,e=dx*dx+dy*dy;if(e<be){be=e;best=q}}if(best&&be<900){sx+=best.x-p.x;sy+=best.y-p.y;c++}}if(c){pose.x+=sx/c*.0009;pose.y-=sy/c*.0009;pose.heading+=(sx/c)*.000025}}
async function startCamera(){if(media)media.getTracks().forEach(t=>t.stop());try{media=await navigator.mediaDevices.getUserMedia({video:{facingMode:front?'user':{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video=document.createElement('video');video.muted=true;video.playsInline=true;video.srcObject=media;await video.play();return true}catch(e){status('Camera permission blocked. Allow camera access, then press Start Spatial.');return false}}
async function start(){if(running){running=false;if(raf)cancelAnimationFrame(raf);$('start').textContent='Start Spatial';status('Spatial paused · map retained');return}status('Starting spatial processor…');if(!await startCamera())return;running=true;locked=false;$('start').textContent='Stop Spatial';status('PHONE SPATIAL PROCESSOR · scanning XYZ + depth');loop()}
function loop(t=0){if(!running)return;if(t-lastTick>65){lastTick=t;const f=grayFeatures();if(f.length){estimateMotion(f);fuse(f);prev=f;frameNo++;if(conn?.open&&frameNo%2===0){try{conn.send({type:'spatial',pose,features:f.slice(0,300),frame:frameNo})}catch(e){}}}}raf=requestAnimationFrame(loop)}
$('start').onclick=start;$('flip').onclick=async()=>{front=!front;status('Switching camera…');if(await startCamera())status(`${front?'Front':'Back'} camera · ${running?'continuing same spatial world':'ready'}`)};$('mode').onclick=()=>{mode=(mode+1)%3;$('mode').textContent=['Hologram','Depth','Structure'][mode];render()};$('lock').onclick=()=>{locked=true;running=false;if(raf)cancelAnimationFrame(raf);$('start').textContent='Start Spatial';status('SPATIAL LOCKED · persistent hologram preserved')};$('clear').onclick=()=>{cells.clear();pose={x:0,y:0,z:0,heading:0};prev=null;frameNo=0;locked=false;render();status('Spatial world cleared')};
async function load(src){return new Promise((ok,no)=>{let s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function makePairId(){return (crypto.randomUUID?crypto.randomUUID():String(Date.now()))}
async function makeQR(text){const c=$('qr'),x=c.getContext('2d');c.width=c.height=520;x.fillStyle='#fff';x.fillRect(0,0,520,520);try{await load('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js');let q=qrcode(0,'M');q.addData(text);q.make();let n=q.getModuleCount(),z=Math.floor(480/n);x.fillStyle='#000';for(let y=0;y<n;y++)for(let xx=0;xx<n;xx++)if(q.isDark(y,xx))x.fillRect(20+xx*z,20+y*z,z,z)}catch(e){x.fillStyle='#111';x.font='20px system-ui';x.fillText('QR library unavailable',145,245);x.font='13px system-ui';x.fillText('Use Scan QR with a supported decoder',105,275)}}
$('connect').onclick=async()=>{if(!window.RTCPeerConnection){status('WebRTC unavailable · phone-only mode still works');return}let id=makePairId();$('qrbox').classList.add('on');$('qrtext').textContent='Pairing token '+id.slice(-8);let pc=new RTCPeerConnection();peer=pc;pc.createDataChannel('hyperstream');pc.ondatachannel=e=>bind(e.channel);pc.onicecandidate=()=>{};try{let offer=await pc.createOffer();await pc.setLocalDescription(offer);await new Promise(r=>setTimeout(r,700));let payload=JSON.stringify({v:1,sdp:pc.localDescription});await makeQR(btoa(payload));$('qrtext').textContent='Show this QR to the Quest. Connection uses WebRTC data, with 5G/Wi‑Fi as transport.'}catch(e){status('Quest pairing failed · phone processor remains active')}};
function bind(ch){conn=ch;conn.onopen=()=>status('QUEST CONNECTED · dual spatial processing active');conn.onclose=()=>status('Quest disconnected · phone world retained');conn.onmessage=e=>{try{let d=JSON.parse(e.data);if(d.type==='spatial'){remoteFrames++;if(Array.isArray(d.features))fuse(d.features,true)}}catch(_){}}}
$('scan').onclick=async()=>{$('scanbox').classList.add('on');$('scanmsg').textContent='Opening scanner…';try{scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});$('scanvideo').srcObject=scannerStream;await $('scanvideo').play();await decodeQR()}catch(e){$('scanmsg').textContent='Camera permission required.'}};
async function decodeQR(){const v=$('scanvideo');if('BarcodeDetector' in window){try{let bd=new BarcodeDetector({formats:['qr_code']});while($('scanbox').classList.contains('on')){let codes=await bd.detect(v);if(codes.length){let raw=codes[0].rawValue;try{let d=JSON.parse(atob(raw));if(d.sdp){let pc=new RTCPeerConnection();peer=pc;pc.ondatachannel=e=>bind(e.channel);await pc.setRemoteDescription(d.sdp);let ans=await pc.createAnswer();await pc.setLocalDescription(ans);$('scanmsg').textContent='Answer created. Return it to the Quest pairing screen.'}else $('scanmsg').textContent='QR recognized.'}catch(_){$('scanmsg').textContent='QR recognized.'}return}await new Promise(r=>setTimeout(r,250))}return}catch(e){}}$('scanmsg').textContent='Live camera active. QR decoder unavailable on this browser; spatial scanning is unaffected.'}
$('closeqr').onclick=()=>{$('qrbox').classList.remove('on')};$('closescan').onclick=()=>{$('scanbox').classList.remove('on');if(scannerStream)scannerStream.getTracks().forEach(t=>t.stop())};
window.addEventListener('error',e=>status('Runtime error: '+(e.message||'unknown')));window.addEventListener('unhandledrejection',e=>status('Runtime error: '+(e.reason?.message||e.reason||'unknown')));render();status('Ready · phone-first 5D spatial processor');
})();
</script></body></html>
