<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HyperStream Spatial</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font:14px system-ui}#c{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:10px;border:1px solid #fff2;border-radius:18px;background:#111d;backdrop-filter:blur(18px)}button{border:0;border-radius:11px;padding:10px;margin:3px;background:#1677ff;color:#fff;font-weight:700}button:disabled{opacity:.35}.status{color:#9ad0ff}.small{color:#aaa;font-size:12px}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000e;align-items:center;justify-content:center;padding:15px}.on{display:flex}.card{width:min(430px,100%);background:#18181b;border-radius:20px;padding:16px;text-align:center}.qr{width:250px;height:250px;background:#fff;margin:12px auto;padding:10px}.qr canvas{width:100%;height:100%}#qv{width:100%;max-height:60vh;object-fit:cover;border-radius:14px}.target{position:absolute;inset:18%;border:3px solid #48a0ff;border-radius:18px}</style></head><body><canvas id=c></canvas><div class=ui><div class=status id=s>HyperStream ready</div><div><button id=q>Scan QR</button><button id=co>Show QR</button><button id=sc>Start Spatial</button><button id=re disabled>Record</button><button id=bu disabled>Build Hologram</button><button id=pl disabled>Play</button><button id=cl>Clear</button></div><div class=small id=st>Quest 0 · iPhone 0 · fused 0 · frames 0 · layers 0</div></div><div class=modal id=pm><div class=card><h2>Connect Quest</h2><div class=qr><canvas id=qc></canvas></div><b id=pc>------</b><p class=small id=ps>Point Quest at this QR.</p><button id=x>Close</button></div></div><div class=modal id=qm><div class=card><h2>Scan QR</h2><div style="position:relative"><video id=qv autoplay playsinline muted></video><div class=target></div></div><p class=small id=qs>Center the iPhone QR in the box.</p><button id=qx>Cancel</button></div></div><script>const $=x=>document.getElementById(x);let scn,cam,ren,ctl,threeReady=false,peer,conn,id,stream,frames=[],recording=false,rec,chunks=[],world,local=0,remote=0;const L=9,MAX=120000,hostMode=!new URLSearchParams(location.search).get('host');function msg(x){$('s').textContent=x}function load(src){return new Promise((ok,no)=>{let s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}async function boot3(){if(threeReady)return;msg('Loading 3D engine…');await load('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');await load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js');scn=new THREE.Scene();cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.03,500);cam.position.set(0,1,7);ren=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true});ren.setPixelRatio(Math.min(devicePixelRatio||1,1.5));ren.setSize(innerWidth,innerHeight);ctl=new THREE.OrbitControls(cam,ren.domElement);ctl.enableDamping=true;ctl.autoRotate=true;scn.add(new THREE.GridHelper(12,24,0x204080,0x101015));ren.setAnimationLoop(()=>{ctl.update();ren.render(scn,cam)});addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});threeReady=true;msg(hostMode?'iPhone ready · show QR to Quest':'Quest ready · scan iPhone QR')}function mat(z,o){return new THREE.PointsMaterial({size:z,vertexColors:true,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false})}function cloud(p,c,size=.045,op=.9){let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));let o=new THREE.Points(g,mat(size,op));scn.add(o);return o}async function getCam(v){if(!navigator.mediaDevices?.getUserMedia)throw Error('camera');for(let q of [{video:{facingMode:{ideal:'environment'},width:{ideal:960},height:{ideal:540}},audio:false},{video:true,audio:false}])try{let z=await navigator.mediaDevices.getUserMedia(q);v.srcObject=z;v.muted=true;await v.play();return z}catch(e){}throw Error('camera')}function sample(v,w=220,step=3){let h=Math.max(120,Math.round((v.videoHeight||720)/(v.videoWidth||1280)*w)),c=document.createElement('canvas');c.width=w;c.height=h;let x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,w,h);let d=x.getImageData(0,0,w,h).data,p=[],co=[];for(let y=2;y<h-2;y+=step)for(let X=2;X<w-2;X+=step){let i=(y*w+X)*4,r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,l=.299*r+.587*g+.114*b;if(l<.025||l>.985)continue;let e=Math.abs((.299*d[i-4]+.587*d[i-3]+.114*d[i-2])-(.299*d[i+4]+.587*d[i+5]+.114*d[i+6]))/255;p.push((X/w-.5)*4,(.5-y/h)*3+.25,(1-l)*4.8+e*2-2.4);co.push(r,g,b)}return[p,co]}function stats(){$('st').textContent=`Quest ${local.toLocaleString()} · iPhone ${remote.toLocaleString()} · fused ${(local+remote).toLocaleString()} · frames ${frames.length} · layers ${L}`}function setNode(name,p,c){if(window[name]){scn.remove(window[name]);window[name].geometry.dispose()}window[name]=cloud(p,c,.04,.8)}async function spatial(){await boot3();if(stream)return;let v=document.createElement('video');stream=await getCam(v);$('re').disabled=false;msg(hostMode?'iPhone camera active · waiting for Quest':'Quest camera active · spatial scan');let loop=()=>{if(!stream)return;let [p,c]=sample(v);local=p.length/3;setNode('lp',p,c);if(recording)frames.push({p,c,t:performance.now(),src:hostMode?'iphone':'quest'});if(conn?.open)conn.send({t:'spatial',p,c,n:local,t:performance.now()});stats();requestAnimationFrame(loop)};loop()}function receive(d){remote=d.n||0;setNode('rp',d.p,d.c);if(recording)frames.push({p:d.p,c:d.c,t:d.t||performance.now(),src:hostMode?'quest':'iphone'});stats()}async function makeQR(u){if(!window.qrcode)await load('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js');let qr=qrcode(0,'M');qr.addData(u);qr.make();let cv=$('qc'),ctx=cv.getContext('2d'),n=qr.getModuleCount(),pad=4,scale=Math.floor(700/(n+pad*2));cv.width=cv.height=(n+pad*2)*scale;ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#000';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(qr.isDark(y,x))ctx.fillRect((x+pad)*scale,(y+pad)*scale,scale,scale)}async function host(){await boot3();await makeQR(location.href.split('?')[0]+'?host=LOCAL');peer=new Peer();peer.on('open',async x=>{id=x;await makeQR(location.href.split('?')[0]+'?host='+encodeURIComponent(id));$('pc').textContent=id.slice(-6).toUpperCase();msg('iPhone ready · QR generated locally')});peer.on('connection',c=>{conn=c;c.on('open',async()=>{c.send({t:'ready'});$('ps').textContent='Quest connected';msg('Quest connected · starting iPhone camera');try{await spatial()}catch(e){msg('Allow iPhone camera access')}});c.on('data',receive);c.on('close',()=>msg('Quest disconnected'))})}function connectTo(h){msg('QR recognized · connecting…');peer=new Peer();peer.on('open',()=>{conn=peer.connect(h,{reliable:true});conn.on('open',async()=>{msg('Connected · starting Quest camera');try{await spatial()}catch(e){msg('Allow Quest camera access')}});conn.on('data',d=>{if(d.t==='ready')msg('Quest + iPhone synchronized');if(d.t==='spatial')receive(d)});conn.on('close',()=>msg('iPhone disconnected'))});peer.on('error',()=>msg('Connection failed · scan again'))}async function scanQR(){$('qm').classList.add('on');await load('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js');let v=$('qv');try{let z=await getCam(v);let c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});async function loop(){if(!$('qm').classList.contains('on'))return;c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);let n=Math.min(c.width,c.height),sx=(c.width-n)/2,sy=(c.height-n)/2,d=x.getImageData(sx,sy,n,n),q=jsQR(d.data,n,n,{inversionAttempts:'attemptBoth'});if(q){try{let u=new URL(q.data),h=u.searchParams.get('host');if(h){z.getTracks().forEach(t=>t.stop());$('qm').classList.remove('on');connectTo(h);return}}catch(e){}}requestAnimationFrame(loop)}loop()}catch(e){$('qs').textContent='Camera permission required on Quest'}}function build(){if(!frames.length)return msg('Record first');if(world){scn.remove(world);world.geometry.dispose()}let p=[],c=[],n=Math.min(frames.length,100);for(let f=0;f<frames.length;f+=Math.max(1,Math.floor(frames.length/n))){let a=frames[f],off=(f/(frames.length-1||1)-.5)*2.5;for(let i=0;i<a.p.length&&p.length/3<MAX;i+=3){p.push(a.p[i],a.p[i+1],a.p[i+2]+off);c.push(a.c[i],a.c[i+1],a.c[i+2])}}world=cloud(p,c,.052,.95);for(let k=1;k<L;k++){let a=[],b=[];for(let i=k*3;i<p.length;i+=L*3){a.push(p[i],p[i+1],p[i+2]);b.push(c[i],c[i+1],c[i+2])}cloud(a,b,.03+k*.002,.12)}msg(`Hologram ready · ${(p.length/3).toLocaleString()} nodes · ${L} layers`);$('bu').disabled=false;stats()}$('q').onclick=scanQR;$('co').onclick=()=>{$('pm').classList.add('on')};$('x').onclick=()=>$('pm').classList.remove('on');$('qx').onclick=()=>$('qm').classList.remove('on');$('sc').onclick=spatial;$('bu').onclick=build;$('re').onclick=()=>{recording=!recording;$('re').textContent=recording?'Stop':'Record';if(recording){frames=[];chunks=[];if(ren?.domElement.captureStream&&window.MediaRecorder){rec=new MediaRecorder(ren.domElement.captureStream(30));rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{$('pl').dataset.u=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));$('pl').disabled=false};rec.start()}msg('Recording synchronized spatial session')}else{rec?.stop();$('bu').disabled=!frames.length;msg(`${frames.length} spatial frames captured`);stats()}};$('pl').onclick=()=>{let u=$('pl').dataset.u;if(u)window.open(u)};$('cl').onclick=()=>{frames=[];if(world){scn.remove(world);world=null}msg('Spatial memory cleared');stats()};(async()=>{if(hostMode)await host();else{await boot3();msg('Quest ready · Scan the iPhone QR')}})();</script></body></html>
