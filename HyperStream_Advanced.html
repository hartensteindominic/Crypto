<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HyperStream 5D Spatial</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02050a;color:#eef7ff;font:14px system-ui}#v{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:10px;border:1px solid #ffffff22;border-radius:18px;background:#080d14ee;backdrop-filter:blur(12px)}button{border:0;border-radius:10px;padding:9px 11px;margin:2px;background:#176fc1;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.35}.st{color:#bde9ff}.sm{font-size:12px;color:#91a4b8}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000e;align-items:center;justify-content:center}.on{display:flex}.card{width:min(440px,94%);padding:16px;background:#151b23;border-radius:18px;text-align:center}.card video{width:100%;border-radius:12px}.qr{width:280px;height:280px;background:#fff;margin:10px auto}.meter{height:3px;background:#102033}.meter i{display:block;height:100%;width:0;background:#42b6ff}</style></head><body><canvas id=v></canvas><div class=ui><div id=s class=st>HyperStream 5D ready</div><div><button id=start>Start Spatial</button><button id=connect>Connect Quest</button><button id=scan>Scan QR</button><button id=flip>Flip Camera</button><button id=mode>Hologram</button><button id=lock disabled>Lock Space</button><button id=clear>Clear</button></div><div id=stats class=sm>XYZ 0 · Depth 0% · Solid 0% · Coverage 0% · 5D 0% · Local</div><div class=meter><i id=m></i></div></div><div id=qm class=modal><div class=card><b id=qtitle>Quest Pairing</b><canvas id=qr class=qr></canvas><div id=qt class=sm>Preparing secure pairing…</div><button id=qclose>Close</button></div></div><div id=smx class=modal><div class=card><b>Scan Quest QR</b><video id=sv autoplay playsinline muted></video><div id=msg class=sm>Starting scanner…</div><button id=sclose>Close</button></div></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),cv=$('v'),g=cv.getContext('2d'),cap=document.createElement('canvas'),cg=cap.getContext('2d',{willReadFrequently:true});let W,H,D,video,stream,front=0,running=0,mode=0,raf,last=0,cells=new Map(),prev=[],pose={x:0,y:0,z:0,r:0},pc=null,channel=null,scanStream=null,pairRole='',pairText='';const CELL=.10,MAX=6500;function status(t){$('s').textContent=t}function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0);draw()}addEventListener('resize',size);size();function draw(){g.fillStyle='#02050a';g.fillRect(0,0,W,H);let a=[...cells.values()].filter(o=>o.keep).sort((a,b)=>b.z-a.z);for(const o of a){let dx=o.x-pose.x,dz=o.z-pose.z,ca=Math.cos(pose.r),sa=Math.sin(pose.r),rx=dx*ca-dz*sa,rz=dx*sa+dz*ca;if(rz<.2)continue;let k=Math.min(W,H)*.145/(.75+rz*.12),px=W/2+rx*k,py=H/2-(o.y-pose.y)*k,sz=Math.max(1.5,Math.min(30,k*CELL*(.65+o.solid)));g.globalAlpha=.10+.82*o.solid;g.fillStyle=mode===0?`rgb(${18+55*o.r|0},${60+120*o.g|0},${100+145*o.b|0})`:mode===1?`hsl(${210-150*Math.min(1,rz/8)},90%,${42+35*o.depth}%)`:'#d8efff';g.fillRect(px-sz,py-sz,sz*2,sz*2)}g.globalAlpha=1;g.strokeStyle='#153550';g.strokeRect(W*.14,H*.08,W*.72,H*.76);let n=a.length,d=n?a.reduce((s,o)=>s+o.depth,0)/n:0,so=n?a.reduce((s,o)=>s+o.solid,0)/n:0,t=n?a.reduce((s,o)=>s+o.time,0)/n:0,sp=n?a.reduce((s,o)=>s+o.space,0)/n:0,c=Math.min(100,n/55);$('stats').textContent=`XYZ ${cells.size} · Depth ${d*100|0}% · Solid ${so*100|0}% · Coverage ${c|0}% · 5D ${((t+sp)/2*100)|0}% · ${navigator.connection?.effectiveType||'Local'}`;$('m').style.width=c+'%';$('lock').disabled=n<15}function features(){if(!video||video.readyState<2)return[];let w=360,h=270;cap.width=w;cap.height=h;cg.drawImage(video,0,0,w,h);let p=cg.getImageData(0,0,w,h).data,a=[];for(let y=5;y<h-5;y+=5)for(let X=5;X<w-5;X+=5){let i=(y*w+X)*4,L=.299*p[i]+.587*p[i+1]+.114*p[i+2],e=Math.abs(L-(.299*p[i-4]+.587*p[i-3]+.114*p[i-2]))+Math.abs(L-(.299*p[i+4]+.587*p[i+5]+.114*p[i+6]))+Math.abs(L-(.299*p[i-4*w]+.587*p[i-4*w+1]+.114*p[i-4*w+2]))+Math.abs(L-(.299*p[i+4*w]+.587*p[i+4*w+1]+.114*p[i+4*w+2]));if(e>17)a.push({x:X,y,e,r:p[i]/255,g:p[i+1]/255,b:p[i+2]/255})}return a.sort((a,b)=>b.e-a.e).slice(0,600)}function fuse(a,remote=0){for(const p of a){let z=Math.max(.5,Math.min(8,1+(1-Math.min(1,p.e/460))*5.6)),xx=(p.x-180)/110*z+pose.x,yy=(135-p.y)/110*z+pose.y,k=`${Math.round(xx/CELL)},${Math.round(yy/CELL)},${Math.round(z/CELL)}`,o=cells.get(k);if(!o)o={x:xx,y:yy,z,depth:Math.min(1,p.e/230),solid:.2,time:.15,space:.2,hits:0,age:0,r:p.r,g:p.g,b:p.b,keep:1},cells.set(k,o);else{o.x+=.15*(xx-o.x);o.y+=.15*(yy-o.y);o.z+=.15*(z-o.z);o.depth=.84*o.depth+.16*Math.min(1,p.e/230);o.r=.9*o.r+.1*p.r;o.g=.9*o.g+.1*p.g;o.b=.9*o.b+.1*p.b}o.hits=Math.min(100,o.hits+1);o.age=0}for(const o of cells.values()){o.age++;let fresh=Math.max(0,1-o.age/38),obs=Math.min(1,o.hits/6);o.solid=Math.min(1,.18*o.depth+.62*obs+.2*fresh);o.time=.55*o.time+.45*fresh;o.space=Math.min(1,.5*o.space+.5*obs+.08*remote);o.keep=o.solid>.26&&fresh>.02}if(cells.size>MAX)cells=new Map([...cells].filter(e=>e[1].keep).sort((a,b)=>(b[1].solid+b[1].space)-(a[1].solid+a[1].space)).slice(0,MAX));draw()}function motion(a){if(!prev.length)return;let sx=0,sy=0,n=Math.min(60,a.length);for(let i=0;i<n;i++){let p=a[i],q=prev[i%prev.length];sx+=q.x-p.x;sy+=q.y-p.y}if(n){pose.x+=sx/n*.0007;pose.y-=sy/n*.0007;pose.r+=sx/n*.000018}}async function camera(){if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:front?'user':{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video=document.createElement('video');video.srcObject=stream;video.muted=true;video.playsInline=true;await video.play();return 1}catch(e){status('Camera blocked. Allow camera access, then retry.');return 0}}async function start(){if(running){running=0;cancelAnimationFrame(raf);$('start').textContent='Start Spatial';status('Spatial paused · world retained');return}status('Starting 5D processor…');if(!await camera())return;running=1;$('start').textContent='Stop Spatial';status('LIVE · image → XYZ → depth → T/S');loop()}function loop(t=0){if(!running)return;if(t-last>55){last=t;let a=features();if(a.length){motion(a);fuse(a);prev=a;if(channel?.readyState==='open')try{channel.send(JSON.stringify({v:4,type:'5d',pose,features:a.slice(0,300),time:performance.now()}))}catch(_){}}}raf=requestAnimationFrame(loop)}$('start').onclick=start;$('flip').onclick=async()=>{front=!front;status('Switching camera…');if(await camera())status(`${front?'Front':'Back'} camera · same 5D world`)};$('mode').onclick=()=>{mode=(mode+1)%3;$('mode').textContent=['Hologram','Depth','Structure'][mode];draw()};$('lock').onclick=()=>{running=0;cancelAnimationFrame(raf);$('start').textContent='Start Spatial';status('SPATIAL LOCKED · 5D world preserved')};$('clear').onclick=()=>{cells.clear();prev=[];pose={x:0,y:0,z:0,r:0};draw();status('5D world cleared')};function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}function dec(s){try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch(e){return null}}async function loadQR(){if(window.qrcode)return 1;for(const u of ['https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js','https://unpkg.com/qrcode-generator@1.4.4/qrcode.js'])try{await new Promise((ok,no)=>{let s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});if(window.qrcode)return 1}catch(e){}return 0}async function showQR(payload,title){pairText=enc(payload);$('qtitle').textContent=title;$('qm').classList.add('on');let c=$('qr'),z=c.getContext('2d');c.width=c.height=560;z.fillStyle='#fff';z.fillRect(0,0,560,560);if(!(await loadQR())){$('qt').textContent='QR encoder unavailable. Check connection and retry.';return 0}try{let q=qrcode(0,'H');q.addData(pairText);q.make();let n=q.getModuleCount(),k=Math.floor(500/n);z.fillStyle='#000';for(let y=0;y<n;y++)for(let X=0;X<n;X++)if(q.isDark(y,X))z.fillRect(30+X*k,30+y*k,k,k);$('qt').textContent=`${title} · REAL QR · ${n}×${n}`;return 1}catch(e){$('qt').textContent='QR generation error: '+e.message;return 0}}function bind(ch){channel=ch;channel.onopen=()=>status('QUEST CONNECTED · 5D spatial packets active');channel.onclose=()=>status('Quest disconnected · phone world retained');channel.onmessage=e=>{try{let d=JSON.parse(e.data);if(d.features)fuse(d.features,1)}catch(_){}}}async function offer(){pc=new RTCPeerConnection();bind(pc.createDataChannel('hyperstream-5d'));let o=await pc.createOffer();await pc.setLocalDescription(o);await new Promise(r=>setTimeout(r,1200));return showQR({v:4,kind:'offer',sdp:pc.localDescription},'SCAN OFFER ON QUEST')}$('connect').onclick=async()=>{if(!window.RTCPeerConnection)return status('WebRTC unavailable · phone processor still works');try{status('Creating Quest offer…');pairRole='offer';await offer()}catch(e){status('Pairing error: '+e.message)}};async function handleCode(raw){let d=dec(raw);if(!d){$('msg').textContent='QR detected, but it is not a HyperStream code.';return}if(d.kind==='offer'&&d.sdp){pc=new RTCPeerConnection();pc.ondatachannel=e=>bind(e.channel);await pc.setRemoteDescription(d.sdp);let a=await pc.createAnswer();await pc.setLocalDescription(a);await new Promise(r=>setTimeout(r,500));$('msg').textContent='Offer accepted. Show the Answer QR to the phone.';await showQR({v:4,kind:'answer',sdp:pc.localDescription},'RETURN ANSWER QR TO PHONE');return}if(d.kind==='answer'&&d.sdp&&pc){await pc.setRemoteDescription(d.sdp);$('msg').textContent='Answer accepted · connecting…';return}$('msg').textContent='Valid QR, but wrong pairing stage.'}$('scan').onclick=async()=>{$('smx').classList.add('on');$('msg').textContent='Point camera at HyperStream QR…';try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});$('sv').srcObject=scanStream;await $('sv').play();if(!('BarcodeDetector'in window)){$('msg').textContent='QR camera is active, but this browser lacks BarcodeDetector. Use current Chrome or Quest Browser.';return}let bd=new BarcodeDetector({formats:['qr_code']});let loop=async()=>{if(!$('smx').classList.contains('on'))return;try{let a=await bd.detect($('sv'));if(a.length){await handleCode(a[0].rawValue);return}}catch(_){}$('msg').textContent='Scanning…';setTimeout(loop,180)};loop()}catch(e){$('msg').textContent='Scanner camera error: '+e.message}};$('qclose').onclick=()=>{$('qm').classList.remove('on')};$('sclose').onclick=()=>{$('smx').classList.remove('on');scanStream?.getTracks().forEach(t=>t.stop())};addEventListener('error',e=>status('Runtime error: '+e.message));addEventListener('unhandledrejection',e=>status('Runtime error: '+(e.reason?.message||e.reason)));draw();status('Ready · 5D image-space processor')})();</script></body></html>
