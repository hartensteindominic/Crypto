<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>HyperStream Advanced</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:14px system-ui,-apple-system,sans-serif}#c,#remote{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}#remote{display:none}.ui{position:fixed;z-index:5;left:12px;right:12px;bottom:12px;padding:12px;border:1px solid #ffffff22;border-radius:20px;background:#111c;backdrop-filter:blur(20px)}button{border:0;border-radius:12px;padding:12px 10px;margin:3px;background:#286cff;color:#fff;font-weight:700}button:disabled{opacity:.35}.row{display:flex;gap:6px;flex-wrap:wrap}.status{padding:4px;color:#9ad0ff}.top{position:fixed;z-index:5;top:12px;left:14px;font-weight:800}.modal{display:none;position:fixed;z-index:20;inset:0;background:#000e;align-items:center;justify-content:center;padding:20px}.modal.on{display:flex}.card{width:min(430px,100%);background:#18181b;border:1px solid #fff2;border-radius:22px;padding:18px;text-align:center}.qr{width:240px;height:240px;background:#fff;margin:15px auto;border-radius:12px}.qr img{width:100%;height:100%}#scanVideo{width:100%;max-height:45vh;object-fit:cover;border-radius:15px}.small{color:#aaa;font-size:12px}</style></head><body><canvas id="c"></canvas><video id="remote" playsinline controls></video><div class="top">HyperStream <span style="opacity:.4">AI</span></div><div class="ui"><div class="status" id="status">Ready</div><div class="row"><button id="scan">Scan</button><button id="record" disabled>Record</button><button id="build" disabled>Build Hologram</button><button id="connect">Connect</button><button id="play" disabled>Play Recording</button><button id="clear">Clear</button><input id="file" type="file" accept="video/*,image/*" hidden></div><div class="small" id="stats">Local 0 · Remote 0 · Frames 0 · Device 0</div></div><div class="modal" id="pair"><div class="card"><h2>Connect Camera</h2><p class="small">Open this page on the other device by scanning the QR. The phone stays in its browser and becomes the second spatial camera.</p><div class="qr"><img id="qrImg"></div><b id="code">------</b><p class="small" id="pairState">Waiting…</p><button id="closePair">Close</button><button id="copy">Copy Link</button></div></div><div class="modal" id="qrScan"><div class="card"><h2>Scan Connection QR</h2><video id="scanVideo" playsinline muted></video><p class="small" id="qrState">Point the headset camera at the QR.</p><button id="closeScan">Cancel</button></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><script>
'use strict';
const $=x=>document.getElementById(x);let scene,camera,renderer,controls,pts,remotePts,peer,conn,peerId,remoteStream,camStream,scanStream,recording=false,frames=[],localN=0,remoteN=0,recChunks=[],recorder,raf;
const positions=[],colors=[];const MAX=120000;
function status(s){$('status').textContent=s;}
function init(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.05,500);camera.position.set(0,1,7);renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(MAX*3),3));g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(MAX*3),3));g.setDrawRange(0,0);pts=new THREE.Points(g,new THREE.PointsMaterial({size:.055,vertexColors:true,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(pts);scene.add(new THREE.GridHelper(10,20,0x204080,0x101015));renderer.setAnimationLoop(tick);addEventListener('resize',resize);createHost();}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function tick(){controls.update();renderer.render(scene,camera);if(recording)captureSpatial();}
async function cameraOn(video,mode='environment'){if(!navigator.mediaDevices?.getUserMedia)throw Error('Camera API unavailable');return navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:mode},width:{ideal:1280},height:{ideal:720}},audio:false}).then(async s=>{video.srcObject=s;await video.play();return s})}
async function startScan(){if(!camStream)try{camStream=await cameraOn(document.createElement('video'));}catch(e){status('Camera permission required');return}window._cam=camStream;const v=window._camVideo||(window._camVideo=document.createElement('video'));v.srcObject=camStream;v.muted=true;v.playsInline=true;await v.play();status('Scanning with local camera');$('record').disabled=false;sample(v)}
function sample(v){if(!window._sampling)return;const w=180,h=Math.max(100,Math.round(v.videoHeight/v.videoWidth*w));const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(v,0,0,w,h);const d=x.getImageData(0,0,w,h).data,a=pts.geometry.attributes.position.array,col=pts.geometry.attributes.color.array;let n=0;for(let y=2;y<h-2;y+=2)for(let x0=2;x0<w-2;x0+=2){if(n>=MAX)break;const i=(y*w+x0)*4,r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,l=.299*r+.587*g+.114*b;if(l<.04||l>.97)continue;const j=n*3;a[j]=(x0/w-.5)*4;a[j+1]=(.5-y/h)*3+0.3;a[j+2]=(1-l)*5-2.5;col[j]=r;col[j+1]=g;col[j+2]=b;n++}pts.geometry.setDrawRange(0,n);pts.geometry.attributes.position.needsUpdate=true;pts.geometry.attributes.color.needsUpdate=true;localN=n;$('stats').textContent=`Local ${localN} · Remote ${remoteN} · Frames ${frames.length} · Device ${conn?.open?1:0}`;if(conn?.open&&n)conn.send({t:'spatial',p:Array.from(a.slice(0,n*3)),c:Array.from(col.slice(0,n*3)),n});requestAnimationFrame(()=>sample(v))}
function captureSpatial(){const n=localN;if(!n)return;frames.push({p:Array.from(pts.geometry.attributes.position.array.slice(0,n*3)),c:Array.from(pts.geometry.attributes.color.array.slice(0,n*3))});if(frames.length>240)frames.shift()}
$('scan').onclick=async()=>{if(window._sampling){window._sampling=false;$('scan').textContent='Scan';status('Scan paused')}else{window._sampling=true;$('scan').textContent='Stop';await startScan()}};
$('record').onclick=()=>{if(!recording){frames=[];recording=true;$('record').textContent='Stop Recording';status('Recording synchronized spatial capture…');startVideoRecording()}else{recording=false;$('record').textContent='Record';$('build').disabled=!frames.length;status(`${frames.length} spatial frames captured`)}};
function startVideoRecording(){const stream=renderer.domElement.captureStream?.(30);if(!stream||!window.MediaRecorder){status('Spatial frames recording; video recorder unavailable');return}recChunks=[];try{recorder=new MediaRecorder(stream,{mimeType:'video/webm'});recorder.ondataavailable=e=>e.data.size&&recChunks.push(e.data);recorder.onstop=()=>{const b=new Blob(recChunks,{type:'video/webm'});$('remote').src=URL.createObjectURL(b);$('play').disabled=false};recorder.start()}catch(e){}}
$('play').onclick=()=>{const v=$('remote');v.style.display=v.style.display==='none'?'block':'none';v.play().catch(()=>{})};
$('build').onclick=()=>{const g=new THREE.BufferGeometry(),p=[],c=[];for(let f=0;f<frames.length;f+=2){const F=frames[f],off=(f/Math.max(1,frames.length-1)-.5)*3;for(let i=0;i<F.p.length;i+=3){if(p.length/3>=MAX)break;p.push(F.p[i],F.p[i+1],F.p[i+2]+off);c.push(F.c[i],F.c[i+1],F.c[i+2])}}g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));const w=new THREE.Points(g,new THREE.PointsMaterial({size:.045,vertexColors:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(w);status(`Hologram built · ${p.length/3|0} points`);$('stats').textContent=`Local ${localN} · Remote ${remoteN} · Frames ${frames.length} · Device ${conn?.open?1:0}`};
$('clear').onclick=()=>{frames=[];pts.geometry.setDrawRange(0,0);status('Cleared')};
function createHost(){peer=new Peer();peer.on('open',id=>{peerId=id;status('Ready · Connect device')});peer.on('connection',c=>attach(c))}
function attach(c){conn=c;c.on('open',()=>{status('Camera device connected');$('pairState').textContent='Connected';$('stats').textContent=`Local ${localN} · Remote ${remoteN} · Frames ${frames.length} · Device 1`});c.on('data',d=>{if(d.t==='spatial'){remoteN=d.n||0;const g=remotePts?.geometry||new THREE.BufferGeometry();if(!remotePts){g.setAttribute('position',new THREE.Float32BufferAttribute(d.p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(d.c,3));remotePts=new THREE.Points(g,new THREE.PointsMaterial({size:.045,vertexColors:true,transparent:true,opacity:.7,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(remotePts)}else{g.setAttribute('position',new THREE.Float32BufferAttribute(d.p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(d.c,3))}remoteN=d.n}});c.on('close',()=>status('Device disconnected'))}
function hostLink(){return location.href.split('?')[0]+'?host='+encodeURIComponent(peerId)}
$('connect').onclick=()=>{if(!peerId){status('Preparing connection…');return}$('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=600x600&data='+encodeURIComponent(hostLink());$('code').textContent=peerId.slice(-6).toUpperCase();$('pair').classList.add('on')};$('closePair').onclick=()=>$('pair').classList.remove('on');$('copy').onclick=()=>navigator.clipboard?.writeText(hostLink());
async function phoneMode(host){$('scan').style.display='none';$('connect').style.display='none';$('record').style.display='none';$('build').style.display='none';status('Camera device · connect and scan');peer=new Peer();peer.on('open',()=>{conn=peer.connect(host,{reliable:true});conn.on('open',async()=>{status('Connected · starting camera');try{const v=document.createElement('video');const s=await cameraOn(v);window._sampling=true;phoneSample(v)}catch(e){status('Allow camera access to continue')}})})}
function phoneSample(v){if(!window._sampling||!conn?.open){setTimeout(()=>phoneSample(v),500);return}const w=160,h=Math.max(90,Math.round(v.videoHeight/v.videoWidth*w)),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(v,0,0,w,h);const d=x.getImageData(0,0,w,h).data,p=[],cl=[];for(let y=2;y<h-2;y+=3)for(let xx=2;xx<w-2;xx+=3){const i=(y*w+xx)*4,r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,l=.299*r+.587*g+.114*b;if(l<.04||l>.97)continue;p.push((xx/w-.5)*4,(.5-y/h)*3+.3,(1-l)*5-2.5);cl.push(r,g,b)}conn.send({t:'spatial',p,c:cl,n:p.length/3});setTimeout(()=>phoneSample(v),120)}
async function qrScan(){if(!navigator.mediaDevices?.getUserMedia)return;const v=$('scanVideo');$('qrScan').classList.add('on');try{scanStream=await cameraOn(v);const c=document.createElement('canvas'),x=c.getContext('2d');const loop=()=>{if(!$('qrScan').classList.contains('on'))return;if(v.readyState>=2){c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);const q=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);if(q?.data){const u=new URL(q.data);const host=u.searchParams.get('host');if(host){closeQR();phoneMode(host);return}}}requestAnimationFrame(loop)};loop()}catch(e){$('qrState').textContent='Camera permission required'}}
function closeQR(){if(scanStream)scanStream.getTracks().forEach(t=>t.stop());$('qrScan').classList.remove('on')}
$('closeScan').onclick=closeQR;
$('connect').ondblclick=qrScan;
let params=new URLSearchParams(location.search);if(params.get('host'))phoneMode(params.get('host'));else init();
</script></body></html>
