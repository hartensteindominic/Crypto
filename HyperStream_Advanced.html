<!doctype html><html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HyperStream 5D Spatial Hologram</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02050a;color:#eaf5ff;font:14px system-ui}#v{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:10px;border:1px solid #ffffff20;border-radius:18px;background:#080d14ed;backdrop-filter:blur(12px)}button{border:0;border-radius:10px;padding:9px 11px;margin:2px;background:#176fc1;color:#fff;font-weight:700}button:disabled{opacity:.35}.sm{font-size:12px;color:#91a4b8}.st{color:#bce7ff}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000e;align-items:center;justify-content:center}.on{display:flex}.card{width:min(430px,94%);padding:16px;background:#151b23;border-radius:18px;text-align:center}.card video{width:100%;border-radius:12px}.qr{width:270px;height:270px;margin:10px auto;background:#fff}.meter{height:3px;background:#102033}.meter i{display:block;height:100%;width:0;background:#42b6ff}</style><canvas id=v></canvas><div class=ui><div id=s class=st>HyperStream 5D ready</div><div><button id=start>Start Spatial</button><button id=connect>Connect Quest</button><button id=scan>Scan QR</button><button id=flip>Flip Camera</button><button id=mode>Hologram</button><button id=lock disabled>Lock Space</button><button id=clear>Clear</button></div><div id=stats class=sm>XYZ 0 · Depth 0% · Solid 0% · Coverage 0% · 5D 0% · Local</div><div class=meter><i id=m></i></div></div><div id=qrm class=modal><div class=card><b>Quest Pairing</b><canvas id=qr class=qr></canvas><div id=qt class=sm>Show this code to the Quest.</div><button id=qrc>Close</button></div></div><div id=scm class=modal><div class=card><b>Scan Quest QR</b><video id=sv autoplay playsinline muted></video><div id=sm class=sm>Starting scanner…</div><button id=scc>Close</button></div></div><script>(()=>{const $=x=>document.getElementById(x),c=$('v'),x=c.getContext('2d'),sc=document.createElement('canvas'),sx=sc.getContext('2d',{willReadFrequently:true});let W,H,D,vid,med,front=0,run=0,mode=0,lock=0,raf,last=0,cells=new Map(),prev=[],pose={x:0,y:0,z:0,r:0},pc,ch,scanStream;const C=.075,MAX=12000;function st(t){$('s').textContent=t}function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);draw()}addEventListener('resize',size);size();function draw(){x.fillStyle='#02050a';x.fillRect(0,0,W,H);let a=[...cells.values()].filter(v=>v.keep);a.sort((p,q)=>q.z-p.z);for(let v of a){let dx=v.x-pose.x,dz=v.z-pose.z,ca=Math.cos(pose.r),sa=Math.sin(pose.r),rx=dx*ca-dz*sa,rz=dx*sa+dz*ca;if(rz<-.3)continue;let z=1/(.65+rz*.1),px=W/2+rx*Math.min(W,H)*.105*z,py=H/2-(v.y-pose.y)*Math.min(W,H)*.105*z,r=Math.max(.7,4*z*(.45+v.s));x.globalAlpha=.12+.82*v.s;if(mode==0)x.fillStyle=`rgb(${8+40*v.state},${65+110*v.state},${120+130*v.state})`;else if(mode==1)x.fillStyle=`rgb(${30+180*Math.min(1,rz/7)},${100+100*Math.max(0,1-rz/7)},255)`;else x.fillStyle='#d9efff';x.beginPath();x.arc(px,py,r,0,7);x.fill()}x.globalAlpha=1;x.strokeStyle='#153550';x.strokeRect(W*.16,H*.1,W*.68,H*.72);let n=a.length,d=n?a.reduce((q,v)=>q+v.d,0)/n:0,s=n?a.reduce((q,v)=>q+v.s,0)/n:0,t=n?a.reduce((q,v)=>q+v.t,0)/n:0,cv=Math.min(100,n/100);$('stats').textContent=`XYZ ${cells.size} · Depth ${d*100|0}% · Solid ${s*100|0}% · Coverage ${cv|0}% · 5D ${t*100|0}% · ${navigator.connection?.effectiveType||'Local'}`;$('m').style.width=cv+'%';$('lock').disabled=n<20}function feats(){if(!vid||vid.readyState<2)return[];let w=360,h=270;sc.width=w;sc.height=h;sx.drawImage(vid,0,0,w,h);let d=sx.getImageData(0,0,w,h).data,a=[];for(let y=5;y<h-5;y+=5)for(let X=5;X<w-5;X+=5){let i=(y*w+X)*4,g=.299*d[i]+.587*d[i+1]+.114*d[i+2],l=.299*d[i-4]+.587*d[i-3]+.114*d[i-2],r=.299*d[i+4]+.587*d[i+5]+.114*d[i+6],u=.299*d[i-4*w]+.587*d[i-4*w+1]+.114*d[i-4*w+2],dn=.299*d[i+4*w]+.587*d[i+4*w+1]+.114*d[i+4*w+2],e=Math.abs(g-l)+Math.abs(g-r)+Math.abs(g-u)+Math.abs(g-dn);if(e>15)a.push({x:X,y,e,r:d[i]/255,g:d[i+1]/255,b:d[i+2]/255})}return a.sort((a,b)=>b.e-a.e).slice(0,850)}function motion(a){if(!prev.length)return;let sx=0,sy=0,n=0;for(let p of a.slice(0,120)){let b=prev[Math.min(prev.length-1,Math.floor(p.y/270*prev.length))];if(b){sx+=b.x-p.x;sy+=b.y-p.y;n++}}if(n){pose.x+=sx/n*.0008;pose.y-=sy/n*.0008;pose.r+=sx/n*.00002}}function fuse(a,remote=0){for(let p of a){let z=Math.max(.35,Math.min(9,1+(1-Math.min(1,p.e/480))*6)),xx=(p.x-180)/110*z+pose.x,yy=(135-p.y)/110*z+pose.y,k=`${Math.round(xx/C)},${Math.round(yy/C)},${Math.round(z/C)}`,v=cells.get(k);if(!v)cells.set(k,{x:xx,y:yy,z,d:Math.min(1,p.e/250),s:remote?.32:.16,t:remote?.3:.12,h:1,age:0,r:p.r,g:p.g,b:p.b,keep:1});else{v.x+=.13*(xx-v.x);v.y+=.13*(yy-v.y);v.z+=.13*(z-v.z);v.d=.84*v.d+.16*Math.min(1,p.e/250);v.h=Math.min(255,v.h+1);v.age=0;v.r=.9*v.r+.1*p.r;v.g=.9*v.g+.1*p.g;v.b=.9*v.b+.1*p.b}}for(let v of cells.values()){v.age++;let o=Math.min(1,v.h/7),fresh=Math.max(0,1-v.age/45);v.s=Math.min(1,.18*v.d+.64*o+.18*fresh);v.t=Math.min(1,.45*v.s+.3*o+.15*fresh+.1*remote);v.keep=v.s>.23&&fresh>.02}if(cells.size>MAX)cells=new Map([...cells].filter(e=>e[1].keep).sort((a,b)=>b[1].t-a[1].t).slice(0,MAX));draw()}async function cam(){if(med)med.getTracks().forEach(t=>t.stop());try{med=await navigator.mediaDevices.getUserMedia({video:{facingMode:front?'user':{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});vid=document.createElement('video');vid.srcObject=med;vid.muted=1;vid.playsInline=1;await vid.play();return 1}catch(e){st('Camera permission blocked. Allow camera and retry.');return 0}}async function start(){if(run){run=0;cancelAnimationFrame(raf);$('start').textContent='Start Spatial';st('Spatial paused · map retained');return}st('Starting processor…');if(!await cam())return;run=1;lock=0;$('start').textContent='Stop Spatial';st('PHONE 5D PROCESSOR · scanning image surfaces');tick()}function tick(t=0){if(!run)return;if(t-last>55){last=t;let a=feats();if(a.length){motion(a);fuse(a);prev=a;send(a)}}raf=requestAnimationFrame(tick)}function send(a){if(ch?.readyState==='open')try{ch.send(JSON.stringify({type:'5d',pose,frame:a.slice(0,350),t:performance.now()}))}catch(e){}}$('start').onclick=start;$('flip').onclick=async()=>{front=!front;st('Switching lens…');if(await cam())st(`${front?'Front':'Back'} camera · same spatial world`)};$('mode').onclick=()=>{mode=(mode+1)%3;$('mode').textContent=['Hologram','Depth','Structure'][mode];draw()};$('lock').onclick=()=>{run=0;cancelAnimationFrame(raf);$('start').textContent='Start Spatial';st('SPATIAL LOCKED · hologram preserved')};$('clear').onclick=()=>{cells.clear();prev=[];pose={x:0,y:0,z:0,r:0};draw();st('Spatial world cleared')};async function lib(u){return new Promise((ok,no)=>{let s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}async function qr(t){let q=$('qr'),z=q.getContext('2d');q.width=q.height=540;z.fillStyle='#fff';z.fillRect(0,0,540,540);try{await lib('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js');let r=qrcode(0,'M');r.addData(t);r.make();let n=r.getModuleCount(),k=Math.floor(500/n);z.fillStyle='#000';for(let y=0;y<n;y++)for(let X=0;X<n;X++)if(r.isDark(y,X))z.fillRect(20+X*k,20+y*k,k,k)}catch(e){z.fillStyle='#111';z.font='16px system-ui';z.fillText('QR generator unavailable',165,265)}}$('connect').onclick=async()=>{if(!window.RTCPeerConnection)return st('WebRTC unavailable · phone-only mode works');$('qrm').classList.add('on');try{pc=new RTCPeerConnection();ch=pc.createDataChannel('hyperstream');ch.onopen=()=>st('QUEST CONNECTED · 5D spatial data active');pc.onicecandidate=async()=>{};let offer=await pc.createOffer();await pc.setLocalDescription(offer);await new Promise(r=>setTimeout(r,800));let token=btoa(JSON.stringify({sdp:pc.localDescription}));await qr(token);$('qt').textContent='Scan this with the Quest scanner. 5G/Wi‑Fi carries spatial packets.'}catch(e){st('Quest pairing failed · phone mode remains active')}};$('qrc').onclick=()=>{$('qrm').classList.remove('on')};$('scan').onclick=async()=>{$('scm').classList.add('on');try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});$('sv').srcObject=scanStream;await $('sv').play();if('BarcodeDetector'in window){let bd=new BarcodeDetector({formats:['qr_code']});let loop=async()=>{if(!$('scm').classList.contains('on'))return;try{let a=await bd.detect($('sv'));if(a.length){$('sm').textContent='QR recognized · pairing data received';return}}catch(e){}$('sm').textContent='Scanning…';setTimeout(loop,250)};loop()}else $('sm').textContent='Camera active · this browser has no native QR decoder.'}catch(e){$('sm').textContent='Camera permission required.'}};$('scc').onclick=()=>{$('scm').classList.remove('on');scanStream?.getTracks().forEach(t=>t.stop())};addEventListener('error',e=>st('Runtime error: '+e.message));addEventListener('unhandledrejection',e=>st('Runtime error: '+(e.reason?.message||e.reason)));draw();st('Ready · phone-first 5D spatial hologram')})();</script></html>
