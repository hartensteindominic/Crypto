<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HyperStream Advanced Spatial</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020407;color:#eef;font:14px system-ui}#view{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;left:10px;right:10px;bottom:10px;z-index:5;padding:9px;border:1px solid #ffffff18;border-radius:17px;background:#090d14ed;backdrop-filter:blur(12px)}button{border:0;border-radius:10px;padding:9px 11px;margin:2px;background:#176fc1;color:#fff;font-weight:700}button:disabled{opacity:.35}.status{color:#bde5ff}.small{font-size:12px;color:#93a1b2}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000e;align-items:center;justify-content:center;padding:14px}.on{display:flex}.card{width:min(430px,100%);padding:16px;border-radius:18px;background:#151a21;text-align:center}.qr{width:250px;height:250px;margin:10px auto;background:#fff;padding:7px}.qr canvas{width:100%;height:100%}video{width:100%;max-height:55vh;border-radius:14px;object-fit:cover}</style></head><body><canvas id=view></canvas><div class=ui><div class=status id=status>HyperStream ready</div><div><button id=scan>Scan QR</button><button id=show>Show QR</button><button id=start>Start Spatial</button><button id=flip>Flip iPhone</button><button id=rec disabled>Record</button><button id=build disabled>Build Hologram</button><button id=play disabled>Play</button><button id=clear>Clear</button></div><div class=small id=stats>Quest 0 · iPhone 0 · XYZ 0 · Depth 0% · Solid 0%</div></div><div class=modal id=qrbox><div class=card><h3>Connect Quest</h3><div class=qr><canvas id=qrcode></canvas></div><div id=pair>Preparing…</div><button id=closeqr>Close</button></div></div><div class=modal id=scanbox><div class=card><h3>Scan Quest QR</h3><video id=scanvideo autoplay playsinline muted></video><p id=scanmsg class=small>Point the iPhone at the QR.</p><button id=closescan>Cancel</button></div></div><script>const $=x=>document.getElementById(x);let peer,conn,three,scene,camera,renderer,controls,stream,video,front=false,running=false,recording=false,local=[],remote=[],cells=new Map(),frames=0,last=0,lastRender=0;const VOX=.10,MAX=8000,KEY_MS=140;const say=t=>$('status').textContent=t;const load=u=>new Promise((ok,no)=>{if(document.querySelector(`script[src="${u}"]`))return ok();let s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});async function net(){if(peer)return;await load('https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js');peer=new Peer();peer.on('open',()=>say(location.search.includes('host')?'iPhone ready · Show QR':'Quest ready · Scan QR'));peer.on('connection',bind);peer.on('error',()=>say('Connection error · scan QR again'))}function bind(c){conn=c;c.on('open',()=>{say('CONNECTED · dual camera spatial fusion');$('start').disabled=false;c.send({t:'hello'})});c.on('data',d=>{if(d.t==='frame')remote=d.f||[];if(d.t==='hello')say('CONNECTED · dual camera spatial fusion')});c.on('close',()=>say('Quest disconnected · spatial map preserved'))}async function makeQR(){await net();await load('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js');let q=qrcode(0,'M');q.addData(location.href.split('?')[0]+'?host='+encodeURIComponent(peer.id));q.make();let c=$('qrcode'),x=c.getContext('2d'),n=q.getModuleCount(),z=Math.floor(720/(n+8));c.width=c.height=(n+8)*z;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';for(let y=0;y<n;y++)for(let X=0;X<n;X++)if(q.isDark(y,X))x.fillRect((X+4)*z,(y+4)*z,z,z);$('pair').textContent='PAIR '+peer.id.slice(-7).toUpperCase()}$('show').onclick=async()=>{$('qrbox').classList.add('on');try{await makeQR()}catch(e){$('pair').textContent='QR unavailable'}};$('closeqr').onclick=()=>$('qrbox').classList.remove('on');async function scanQR(){await load('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js');$('scanbox').classList.add('on');try{let v=$('scanvideo'),s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});v.srcObject=s;await v.play();let cv=document.createElement('canvas'),x=cv.getContext('2d',{willReadFrequently:true});let loop=()=>{if(!$('scanbox').classList.contains('on')){s.getTracks().forEach(t=>t.stop());return}if(!v.videoWidth)return requestAnimationFrame(loop);cv.width=v.videoWidth;cv.height=v.videoHeight;x.drawImage(v,0,0);let d=x.getImageData(0,0,cv.width,cv.height),q=jsQR(d.data,cv.width,cv.height,{inversionAttempts:'attemptBoth'});if(q)try{let u=new URL(q.data),id=u.searchParams.get('host');if(id){s.getTracks().forEach(t=>t.stop());$('scanbox').classList.remove('on');net().then(()=>bind(peer.connect(id,{reliable:true})));return}}catch(e){}requestAnimationFrame(loop)};loop()}catch(e){$('scanmsg').textContent='Camera permission required'}}$('scan').onclick=scanQR;$('closescan').onclick=()=>$('scanbox').classList.remove('on');async function init3d(){if(renderer)return;await load('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');await load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js');scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.01,100);camera.position.set(0,.8,4.5);renderer=new THREE.WebGLRenderer({canvas:$('view'),antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.35));renderer.setSize(innerWidth,innerHeight);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=.03;scene.add(new THREE.GridHelper(12,24,0x142a40,0x080d14));renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}async function camera(onFront=front){if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:onFront?'user':{ideal:'environment'},width:{ideal:960},height:{ideal:540}},audio:false});video=video||document.createElement('video');video.srcObject=stream;video.muted=true;video.playsInline=true;await video.play();say(`iPhone ${onFront?'front':'back'} camera · collecting`);return true}catch(e){say('Camera permission required');return false}}$('flip').onclick=async()=>{front=!front;if(running)await camera(front);else say(`iPhone ${front?'front':'back'} selected`)};function sample(){let w=224,h=168,cv=document.createElement('canvas');cv.width=w;cv.height=h;let x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(video,0,0,w,h);let d=x.getImageData(0,0,w,h).data,a=[];for(let y=7;y<h-7;y+=5)for(let X=7;X<w-7;X+=5){let i=(y*w+X)*4,g=.299*d[i]+.587*d[i+1]+.114*d[i+2],gx=Math.abs(d[i]-d[i-4])+Math.abs(d[i]-d[i+4])+Math.abs(d[i]-d[i-4*w])+Math.abs(d[i]-d[i+4*w]);if(gx<42)continue;let desc=[];for(let dy=-4;dy<=4;dy+=2)for(let dx=-4;dx<=4;dx+=2){let j=((y+dy)*w+X+dx)*4;desc.push((.299*d[j]+.587*d[j+1]+.114*d[j+2])-g)}a.push({x:X,y,edge:gx,d:desc,r:d[i],g:d[i+1],b:d[i+2]})}return a.sort((a,b)=>b.edge-a.edge).slice(0,300)}function matches(a,b){let out=[],used=new Set();for(let p of a){let bi=-1,be=1e9;for(let j=0;j<b.length;j++){if(used.has(j))continue;let q=b[j],dx=q.x-p.x,dy=q.y-p.y;if(Math.abs(dx)>130||Math.abs(dy)>90)continue;let e=dx*dx+dy*dy;for(let k=0;k<p.d.length;k++)e+=Math.abs(p.d[k]-q.d[k]);if(e<be){be=e;bi=j}}if(bi>=0&&be<10500){used.add(bi);out.push([p,b[bi],be])}}return out}function stereo(a,b){let m=matches(a,b),o=[];for(let [p,q,e] of m){let disp=Math.abs(p.x-q.x);if(disp<3||disp>130)continue;let z=Math.max(.4,Math.min(9,105/disp)),x=((p.x+q.x)/2-112)/90*z,y=(84-(p.y+q.y)/2)/90*z,conf=Math.max(.15,Math.min(1,1-e/10500));o.push({x,y,z,conf,color:[p.r/255,p.g/255,p.b/255],solid:conf,obs:1,age:0,motion:0})}return o}function mono(a){return a.map(p=>{let z=2.4+(1-p.edge/700)*2.5;return{x:(p.x-112)/90*z,y:(84-p.y)/90*z,z,conf:.24,color:[p.r/255,p.g/255,p.b/255],solid:.24,obs:1,age:0,motion:0}})}function fuse(ps,dir){for(let p of ps){let k=`${Math.round(p.x/VOX)},${Math.round(p.y/VOX)},${Math.round(p.z/VOX)}`,v=cells.get(k);if(v){let ox=v.x,oy=v.y,oz=v.z,w=.16+.20*p.conf;v.x+=(p.x-v.x)*w;v.y+=(p.y-v.y)*w;v.z+=(p.z-v.z)*w;v.conf=.75*v.conf+.25*p.conf;v.solid=Math.min(1,.72*v.solid+.28*p.solid);v.color=v.color.map((c,i)=>.82*c+.18*p.color[i]);v.obs=Math.min(255,v.obs+1);v.age=0;v.motion=Math.min(1,v.motion*.8+Math.hypot(p.x-ox,p.y-oy,p.z-oz)*.2);v.dir=dir}else cells.set(k,{...p,dir})}for(let v of cells.values()){v.age++;let stable=Math.min(1,v.obs/8),fresh=Math.max(0,1-v.age/45),move=1-Math.min(.8,v.motion);v.depth=Math.max(0,Math.min(1,.42*v.conf+.28*v.solid+.18*stable+.12*fresh));v.keep=v.solid>.30&&stable>.12&&fresh>.03&&move>.12}if(cells.size>MAX){let arr=[...cells.values()].filter(v=>v.keep).sort((a,b)=>b.depth-a.depth);cells=new Map(arr.slice(0,MAX).map(v=>[`${Math.round(v.x/VOX)},${Math.round(v.y/VOX)},${Math.round(v.z/VOX)}`,v]))}render()}function render(){if(!renderer||performance.now()-lastRender<65)return;lastRender=performance.now();let p=[],c=[];for(let v of cells.values()){if(!v.keep)continue;let q=.35+.65*v.depth;p.push(v.x,v.y,v.z);c.push(.04+.08*q,.20+.40*q,.42+.52*q)}if(window.mesh){scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose()}let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));window.mesh=new THREE.Points(g,new THREE.PointsMaterial({size:.034,vertexColors:true,transparent:true,opacity:.92,depthWrite:true,sizeAttenuation:true}));scene.add(mesh);let vals=[...cells.values()],solid=vals.length?vals.reduce((s,v)=>s+v.solid,0)/vals.length:0,depth=vals.length?vals.reduce((s,v)=>s+v.depth,0)/vals.length:0;$('stats').textContent=`Quest ${remote.length} · iPhone ${local.length} · XYZ ${cells.size} · Depth ${Math.round(depth*100)}% · Solid ${Math.round(solid*100)}%`;$('build').disabled=cells.size<20}async function spatial(){await init3d();if(!await camera(front))return;running=true;$('rec').disabled=false;say(conn?.open?'DUAL CAMERA · FORWARD + REVERSE FUSION':'iPHONE SPATIAL · waiting for Quest');let t0=0;let loop=t=>{if(!running)return;if(t-t0<70){requestAnimationFrame(loop);return}t0=t;local=sample();sendFrame();let ps=remote.length?stereo(local,remote):mono(local);fuse(ps,front?'REVERSE':'FORWARD');frames++;requestAnimationFrame(loop)};requestAnimationFrame(loop)}function sendFrame(){if(conn?.open)conn.send({t:'frame',f:local})}$('start').onclick=spatial;$('build').onclick=()=>{render();$('play').disabled=false;say(`Cohesive solid-object map · ${cells.size.toLocaleString()} XYZ cells`)};$('rec').onclick=()=>{recording=!recording;$('rec').textContent=recording?'Stop':'Record';say(recording?'Recording forward/reverse spatial evolution':`Captured ${frames} processed frames`)};$('play').onclick=()=>{if(!renderer)return;let s=renderer.domElement.captureStream?.(30);if(!s||!MediaRecorder){say('3D playback ready');return}let chunks=[],r=new MediaRecorder(s);r.ondataavailable=e=>e.data.size&&chunks.push(e.data);r.onstop=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='HyperStream_Cohesive_XYZ.webm';a.click()};r.start();setTimeout(()=>r.stop(),6000);say('Rendering cohesive XYZ 3D video…')};$('clear').onclick=()=>{cells.clear();frames=0;if(window.mesh){scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose();window.mesh=null}$('build').disabled=true;$('play').disabled=true;say('Spatial map cleared')};net().then(()=>say(location.search.includes('host')?'iPhone ready · Show QR':'Quest ready · Scan QR'));</script></body></html>
