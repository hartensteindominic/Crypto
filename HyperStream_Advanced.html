<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HyperStream Spatial World</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a;color:#eef7ff;font:14px system-ui}#root{position:fixed;inset:0}#ui{position:fixed;z-index:10;left:10px;right:10px;bottom:10px;padding:10px;border:1px solid #ffffff22;border-radius:16px;background:#081019eF;backdrop-filter:blur(12px)}button,input{border:0;border-radius:9px;padding:9px;margin:2px}button{background:#176fc1;color:#fff;font-weight:700}input{width:220px;background:#111b25;color:#fff}.st{color:#bde9ff}.sm{font-size:12px;color:#91a4b8}.meter{height:3px;background:#102033;margin-top:6px}.meter i{display:block;height:100%;width:0;background:#42b6ff}#cam{display:none;position:fixed;right:10px;top:10px;width:180px;border-radius:12px;z-index:11}</style></head><body><div id="root"></div><video id="cam" autoplay playsinline muted></video><div id="ui"><div id="s" class="st">HyperStream Spatial World ready</div><div><input id="url" value="ws://192.168.1.100:8787"><button id="connect">Connect Quest</button><button id="xr">Enter VR</button><button id="map">Map</button><button id="rec">Record</button><button id="phone">Phone</button><button id="save">Save</button><button id="enter">Enter Saved</button><button id="clear">Clear</button></div><div id="stats" class="sm">Disconnected · World 0 · Mesh 0 · Planes 0 · Images 0 · Frames 0</div><div class="meter"><i id="m"></i></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js';
import {VRButton} from 'https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/webxr/VRButton.js';
const $=id=>document.getElementById(id);let scene,camera,renderer,group,grid,ws=null,xr=false,mapping=false,recording=false,phone=false,stream=null,video=$('cam'),frames=0,planes=0,meshes=0,images=0,history=[],samples=new Map(),lastPose={x:0,y:1.6,z:0};const KEY='hyperstream-spatial-v10';
init();
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x02050a);camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.03,100);camera.position.set(0,1.6,3);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;$('root').appendChild(renderer.domElement);group=new THREE.Group();scene.add(group);const amb=new THREE.HemisphereLight(0xb9e7ff,0x071019,1.8);scene.add(amb);const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshBasicMaterial({color:0x07131d,transparent:true,opacity:.75,side:THREE.DoubleSide}));floor.rotation.x=-Math.PI/2;scene.add(floor);grid=new THREE.GridHelper(20,40,0x1a4058,0x0d2638);grid.position.y=.002;scene.add(grid);addRoomGuides();renderer.setAnimationLoop(render);addEventListener('resize',resize);st('Ready · visible 3D world · waiting for Quest spatial stream')}
function addRoomGuides(){const mat=new THREE.LineBasicMaterial({color:0x173a55,transparent:true,opacity:.55});for(const [x,z] of [[-3,-3],[3,-3],[3,3],[-3,3]]){const geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,0,z),new THREE.Vector3(x,2.8,z)]);group.add(new THREE.Line(geo,mat))}const box=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(6,2.8,6)),mat);box.position.y=1.4;group.add(box)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function render(t){renderer.render(scene,camera);if(xr&&renderer.xr.isPresenting){const p=renderer.xr.getCamera().position;lastPose={x:p.x,y:p.y,z:p.z}}updateStats()}
function addSample(p){if(!Number.isFinite(p.x)||!Number.isFinite(p.y)||!Number.isFinite(p.z))return;const q={x:p.x,y:p.y,z:p.z,kind:p.kind||'surface',confidence:Math.max(0,Math.min(1,p.confidence??.8)),time:p.time||Date.now()};const k=`${Math.round(q.x/.08)},${Math.round(q.y/.08)},${Math.round(q.z/.08)}`;const old=samples.get(k);if(old){old.confidence=Math.max(old.confidence,q.confidence);old.time=q.time}else samples.set(k,q)}
function ingest(d){frames++;planes=Math.max(planes,d.planes||0);meshes=Math.max(meshes,d.meshes||0);for(const p of d.points||[])addSample(p);if(recording)history.push({time:d.time||Date.now(),samples:samples.size,planes,meshes});rebuild();}
function rebuild(){while(group.children.length>4)group.remove(group.children[group.children.length-1]);const data=[...samples.values()];const geo=new THREE.BufferGeometry();const pos=new Float32Array(data.length*3);for(let i=0;i<data.length;i++){pos[i*3]=data[i].x;pos[i*3+1]=data[i].y;pos[i*3+2]=data[i].z}geo.setAttribute('position',new THREE.BufferAttribute(pos,3));const mat=new THREE.PointsMaterial({color:0x55bce8,size:.035,sizeAttenuation:true,transparent:true,opacity:.8});group.add(new THREE.Points(geo,mat));if(data.length){const box=new THREE.Box3().setFromPoints(data.map(p=>new THREE.Vector3(p.x,p.y,p.z)));const size=box.getSize(new THREE.Vector3());if(size.x<.2&&size.z<.2){}}updateStats()}
function updateStats(){const pct=Math.min(100,samples.size/30);$('stats').textContent=`${ws?.readyState===1?'CONNECTED':'Local'} · World ${samples.size} · Mesh ${meshes} · Planes ${planes} · Images ${images} · Frames ${frames}${recording?' · REC':''}`;$('m').style.width=pct+'%' }
$('connect').onclick=()=>{try{ws?.close();ws=new WebSocket($('url').value.trim());ws.onopen=()=>st('QUEST CONNECTED · receiving spatial data');ws.onclose=()=>st('Quest disconnected · world retained');ws.onerror=()=>st('Connection failed · verify Quest/relay IP');ws.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='phone-image')receiveImage(d);else ingest(d)}catch(_){}}}catch(e){st('Connection error: '+e.message)}};
$('xr').onclick=async()=>{if(!navigator.xr)return st('WebXR unavailable in this browser');try{const supported=await navigator.xr.isSessionSupported('immersive-vr');if(!supported)return st('Immersive VR unavailable · use Quest Browser');const session=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});renderer.xr.setSession(session);xr=true;st('VR ACTIVE · HyperStream 3D world is visible');session.addEventListener('end',()=>{xr=false;st('VR ended · world retained')})}catch(e){st('VR start failed: '+e.message)}};
$('map').onclick=()=>{mapping=!mapping;$('map').textContent=mapping?'Mapping ON':'Map';st(mapping?'MAPPING ACTIVE · walk slowly while Quest sends spatial data':'Mapping paused · spatial world retained')};
$('rec').onclick=()=>{if(!mapping)return st('Start Map first');recording=!recording;$('rec').textContent=recording?'Stop Record':'Record';st(recording?'RECORDING WORLD HISTORY':'Recording stopped · history retained')};
$('phone').onclick=async()=>{if(phone){phone=false;stream?.getTracks().forEach(t=>t.stop());video.style.display='none';$('phone').textContent='Phone';st('Phone enrichment off');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();phone=true;video.style.display='block';$('phone').textContent='Phone ON';st('PHONE ENRICHMENT ACTIVE · camera linked to current world');sendPhoneFrames()}catch(e){st('Phone camera unavailable: '+e.message)}};
function sendPhoneFrames(){if(!phone)return;const c=document.createElement('canvas');c.width=640;c.height=360;const x=c.getContext('2d');x.drawImage(video,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.55).split(',')[1];if(ws?.readyState===1)ws.send(JSON.stringify({type:'phone-image',data,x:lastPose.x,y:lastPose.y,z:lastPose.z,time:Date.now()}));images++;setTimeout(sendPhoneFrames,1000)}
function receiveImage(d){const im=new Image();im.onload=()=>{const tex=new THREE.Texture(im);tex.needsUpdate=true;const mat=new THREE.SpriteMaterial({map:tex,transparent:true,opacity:.92});const s=new THREE.Sprite(mat);s.position.set(d.x||lastPose.x,d.y||lastPose.y,d.z||lastPose.z);s.scale.set(1.2,.675,1);group.add(s);images++;updateStats()};im.src='data:image/jpeg;base64,'+d.data}
$('save').onclick=()=>{const d={version:10,dimensions:['X','Y','Z','T','S'],created:Date.now(),planes,meshes,frames,history,samples:[...samples.values()]};localStorage.setItem(KEY,JSON.stringify(d));st('WORLD SAVED · '+samples.size+' spatial cells')};
$('enter').onclick=()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(!d)return st('No saved world');samples.clear();for(const p of d.samples||[])addSample(p);planes=d.planes||0;meshes=d.meshes||0;frames=d.frames||0;history=d.history||[];rebuild();st('ENTERED SAVED WORLD · '+samples.size+' spatial cells')}catch(e){st('Saved world error: '+e.message)}};
$('clear').onclick=()=>{samples.clear();history=[];planes=meshes=frames=images=0;rebuild();st('World cleared')};function st(t){$('s').textContent=t}updateStats();
</script></body></html>
