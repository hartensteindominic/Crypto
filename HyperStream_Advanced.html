<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HyperStream Dual Spatial</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02050b;color:#fff;font:14px system-ui}#c{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:10px;border:1px solid #ffffff22;border-radius:18px;background:#0b1020dd;backdrop-filter:blur(12px)}button{border:0;border-radius:11px;padding:10px;margin:3px;background:#176cff;color:#fff;font-weight:700}button:disabled{opacity:.35}.status{color:#9bd5ff}.small{color:#aab4c8;font-size:12px}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000e;align-items:center;justify-content:center;padding:14px}.on{display:flex}.card{width:min(440px,100%);background:#111722;border:1px solid #ffffff18;border-radius:20px;padding:16px;text-align:center}.qr{width:250px;height:250px;background:#fff;margin:12px auto;padding:7px}.qr canvas{width:100%;height:100%}#qv{width:100%;max-height:55vh;object-fit:cover;border-radius:14px}.target{position:absolute;inset:18%;border:3px solid #55aaff;border-radius:18px}</style><script src=https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js></script><script src=https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js></script><script src=https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js></script><script src=https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js></script></head><body><canvas id=c></canvas><div class=ui><div class=status id=s>HyperStream ready</div><div><button id=q>Scan QR</button><button id=co>Show Pair QR</button><button id=sc>Start Spatial</button><button id=re disabled>Record</button><button id=bu disabled>Build Hologram</button><button id=pl disabled>Play</button><button id=cl>Clear</button></div><div class=small id=st>Quest 0 · iPhone 0 · fused 0 · frames 0 · layers 12</div></div><div class=modal id=pm><div class=card><h2>Quest Pairing</h2><div class=qr><canvas id=qc></canvas></div><b id=pc>CONNECTING</b><p class=small id=ps>Scan this with the Quest.</p><button id=x>Close</button></div></div><div class=modal id=qm><div class=card><h2>Scan iPhone</h2><div style=position:relative><video id=qv autoplay playsinline muted></video><div class=target></div></div><p class=small id=qs>Center the iPhone QR in the box.</p><button id=qx>Cancel</button></div></div><script src=https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js></script><script>(function(){const $=id=>document.getElementById(id),QS=new URLSearchParams(location.search),isPhone=!QS.has('host');let scene,camera,renderer,controls,peer,conn,stream,recording=false,rec,chunks=[],frames=[],world,local=0,remote=0;const MAX=150000,LAYERS=12;function status(x){$('s').textContent=x}function stats(){$('st').textContent=`Quest ${local.toLocaleString()} · iPhone ${remote.toLocaleString()} · fused ${(local+remote).toLocaleString()} · frames ${frames.length} · layers ${LAYERS}`}function init3(){if(scene)return;scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.02,500);camera.position.set(0,1,6);renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.GridHelper(12,24,0x21467a,0x101622));renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}function cloud(p,c,size=.04,op=.8){let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));let o=new THREE.Points(g,new THREE.PointsMaterial({size,vertexColors:true,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(o);return o}function node(k,p,c){if(window[k])scene.remove(window[k]);window[k]=cloud(p,c)}async function getCamera(v){if(!navigator.mediaDevices?.getUserMedia)throw Error('no camera');let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}},audio:false});v.srcObject=s;v.muted=true;await v.play();return s}function sample(v){let w=180,h=Math.max(100,Math.round((v.videoHeight||480)/(v.videoWidth||640)*w)),cv=document.createElement('canvas');cv.width=w;cv.height=h;let x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,w,h);let d=x.getImageData(0,0,w,h).data,p=[],c=[];for(let y=2;y<h-2;y+=3)for(let X=2;X<w-2;X+=3){let i=(y*w+X)*4,r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,l=.299*r+.587*g+.114*b;if(l<.02||l>.99)continue;let e=Math.abs(d[i]-d[i+4])/255;p.push((X/w-.5)*3.8,(.5-y/h)*2.8+.25,(1-l)*4.2+e*2.4-2.1);c.push(r,g,b)}return[p,c]}async function spatial(){init3();if(stream)return;let v=document.createElement('video');try{stream=await getCamera(v)}catch(e){status('Camera permission required');return}status((isPhone?'iPhone':'Quest')+' camera active · dual processor running');$('re').disabled=false;let tick=()=>{if(!stream)return;let [p,c]=sample(v);local=p.length/3;node('localCloud',p,c);if(recording)frames.push({p,c,t:performance.now(),src:isPhone?'iphone':'quest'});if(conn?.open)conn.send({type:'spatial',p,c,n:local,t:performance.now()});stats();setTimeout(tick,100)};tick()}function peerConfig(){return{debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}}}function startPeer(){return new Promise((resolve,reject)=>{if(peer)return resolve(peer.id);try{peer=new Peer(undefined,peerConfig())}catch(e){reject(e);return}peer.on('open',id=>resolve(id));peer.on('error',e=>{console.error(e);status('Connection service error. Try again.')})})}function makeQR(text){let qr=qrcode(0,'M');qr.addData(text);qr.make();let cv=$('qc'),ctx=cv.getContext('2d'),n=qr.getModuleCount(),pad=4,scale=Math.max(2,Math.floor(720/(n+pad*2)));cv.width=cv.height=(n+pad*2)*scale;ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#000';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(qr.isDark(y,x))ctx.fillRect((x+pad)*scale,(y+pad)*scale,scale,scale)}async function phoneHost(){let id=await startPeer();makeQR(location.origin+location.pathname+'?host='+encodeURIComponent(id));$('pc').textContent=id.slice(-8).toUpperCase();$('pm').classList.add('on');status('iPhone ready · QR generated locally');peer.on('connection',c=>{conn=c;c.on('open',async()=>{c.send({type:'hello'});status('CONNECTED · starting iPhone spatial processor');await spatial()});c.on('data',receive);c.on('close',()=>status('Quest disconnected'))})}function connect(id){startPeer().then(()=>{status('QR recognized · connecting…');conn=peer.connect(id,{reliable:true});conn.on('open',async()=>{status('CONNECTED · starting Quest spatial processor');conn.send({type:'hello'});await spatial()});conn.on('data',receive);conn.on('close',()=>status('Connection closed · scan again'));conn.on('error',()=>status('Data channel error'))}).catch(()=>status('Could not start connection'))}function receive(d){if(d.type!=='spatial')return;remote=d.n||0;node('remoteCloud',d.p,d.c);if(recording)frames.push({p:d.p,c:d.c,t:d.t,src:'remote'});stats()}async function scanQR(){if(!isPhone){$('qm').classList.add('on');let v=$('qv'),s;try{s=await getCamera(v)}catch(e){$('qs').textContent='Allow Quest camera access';return}let cv=document.createElement('canvas'),x=cv.getContext('2d',{willReadFrequently:true});let loop=()=>{if(!$('qm').classList.contains('on')){s.getTracks().forEach(t=>t.stop());return}if(v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;x.drawImage(v,0,0);let n=Math.min(cv.width,cv.height),sx=(cv.width-n)/2,sy=(cv.height-n)/2,d=x.getImageData(sx,sy,n,n),z=jsQR(d.data,n,n,{inversionAttempts:'attemptBoth'});if(z){try{let u=new URL(z.data),h=u.searchParams.get('host');if(h){s.getTracks().forEach(t=>t.stop());$('qm').classList.remove('on');connect(h);return}}catch(e){}}}requestAnimationFrame(loop)};loop()}else status('Use Show Pair QR on iPhone')}}function build(){if(!frames.length){status('Record synchronized frames first');return}if(world)scene.remove(world);let p=[],c=[],step=Math.max(1,Math.floor(frames.length/120));for(let f=0;f<frames.length;f+=step){let a=frames[f],off=(f/(frames.length-1||1)-.5)*2.2;for(let i=0;i<a.p.length&&p.length/3<MAX;i+=3){p.push(a.p[i],a.p[i+1],a.p[i+2]+off);c.push(a.c[i],a.c[i+1],a.c[i+2])}}world=cloud(p,c,.05,.95);for(let k=1;k<LAYERS;k++){let a=[],b=[];for(let i=k*3;i<p.length;i+=LAYERS*3){a.push(p[i],p[i+1],p[i+2]);b.push(c[i],c[i+1],c[i+2])}cloud(a,b,.028,.10)}status(`DUAL HOLOGRAPHIC MAP · ${(p.length/3).toLocaleString()} fused points`);$('bu').disabled=false}function record(){recording=!recording;$('re').textContent=recording?'Stop':'Record';if(recording){frames=[];chunks=[];if(renderer?.domElement.captureStream&&window.MediaRecorder){rec=new MediaRecorder(renderer.domElement.captureStream(30));rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{$('pl').dataset.u=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));$('pl').disabled=false};rec.start()}status('RECORDING · Quest + iPhone spatial fusion')}else{rec?.stop();$('bu').disabled=!frames.length;status(`${frames.length} synchronized frames captured`)}}$('q').onclick=scanQR;$('co').onclick=()=>isPhone?phoneHost():status('Quest scans the QR shown on iPhone');$('x').onclick=()=>$('pm').classList.remove('on');$('qx').onclick=()=>$('qm').classList.remove('on');$('sc').onclick=spatial;$('re').onclick=record;$('bu').onclick=build;$('pl').onclick=()=>{if($('pl').dataset.u)location.href=$('pl').dataset.u};$('cl').onclick=()=>{frames=[];if(world)scene.remove(world);world=null;status('Spatial memory cleared');stats()};init3();if(isPhone){status('iPhone · tap Show Pair QR')}else status('Quest · tap Scan QR');stats()})();</script></body></html>
