<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HyperStream Spatial</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020407;color:#eef;font:14px system-ui}#c{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:9px;border:1px solid #ffffff18;border-radius:17px;background:#090d14ed;backdrop-filter:blur(12px)}button{border:0;border-radius:10px;padding:9px 11px;margin:2px;background:#1976d2;color:#fff;font-weight:700}button:disabled{opacity:.35}.status{color:#b9e3ff}.small{color:#8e9aaa;font-size:12px}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000e;align-items:center;justify-content:center;padding:15px}.on{display:flex}.card{width:min(420px,100%);background:#151a21;border-radius:19px;padding:15px;text-align:center}.qr{width:250px;height:250px;background:#fff;margin:10px auto;padding:7px}.qr canvas{width:100%;height:100%}#qv{width:100%;border-radius:13px;max-height:60vh;object-fit:cover}.target{position:absolute;inset:17%;border:2px solid #4ba7ff;border-radius:16px}</style></head><body><canvas id=c></canvas><div class=ui><div class=status id=s>HyperStream ready</div><div><button id=q>Scan QR</button><button id=co>Show QR</button><button id=sc>Start Spatial</button><button id=re disabled>Record</button><button id=bu disabled>Build Hologram</button><button id=pl disabled>Play</button><button id=cl>Clear</button></div><div class=small id=st>Quest 0 · iPhone 0 · depth 0 · ready</div></div><div class=modal id=pm><div class=card><h2>Connect Quest</h2><div class=qr><canvas id=qc></canvas></div><div id=pair>Preparing…</div><p class=small>Scan this QR with Quest.</p><button id=x>Close</button></div></div><div class=modal id=qm><div class=card><h2>Scan QR</h2><div style="position:relative"><video id=qv autoplay playsinline muted></video><div class=target></div></div><p id=qs class=small>Center the QR.</p><button id=qx>Cancel</button></div></div><script>const $=id=>document.getElementById(id),isHost=!new URLSearchParams(location.search).has('host');let peer,conn,renderer,scene,camera,controls,stream,video,local=[],remote=[],prev=[],keyframes=[],live=[],running=false,recording=false,videoURL='',lastMatches=0;const say=t=>$('s').textContent=t,load=u=>new Promise((ok,no)=>{let s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});async function startPeer(){if(peer)return;await load('https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js');peer=new Peer();peer.on('open',()=>say(isHost?'iPhone ready · Show QR':'Quest ready · Scan QR'));peer.on('error',()=>say('Connection error · retry QR'));peer.on('connection',attach)}function attach(c){conn=c;c.on('open',()=>{say('CONNECTED · temporal stereo');send({type:'hello'});$('sc').disabled=false});c.on('data',d=>{if(d.type==='hello')say('CONNECTED · temporal stereo');if(d.type==='features')remote=d.f||[];if(d.type==='stop')say('Quest disconnected · 3D video preserved')});c.on('close',()=>{say('Quest disconnected · 3D video preserved');if(running)finish()})}function send(d){if(conn?.open)try{conn.send(d)}catch(e){}}async function showQR(){await startPeer();await load('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js');let q=qrcode(0,'M');q.addData(location.href.split('?')[0]+'?host='+encodeURIComponent(peer.id));q.make();let c=$('qc'),x=c.getContext('2d'),n=q.getModuleCount(),z=Math.floor(720/(n+8));c.width=c.height=(n+8)*z;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';for(let y=0;y<n;y++)for(let X=0;X<n;X++)if(q.isDark(y,X))x.fillRect((X+4)*z,(y+4)*z,z,z);$('pair').textContent='PAIR '+peer.id.slice(-6).toUpperCase()}$('co').onclick=async()=>{$('pm').classList.add('on');try{await showQR()}catch(e){$('pair').textContent='QR unavailable'}};$('x').onclick=()=>$('pm').classList.remove('on');async function scanQR(){await load('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js');$('qm').classList.add('on');try{let v=$('qv'),st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});v.srcObject=st;await v.play();let cv=document.createElement('canvas'),x=cv.getContext('2d',{willReadFrequently:true});const loop=()=>{if(!$('qm').classList.contains('on')){st.getTracks().forEach(t=>t.stop());return}if(!v.videoWidth)return requestAnimationFrame(loop);cv.width=v.videoWidth;cv.height=v.videoHeight;x.drawImage(v,0,0);let d=x.getImageData(0,0,cv.width,cv.height),q=jsQR(d.data,cv.width,cv.height,{inversionAttempts:'attemptBoth'});if(q)try{let u=new URL(q.data),id=u.searchParams.get('host');if(id){st.getTracks().forEach(t=>t.stop());$('qm').classList.remove('on');startPeer().then(()=>attach(peer.connect(id,{reliable:true})));return}}catch(e){}requestAnimationFrame(loop)};loop()}catch(e){$('qs').textContent='Camera permission required'}}$('q').onclick=scanQR;$('qx').onclick=()=>$('qm').classList.remove('on');async function boot(){if(renderer)return;await load('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');await load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js');scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.01,100);camera.position.set(0,.8,4.5);renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.4));renderer.setSize(innerWidth,innerHeight);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=.05;scene.add(new THREE.GridHelper(12,24,0x142a40,0x080d14));renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}async function cameraStart(){if(stream)return true;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:960},height:{ideal:540}},audio:false});video=document.createElement('video');video.muted=true;video.playsInline=true;video.srcObject=stream;await video.play();return true}catch(e){say('Camera permission required');return false}}function features(){let w=224,h=168,cv=document.createElement('canvas');cv.width=w;cv.height=h;let x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(video,0,0,w,h);let d=x.getImageData(0,0,w,h).data,a=[];for(let y=7;y<h-7;y+=5)for(let X=7;X<w-7;X+=5){let i=(y*w+X)*4,g=.299*d[i]+.587*d[i+1]+.114*d[i+2];let gx=Math.abs(d[i]-d[i-4])+Math.abs(d[i]-d[i+4])+Math.abs(d[i]-d[i-4*w])+Math.abs(d[i]-d[i+4*w]);if(gx<75)continue;let desc=[];for(let dy=-4;dy<=4;dy+=2)for(let dx=-4;dx<=4;dx+=2)desc.push((.299*d[((y+dy)*w+X+dx)*4]+.587*d[((y+dy)*w+X+dx)*4+1]+.114*d[((y+dy)*w+X+dx)*4+2])-g);a.push({x:X,y,score:gx,d:desc})}return a.sort((a,b)=>b.score-a.score).slice(0,220).map(v=>[v.x,v.y,...v.d])}function match(a,b){let out=[];for(let p of a){let best=null,bd=1e9;for(let q of b){let dx=q[0]-p[0],dy=q[1]-p[1];if(Math.abs(dx)>130||Math.abs(dy)>80)continue;let e=dx*dx+dy*dy;for(let k=2;k<p.length;k++)e+=Math.abs(p[k]-q[k])*1.5;if(e<bd){bd=e;best=q}}if(best&&bd<8500)out.push([p,best,bd])}return out}function stereo(a,b){let m=match(a,b),out=[];for(let [p,q,e] of m){let disp=Math.abs(p[0]-q[0]);if(disp<3||disp>130)continue;let depth=Math.max(.35,Math.min(9,.32*.9/disp*100));let x=((p[0]+q[0])*.5-112)/90*depth,y=(84-(p[1]+q[1])*.5)/90*depth;out.push({x,y,z:depth,c:Math.max(.08,1-e/8500)})}return{m:m.length,p:out}}function integrate(points){if(!points.length)return;/* temporal keyframe buffer: replace nearby samples, do not save every frame */let cells=new Map();for(let p of live)cells.set(`${Math.round(p.x/.075)},${Math.round(p.y/.075)},${Math.round(p.z/.075)}`,p);for(let p of points){let k=`${Math.round(p.x/.075)},${Math.round(p.y/.075)},${Math.round(p.z/.075)}`,old=cells.get(k);if(!old||p.c>old.c)cells.set(k,p)}live=[...cells.values()];if(live.length>4200)live=live.sort((a,b)=>b.c-a.c).slice(0,4200);render()}function render(){let p=[],c=[];for(let v of live){p.push(v.x,v.y,v.z);let q=.18+.42*v.c;c.push(.10*q,.55*q,.95*q)}if(window.obj){scene.remove(obj);obj.geometry.dispose();obj.material.dispose()}let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));let m=new THREE.PointsMaterial({size:.022,vertexColors:true,transparent:true,opacity:.72,depthWrite:true});window.obj=new THREE.Points(g,m);scene.add(obj);$('st').textContent=`Quest ${local.length} · iPhone ${remote.length} · depth ${live.length} · temporal map`;$('bu').disabled=live.length<30}async function spatial(){await boot();if(!await cameraStart())return;running=true;$('re').disabled=false;say(conn?.open?'DUAL TEMPORAL 3D ACTIVE':'LOCAL 3D ACTIVE · waiting for Quest');let last=0;const loop=t=>{if(!running)return;if(t-last<90){requestAnimationFrame(loop);return}last=t;local=features();send({type:'features',f:local});if(remote.length){let s=stereo(local,remote);lastMatches=s.m;integrate(s.p);if(s.p.length&&(!keyframes.length||t-keyframes[keyframes.length-1].t>260))keyframes.push({t,points:s.p.slice()})}else integrate(local.map(v=>({x:(v[0]-112)/90,y:(84-v[1])/90,z:2+(1-v[2]/1000),c:.15})));if(recording)frames.push({t,points:live.slice()});prev=local.slice();requestAnimationFrame(loop)};requestAnimationFrame(loop)}$('sc').onclick=spatial;function build(){if(live.length<30){say('Scan more of the room first');return}render();$('pl').disabled=false;say(`3D hologram ready · ${live.length} stable spatial samples`)}$('bu').onclick=build;function startRecord(){recording=!recording;$('re').textContent=recording?'Stop':'Record';if(recording){frames=[];say('Recording temporal 3D video')}else{say(`3D video ready · ${frames.length} temporal frames`)}}$('re').onclick=startRecord;$('pl').onclick=()=>{if(!renderer)return;let stream3=renderer.domElement.captureStream?.(30);if(!stream3||!window.MediaRecorder){say('3D video playback ready in view');return}let chunks=[];let r=new MediaRecorder(stream3);r.ondataavailable=e=>e.data.size&&chunks.push(e.data);r.onstop=()=>{videoURL=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));let a=document.createElement('a');a.href=videoURL;a.download='HyperStream-3D.webm';a.click()};r.start();setTimeout(()=>r.stop(),Math.max(3000,Math.min(15000,keyframes.length*300)))};$('cl').onclick=()=>{live=[];keyframes=[];frames=[];lastMatches=0;if(window.obj){scene.remove(obj);obj.geometry.dispose();obj.material.dispose();window.obj=null}$('bu').disabled=true;$('pl').disabled=true;say('3D space cleared')};function finish(){running=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}say('Quest disconnected · 3D representation preserved');$('pl').disabled=live.length<30} (async()=>{await startPeer();say(isHost?'iPhone ready · Show QR':'Quest ready · Scan QR')})();</script></body></html>
