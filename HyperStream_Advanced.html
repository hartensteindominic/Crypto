<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HyperStream Spatial</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020407;color:#eef;font:14px system-ui}#c{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:9px;border:1px solid #ffffff18;border-radius:17px;background:#090d14ed;backdrop-filter:blur(12px)}button{border:0;border-radius:10px;padding:9px 11px;margin:2px;background:#1976d2;color:#fff;font-weight:700}button:disabled{opacity:.35}.status{color:#b9e3ff}.small{color:#8e9aaa;font-size:12px}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000e;align-items:center;justify-content:center;padding:15px}.on{display:flex}.card{width:min(420px,100%);background:#151a21;border-radius:19px;padding:15px;text-align:center}.qr{width:250px;height:250px;background:#fff;margin:10px auto;padding:7px}.qr canvas{width:100%;height:100%}#qv{width:100%;border-radius:13px;max-height:60vh;object-fit:cover}.target{position:absolute;inset:17%;border:2px solid #4ba7ff;border-radius:16px}</style></head><body><canvas id=c></canvas><div class=ui><div class=status id=s>HyperStream ready</div><div><button id=q>Scan QR</button><button id=co>Show QR</button><button id=sc>Start Spatial</button><button id=re disabled>Record</button><button id=bu disabled>Build Hologram</button><button id=pl disabled>Play</button><button id=cl>Clear</button></div><div class=small id=st>Quest 0 · iPhone 0 · XYZ 0 · info depth 0%</div></div><div class=modal id=pm><div class=card><h2>Connect Quest</h2><div class=qr><canvas id=qc></canvas></div><div id=pair>Preparing…</div><p class=small>Scan this QR with Quest.</p><button id=x>Close</button></div></div><div class=modal id=qm><div class=card><h2>Scan QR</h2><div style="position:relative"><video id=qv autoplay playsinline muted></video><div class=target></div></div><p id=qs class=small>Center the QR.</p><button id=qx>Cancel</button></div></div><script>const $=id=>document.getElementById(id),isHost=!new URLSearchParams(location.search).has('host');let peer,conn,renderer,scene,camera,controls,stream,video,local=[],remote=[],live=new Map(),running=false,recording=false,keyframes=[],lastKey=0;const VOX=.09,MAX=7000,say=t=>$('s').textContent=t,load=u=>new Promise((ok,no)=>{let s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});async function startPeer(){if(peer)return;await load('https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js');peer=new Peer();peer.on('open',()=>say(isHost?'iPhone ready · Show QR':'Quest ready · Scan QR'));peer.on('error',()=>say('Connection error · retry QR'));peer.on('connection',attach)}function attach(c){conn=c;c.on('open',()=>{say('CONNECTED · shared spatial stream');send({t:'hello'});$('sc').disabled=false});c.on('data',d=>{if(d.t==='hello')say('CONNECTED · shared spatial stream');if(d.t==='frame')remote=d.f||[]});c.on('close',()=>{say('Quest disconnected · 3D representation preserved');running=false})}function send(d){if(conn?.open)try{conn.send(d)}catch(e){}}async function showQR(){await startPeer();await load('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js');let q=qrcode(0,'M');q.addData(location.href.split('?')[0]+'?host='+encodeURIComponent(peer.id));q.make();let c=$('qc'),x=c.getContext('2d'),n=q.getModuleCount(),z=Math.floor(720/(n+8));c.width=c.height=(n+8)*z;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';for(let y=0;y<n;y++)for(let X=0;X<n;X++)if(q.isDark(y,X))x.fillRect((X+4)*z,(y+4)*z,z,z);$('pair').textContent='PAIR '+peer.id.slice(-6).toUpperCase()}$('co').onclick=async()=>{$('pm').classList.add('on');try{await showQR()}catch(e){$('pair').textContent='QR unavailable'}};$('x').onclick=()=>$('pm').classList.remove('on');async function scanQR(){await load('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js');$('qm').classList.add('on');try{let v=$('qv'),st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});v.srcObject=st;await v.play();let cv=document.createElement('canvas'),x=cv.getContext('2d',{willReadFrequently:true});const loop=()=>{if(!$('qm').classList.contains('on')){st.getTracks().forEach(t=>t.stop());return}if(!v.videoWidth)return requestAnimationFrame(loop);cv.width=v.videoWidth;cv.height=v.videoHeight;x.drawImage(v,0,0);let d=x.getImageData(0,0,cv.width,cv.height),q=jsQR(d.data,cv.width,cv.height,{inversionAttempts:'attemptBoth'});if(q)try{let u=new URL(q.data),id=u.searchParams.get('host');if(id){st.getTracks().forEach(t=>t.stop());$('qm').classList.remove('on');startPeer().then(()=>attach(peer.connect(id,{reliable:true})));return}}catch(e){}requestAnimationFrame(loop)};loop()}catch(e){$('qs').textContent='Camera permission required'}}$('q').onclick=scanQR;$('qx').onclick=()=>$('qm').classList.remove('on');async function boot(){if(renderer)return;await load('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');await load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js');scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.01,100);camera.position.set(0,.8,4.5);renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.4));renderer.setSize(innerWidth,innerHeight);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=.045;scene.add(new THREE.GridHelper(12,24,0x142a40,0x080d14));renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}async function cameraStart(){if(stream)return true;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:960},height:{ideal:540}},audio:false});video=document.createElement('video');video.muted=true;video.playsInline=true;video.srcObject=stream;await video.play();return true}catch(e){say('Camera permission required');return false}}function features(){let w=224,h=168,cv=document.createElement('canvas');cv.width=w;cv.height=h;let x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(video,0,0,w,h);let d=x.getImageData(0,0,w,h).data,a=[];for(let y=6;y<h-6;y+=5)for(let X=6;X<w-6;X+=5){let i=(y*w+X)*4,g=.299*d[i]+.587*d[i+1]+.114*d[i+2],gx=Math.abs(d[i]-d[i-4])+Math.abs(d[i]-d[i+4])+Math.abs(d[i]-d[i-4*w])+Math.abs(d[i]-d[i+4*w]);if(gx<38)continue;let desc=[];for(let dy=-4;dy<=4;dy+=2)for(let dx=-4;dx<=4;dx+=2){let j=((y+dy)*w+X+dx)*4;desc.push((.299*d[j]+.587*d[j+1]+.114*d[j+2])-g)}a.push({x:X,y,score:gx,d:desc,r:d[i],g:d[i+1],b:d[i+2]})}return a.sort((a,b)=>b.score-a.score).slice(0,280)}function match(a,b){let out=[],used=new Set();for(let p of a){let best=-1,bd=1e9;for(let j=0;j<b.length;j++){if(used.has(j))continue;let q=b[j],dx=q.x-p.x,dy=q.y-p.y;if(Math.abs(dx)>135||Math.abs(dy)>90)continue;let e=dx*dx+dy*dy;for(let k=0;k<p.d.length;k++)e+=Math.abs(p.d[k]-q.d[k])*1.2;if(e<bd){bd=e;best=j}}if(best>=0&&bd<11500){used.add(best);out.push([p,b[best],bd])}}return out}function stereo(a,b){let m=match(a,b),out=[];for(let [p,q,e] of m){let disp=Math.abs(p.x-q.x);if(disp<2||disp>135)continue;let z=Math.max(.35,Math.min(10,100/disp)),x=((p.x+q.x)*.5-112)/88*z,y=(84-(p.y+q.y)*.5)/88*z,conf=Math.max(.1,Math.min(1,1-e/11500));out.push({x,y,z,conf,color:[p.r/255,p.g/255,p.b/255],obs:1,age:0,motion:0})}return{matches:m.length,points:out}}function info(v){let temporal=Math.min(1,v.obs/10),fresh=Math.max(0,1-v.age/35),stable=1-Math.min(.8,v.motion*1.5);return Math.max(.12,Math.min(1,.48*v.conf+.24*temporal+.18*fresh+.10*stable))}function fuse(points){for(let p of points){let k=`${Math.round(p.x/VOX)},${Math.round(p.y/VOX)},${Math.round(p.z/VOX)}`,v=live.get(k);if(v){let w=.14+.18*p.conf;v.x+=w*(p.x-v.x);v.y+=w*(p.y-v.y);v.z+=w*(p.z-v.z);v.conf=.72*v.conf+.28*p.conf;v.color=v.color.map((c,i)=>.8*c+.2*p.color[i]);v.obs=Math.min(255,v.obs+1);v.age=0;v.motion=Math.min(1,v.motion*.75+Math.hypot(p.x-v.x,p.y-v.y,p.z-v.z)*.25)}else live.set(k,{...p,obs:1})}for(let v of live.values()){v.age++;v.info=info(v)}if(live.size>MAX){let arr=[...live.values()].sort((a,b)=>b.info-a.info);let keep=arr.slice(0,MAX);live=new Map(keep.map(v=>[`${Math.round(v.x/VOX)},${Math.round(v.y/VOX)},${Math.round(v.z/VOX)}`,v]))}render()}function render(){let pos=[],col;col=[];for(let v of live.values()){let visibility=Math.max(.28,Math.min(1,v.info));pos.push(v.x,v.y,v.z);let depthBoost=Math.max(.7,Math.min(1.5,1/(.55+.08*v.z)));let q=(.35+.65*visibility)*depthBoost;col.push(Math.min(1,.10*q+.04),Math.min(1,.46*q+.08),Math.min(1,.92*q+.10))}if(window.obj){scene.remove(obj);obj.geometry.dispose();obj.material.dispose()}let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));let m=new THREE.PointsMaterial({size:.035,vertexColors:true,transparent:true,opacity:.9,depthWrite:true,sizeAttenuation:true});window.obj=new THREE.Points(g,m);scene.add(obj);let n=live.size,avg=n?[...live.values()].reduce((s,v)=>s+v.info,0)/n:0;$('st').textContent=`Quest ${local.length} · iPhone ${remote.length} · XYZ ${n} · info depth ${Math.round(avg*100)}%`;$('bu').disabled=n<20}async function spatial(){await boot();if(!await cameraStart())return;running=true;$('re').disabled=false;say(conn?.open?'DUAL XYZ + INFORMATION DEPTH LIVE':'LOCAL 3D LIVE · waiting for Quest');let last=0;const loop=t=>{if(!running)return;if(t-last<65){requestAnimationFrame(loop);return}last=t;local=features();send({t:'frame',f:local});if(remote.length){let s=stereo(local,remote);fuse(s.points)}else{let mono=local.map(p=>{let z=2.2+(1-p.score/650)*2.8;return{x:(p.x-112)/88*z,y:(84-p.y)/88*z,z,conf:.28,color:[p.r/255,p.g/255,p.b/255],obs:1,age:0,motion:0}});fuse(mono)}if(recording&&t-lastKey>180){keyframes.push({t,size:live.size});lastKey=t}requestAnimationFrame(loop)};requestAnimationFrame(loop)}$('sc').onclick=spatial;function build(){if(live.size<20){say('Move slowly and scan the room');return}render();$('pl').disabled=false;say(`3D hologram ready · ${live.size.toLocaleString()} visible spatial cells`)}$('bu').onclick=build;$('re').onclick=()=>{recording=!recording;$('re').textContent=recording?'Stop':'Record';if(recording){keyframes=[];lastKey=0;say('Recording spatial evolution')}else say(`${keyframes.length} spatial states captured`)};$('pl').onclick=()=>{if(!renderer){say('Start Spatial first');return}let s=renderer.domElement.captureStream?.(30);if(!s||!window.MediaRecorder){say('3D playback ready');return}let chunks=[],r=new MediaRecorder(s);r.ondataavailable=e=>e.data.size&&chunks.push(e.data);r.onstop=()=>{let u=URL.createObjectURL(new Blob(chunks,{type:'video/webm'})),a=document.createElement('a');a.href=u;a.download='HyperStream-3D.webm';a.click()};r.start();setTimeout(()=>r.stop(),6000);say('Building visible 3D video…')};$('cl').onclick=()=>{live.clear();keyframes=[];if(window.obj){scene.remove(obj);obj.geometry.dispose();obj.material.dispose();window.obj=null}$('bu').disabled=true;$('pl').disabled=true;say('Spatial information cleared')};(async()=>{await startPeer();say(isHost?'iPhone ready · Show QR':'Quest ready · Scan QR')})();</script></body></html>
