<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HyperStream 5D Spatial Hologram</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02050a;color:#eef7ff;font:14px system-ui,sans-serif}#view{position:fixed;inset:0;width:100%;height:100%;display:block}.ui{position:fixed;left:10px;right:10px;bottom:10px;z-index:5;padding:10px;border:1px solid #ffffff18;border-radius:18px;background:#080d14f2;backdrop-filter:blur(12px)}.row{display:flex;flex-wrap:wrap;gap:4px}button{border:0;border-radius:10px;padding:9px 11px;background:#176fc1;color:#fff;font-weight:700;cursor:pointer}button:active{transform:scale(.96)}button:disabled{opacity:.35}.status{color:#bce7ff}.small{color:#8d9bac;font-size:12px}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000d;align-items:center;justify-content:center;padding:15px}.modal.on{display:flex}.card{width:min(420px,100%);background:#151b23;border-radius:18px;padding:16px;text-align:center}.qr{width:250px;height:250px;background:white;margin:10px auto}</style></head><body><canvas id="view"></canvas><div class="ui"><div class="status" id="status">5D Spatial Hologram ready</div><div class="row"><button id="start">Start Spatial</button><button id="connect">Connect Quest</button><button id="scan">Scan QR</button><button id="flip">Flip Camera</button><button id="mode">Hologram</button><button id="lock" disabled>Lock Space</button><button id="clear">Clear</button></div><div class="small" id="stats">X 0 · Y 0 · Z 0 · T 0% · S 0% · Depth 0% · Solid 0%</div></div><div class="modal" id="qrModal"><div class="card"><b>Quest connection</b><div class="qr" id="qr"><div style="padding:78px 8px;color:#111;font-weight:700">PHONE 5D MODE<br><small>Start Spatial</small></div></div><div id="pair">Phone-only mode works without Quest.</div><button id="closeQR">Close</button></div></div><script>
'use strict';
const $=id=>document.getElementById(id),status=t=>$('status').textContent=t,canvas=$('view'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,D=devicePixelRatio||1,media=null,video=null,front=false,running=false,locked=false,mode=0,raf=0,lastTick=0,lastFeatures=[],cells=new Map(),remote=[];const CELL=.075,MAX=7000;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0);render()}addEventListener('resize',resize);
function clear(){ctx.fillStyle='#02050a';ctx.fillRect(0,0,W,H)}
function render(){clear();let a=[...cells.values()].filter(v=>v.keep);a.sort((x,y)=>y.z-x.z);let sx=Math.min(W,H)*.12;for(const v of a){let zc=1/(1+v.z*.14),x=W/2+v.x*sx*zc,y=H*.5-v.y*sx*zc,r=Math.max(1.2,4*zc*(.45+v.solid));let q=mode===0?v.solid:mode===1?v.conf:v.S;if(mode===0)ctx.fillStyle=`rgb(${10+25*q},${70+100*q},${155+95*q})`;else if(mode===1)ctx.fillStyle='#35bfff';else ctx.fillStyle=`rgb(${30+120*q},${45+90*(1-q)},${180+65*q})`;ctx.globalAlpha=.25+.7*q;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.strokeStyle='#12314b';ctx.strokeRect(W*.18,H*.13,W*.64,H*.66);let n=a.length,dep=n?a.reduce((s,v)=>s+v.conf,0)/n:0,sol=n?a.reduce((s,v)=>s+v.solid,0)/n:0,S=n?a.reduce((s,v)=>s+v.S,0)/n:0,T=n?a.reduce((s,v)=>s+v.T,0)/n:0;$('stats').textContent=`X ${cells.size} · Y ${a.length} · Z ${Math.round(dep*100)}% · T ${Math.round(T*100)}% · S ${Math.round(S*100)}% · Depth ${Math.round(dep*100)}% · Solid ${Math.round(sol*100)}%`;$('lock').disabled=locked||n<20}
function getFeatures(){if(!video||video.readyState<2)return[];const w=240,h=180,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(video,0,0,w,h);const d=x.getImageData(0,0,w,h).data,out=[];for(let y=6;y<h-6;y+=6)for(let px=6;px<w-6;px+=6){let i=(y*w+px)*4,l=.299*d[i]+.587*d[i+1]+.114*d[i+2],L=(xx,yy)=>{let j=(yy*w+xx)*4;return .299*d[j]+.587*d[j+1]+.114*d[j+2]},e=Math.abs(l-L(px-2,y))+Math.abs(l-L(px+2,y))+Math.abs(l-L(px,y-2))+Math.abs(l-L(px,y+2));if(e>24)out.push({x:px,y,edge:e,r:d[i]/255,g:d[i+1]/255,b:d[i+2]/255})}return out.sort((a,b)=>b.edge-a.edge).slice(0,450)}
function depth(fs){return fs.map(p=>{let z=1.2+4.6*(1-Math.min(1,p.edge/650));return{x:(p.x-120)/90*z,y:(90-p.y)/90*z,z,conf:.2+.55*Math.min(1,p.edge/500),r:p.r,g:p.g,b:p.b}})}
function motion(fs){if(!lastFeatures.length){lastFeatures=fs;return 0}let total=0,n=0;for(const p of fs.slice(0,80)){let best=99;for(const q of lastFeatures.slice(0,150))best=Math.min(best,Math.hypot(p.x-q.x,p.y-q.y));if(best<20){total+=best;n++}}lastFeatures=fs;return n?Math.min(1,total/n/25):0}
function fuse(ps,m){let now=performance.now();for(const p of ps){let k=Math.round(p.x/CELL)+','+Math.round(p.y/CELL)+','+Math.round(p.z/CELL),v=cells.get(k);if(!v)cells.set(k,{...p,hits:1,age:0,motion:m,solid:.2,S:p.conf,T:0,lastSeen:now,keep:true});else{let w=.13+.2*p.conf;v.x+=(p.x-v.x)*w;v.y+=(p.y-v.y)*w;v.z+=(p.z-v.z)*w;v.conf=.8*v.conf+.2*p.conf;v.r=.86*v.r+.14*p.r;v.g=.86*v.g+.14*p.g;v.b=.86*v.b+.14*p.b;v.hits=Math.min(255,v.hits+1);v.age=0;v.motion=.8*v.motion+.2*m;v.lastSeen=now;v.S=Math.min(1,v.S*.9+p.conf*.1)}}for(const v of cells.values()){v.age++;let obs=Math.min(1,v.hits/8),fresh=Math.max(0,1-v.age/45),stable=1-Math.min(.8,v.motion);v.solid=Math.min(1,.5*v.conf+.35*obs+.15*stable);v.S=Math.min(1,.45*v.conf+.25*obs+.2*fresh+.1*stable);v.T=Math.min(1,.65*obs+.35*(1-fresh));v.keep=v.solid>.2&&fresh>.03}if(cells.size>MAX){let good=[...cells.values()].filter(v=>v.keep).sort((a,b)=>(b.solid+b.S+b.T)-(a.solid+a.S+a.T)).slice(0,MAX);cells=new Map(good.map(v=>[Math.round(v.x/CELL)+','+Math.round(v.y/CELL)+','+Math.round(v.z/CELL),v]))}render()}
async function startCamera(){if(!navigator.mediaDevices?.getUserMedia){status('Camera API unavailable in this browser');return false}if(media)media.getTracks().forEach(t=>t.stop());try{media=await navigator.mediaDevices.getUserMedia({video:{facingMode:front?'user':'environment',width:{ideal:1280},height:{ideal:720}},audio:false});video=document.createElement('video');video.muted=true;video.playsInline=true;video.srcObject=media;await video.play();return true}catch(e){status('Camera blocked. Allow camera access and try again.');return false}}
async function startSpatial(){if(running){running=false;if(raf)cancelAnimationFrame(raf);$('start').textContent='Start Spatial';status('5D scan paused');return}status('Starting camera…');if(!await startCamera())return;running=true;$('start').textContent='Stop Spatial';status('5D SPATIAL LIVE · XYZ + T + S');loop()}
function loop(t){if(!running)return;if(t-lastTick>75){lastTick=t;let f=getFeatures();if(f.length){let m=motion(f),ps=depth(f);if(remote.length){let rp=depth(remote);for(let i=0;i<Math.min(ps.length,rp.length);i++){ps[i].z=ps[i].z*.75+rp[i].z*.25;ps[i].conf=Math.min(1,ps[i].conf+.12)}}fuse(ps,m);if(window.HS_CONN?.open)try{window.HS_CONN.send({t:'frame',f})}catch(e){}}}raf=requestAnimationFrame(loop)}
$('start').onclick=startSpatial;$('flip').onclick=async()=>{front=!front;status('Switching camera…');let ok=await startCamera();status(ok?'Camera '+(front?'FRONT · reverse 5D scan':'BACK · world 5D scan'):'Camera failed')};$('mode').onclick=()=>{mode=(mode+1)%3;$('mode').textContent=['Hologram','Depth','State 5D'][mode];render()};$('lock').onclick=()=>{locked=true;status('5D SPATIAL LOCKED · hologram preserved');render()};$('clear').onclick=()=>{cells.clear();lastFeatures=[];locked=false;render();status('5D spatial volume cleared')};$('connect').onclick=()=>{$('qrModal').classList.add('on');status('Quest optional · phone 5D engine remains active')};$('closeQR').onclick=()=>{$('qrModal').classList.remove('on')};$('scan').onclick=()=>status('QR layer is optional. Start Spatial to build the phone hologram.');window.addEventListener('error',e=>status('Runtime error contained: '+(e.message||'unknown')));window.addEventListener('unhandledrejection',()=>status('Operation failed safely · try again'));render();status('5D Spatial Hologram ready · all controls active');
</script></body></html>
