<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HyperStream World</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02050a;color:#eef7ff;font:14px system-ui}#v{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:10px;border:1px solid #ffffff22;border-radius:18px;background:#080d14ed;backdrop-filter:blur(12px)}button{border:0;border-radius:10px;padding:9px 11px;margin:2px;background:#176fc1;color:#fff;font-weight:700;cursor:pointer}.st{color:#bde9ff}.sm{font-size:12px;color:#91a4b8}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000e;align-items:center;justify-content:center}.on{display:flex}.card{width:min(440px,94%);padding:16px;background:#151b23;border-radius:18px;text-align:center}.card video{width:100%;border-radius:12px}.qr{width:280px;height:280px;background:#fff;margin:10px auto}.meter{height:3px;background:#102033}.meter i{display:block;height:100%;width:0;background:#42b6ff}</style></head><body><canvas id=v></canvas><div class=ui><div id=s class=st>HyperStream World ready</div><div><button id=map>Map World</button><button id=connect>Connect Quest</button><button id=scan>Scan QR</button><button id=phone>Phone Enrich</button><button id=enter>Enter World</button><button id=save>Save World</button><button id=clear>Clear</button></div><div id=stats class=sm>World 0 · Surfaces 0 · Images 0 · XYZ 0 · 5D 0% · Local</div><div class=meter><i id=m></i></div></div><div id=qm class=modal><div class=card><b id=qtit>Quest Pairing</b><canvas id=qr class=qr></canvas><div id=qt class=sm>Preparing…</div><button id=qclose>Close</button></div></div><div id=smx class=modal><div class=card><b>Scan HyperStream QR</b><video id=sv autoplay playsinline muted></video><div id=msg class=sm>Starting scanner…</div><button id=sclose>Close</button></div></div><script>(()=>{'use strict';const $=i=>document.getElementById(i),cv=$('v'),g=cv.getContext('2d'),cap=document.createElement('canvas'),cg=cap.getContext('2d',{willReadFrequently:true});let W,H,D,video,stream,running=0,phone=0,raf,last=0,cells=new Map(),prev=[],pc=null,channel=null,scanStream=null,worldName='My World';const C=.18,MAX=2200,KEY='hyperstream-world-v7';function st(t){$('s').textContent=t}function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0);draw()}addEventListener('resize',size);size();function draw(){g.fillStyle='#02050a';g.fillRect(0,0,W,H);let a=[...cells.values()].filter(o=>o.keep).sort((a,b)=>b.z-a.z);for(const o of a){let k=Math.min(W,H)*.13/(.7+o.z*.11),px=W/2+o.x*k,py=H/2-o.y*k,sz=Math.max(7,Math.min(55,k*C*(.7+o.conf)));g.globalAlpha=Math.min(.95,.25+.7*o.conf);if(o.img){g.drawImage(o.img,px-sz/2,py-sz/2,sz,sz)}else{g.fillStyle=o.surface?'#5ecbff':'#376b91';g.fillRect(px-sz/2,py-sz/2,sz,sz)}}g.globalAlpha=1;g.strokeStyle='#173a55';g.strokeRect(W*.12,H*.07,W*.76,H*.78);let n=a.length,img=a.filter(o=>o.img).length,dep=n?a.reduce((s,o)=>s+o.depth,0)/n:0,f=n?a.reduce((s,o)=>s+o.time,0)/n:0,sp=n?a.reduce((s,o)=>s+o.space,0)/n:0;$('stats').textContent=`World ${cells.size} · Surfaces ${n} · Images ${img} · XYZ ${n} · 5D ${((f+sp)/2*100)|0}% · ${navigator.connection?.effectiveType||'Local'}`;$('m').style.width=Math.min(100,n/22)+'%'}function features(){if(!video||video.readyState<2)return[];let w=320,h=240;cap.width=w;cap.height=h;cg.drawImage(video,0,0,w,h);let p=cg.getImageData(0,0,w,h).data,a=[];for(let y=8;y<h-8;y+=9)for(let X=8;X<w-8;X+=9){let i=(y*w+X)*4,L=.299*p[i]+.587*p[i+1]+.114*p[i+2],e=Math.abs(L-(.299*p[i-4]+.587*p[i-3]+.114*p[i-2]))+Math.abs(L-(.299*p[i+4]+.587*p[i+5]+.114*p[i+6]))+Math.abs(L-(.299*p[i-4*w]+.587*p[i-4*w+1]+.114*p[i-4*w+2]))+Math.abs(L-(.299*p[i+4*w]+.587*p[i+4*w+1]+.114*p[i+4*w+2]));if(e>25)a.push({x:X,y,e})}return a.sort((a,b)=>b.e-a.e).slice(0,150)}function patch(p){let q=document.createElement('canvas');q.width=q.height=42;let z=q.getContext('2d');z.drawImage(cap,Math.max(0,p.x-21),Math.max(0,p.y-21),42,42,0,0,42,42);return q}function fuse(a,remote=0){for(const p of a){let z=Math.max(.5,Math.min(7,1+(1-Math.min(1,p.e/420))*5)),xx=(p.x-160)/100*z,yy=(120-p.y)/100*z,k=`${Math.round(xx/C)},${Math.round(yy/C)},${Math.round(z/C)}`,o=cells.get(k);if(!o){o={x:xx,y:yy,z,depth:Math.min(1,p.e/240),conf:.25,time:.25,space:remote?.9:.4,hits:1,age:0,img:patch(p),surface:remote,keep:1};cells.set(k,o)}else{o.x+=.1*(xx-o.x);o.y+=.1*(yy-o.y);o.z+=.1*(z-o.z);o.depth=.85*o.depth+.15*Math.min(1,p.e/240);o.hits=Math.min(100,o.hits+1);o.age=0;o.img=patch(p);if(remote)o.space=Math.min(1,o.space+.1)}}for(const o of cells.values()){o.age++;let fresh=Math.max(0,1-o.age/30),obs=Math.min(1,o.hits/6);o.conf=Math.min(1,.25*o.depth+.55*obs+.2*fresh);o.time=.65*o.time+.35*fresh;o.space=Math.min(1,.72*o.space+.28*obs);o.keep=o.conf>.25&&fresh>.03}if(cells.size>MAX)cells=new Map([...cells].filter(e=>e[1].keep).sort((a,b)=>(b[1].conf+b[1].space)-(a[1].conf+a[1].space)).slice(0,MAX));draw()}async function camera(){stream?.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});video=document.createElement('video');video.srcObject=stream;video.muted=true;video.playsInline=true;await video.play();return 1}catch(e){st('Phone camera unavailable. The Quest mapper can still be the primary world scanner.');return 0}}async function mapWorld(){if(running){running=0;cancelAnimationFrame(raf);$('map').textContent='Map World';st('Quest/world mapping paused · world retained');return}running=1;$('map').textContent='Stop Mapping';st('WORLD MAP · Quest should provide primary spatial tracking');if(!channel?.readyState||channel.readyState!=='open')st('WORLD MAP · connect Quest for primary spatial mapping');if(phone&&await camera())st('PHONE ENRICHMENT + WORLD MAP · imagery merged into world');loop()}async function phoneEnrich(){phone=!phone;if(phone){if(await camera()){st('PHONE ENRICH · adding images to saved world');if(!running)mapWorld()}}else{stream?.getTracks().forEach(t=>t.stop());st('Phone enrichment off · Quest remains primary')} }function loop(t=0){if(!running)return;if(t-last>80){last=t;if(phone){let a=features();if(a.length){fuse(a,0);prev=a;if(channel?.readyState==='open')try{channel.send(JSON.stringify({v:7,type:'phone-enrich',items:a.slice(0,100),time:Date.now()}))}catch(_){}}}}raf=requestAnimationFrame(loop)}function save(){let data={v:7,name:worldName,created:new Date().toISOString(),dimensions:'X Y Z T S',surfaces:[...cells.values()].map(o=>({x:o.x,y:o.y,z:o.z,depth:o.depth,conf:o.conf,time:o.time,space:o.space}))};localStorage.setItem(KEY,JSON.stringify(data));st(`WORLD SAVED · ${data.surfaces.length} spatial surfaces`)}function loadWorld(){let raw=localStorage.getItem(KEY);if(!raw)return st('No saved world yet');try{let d=JSON.parse(raw);cells.clear();for(const o of d.surfaces||[])cells.set(`${Math.round(o.x/C)},${Math.round(o.y/C)},${Math.round(o.z/C)}`,{...o,hits:5,age:0,img:null,surface:1,keep:1});draw();st(`WORLD LOADED · ${d.name||'Saved World'}`)}catch(e){st('Saved world could not be loaded')}}$('map').onclick=mapWorld;$('phone').onclick=phoneEnrich;$('save').onclick=save;$('enter').onclick=loadWorld;$('clear').onclick=()=>{cells.clear();draw();st('World cleared')};function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}function dec(s){try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch(_){return null}}async function qr(payload,title){$('qm').classList.add('on');$('qtit').textContent=title;let c=$('qr'),z=c.getContext('2d');c.width=c.height=560;z.fillStyle='#fff';z.fillRect(0,0,560,560);let ok=0;for(const u of ['https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js','https://unpkg.com/qrcode-generator@1.4.4/qrcode.js'])try{await new Promise((a,b)=>{let s=document.createElement('script');s.src=u;s.onload=a;s.onerror=b;document.head.appendChild(s)});if(window.qrcode){ok=1;break}}catch(_){}if(!ok)return $('qt').textContent='QR encoder unavailable. Use HTTPS and retry.';try{let q=qrcode(0,'H');q.addData(enc(payload));q.make();let n=q.getModuleCount(),k=Math.floor(500/n);z.fillStyle='#000';for(let y=0;y<n;y++)for(let X=0;X<n;X++)if(q.isDark(y,X))z.fillRect(30+X*k,30+y*k,k,k);$('qt').textContent='REAL QR · '+title}catch(e){$('qt').textContent='QR error: '+e.message}}function bind(c){channel=c;c.onopen=()=>st('QUEST CONNECTED · Quest-first 5D world active');c.onclose=()=>st('Quest disconnected · saved/local world retained');c.onmessage=e=>{try{let d=JSON.parse(e.data);if(d.items)fuse(d.items,1)}catch(_){}}}async function connect(){if(!window.RTCPeerConnection)return st('WebRTC unavailable');try{pc=new RTCPeerConnection();bind(pc.createDataChannel('hyperstream'));let o=await pc.createOffer();await pc.setLocalDescription(o);await new Promise(r=>setTimeout(r,800));await qr({v:7,k:'offer',s:pc.localDescription},'SCAN ON QUEST')}catch(e){st('Quest offer failed: '+e.message)}}$('connect').onclick=connect;async function handle(raw){let d=dec(raw);if(!d)return $('msg').textContent='Not a HyperStream QR.';if(d.k==='offer'){pc=new RTCPeerConnection();pc.ondatachannel=e=>bind(e.channel);await pc.setRemoteDescription(d.s);let a=await pc.createAnswer();await pc.setLocalDescription(a);await new Promise(r=>setTimeout(r,500));$('msg').textContent='Offer accepted. Answer QR created.';await qr({v:7,k:'answer',s:pc.localDescription},'RETURN ANSWER TO PHONE')}else if(d.k==='answer'&&pc){await pc.setRemoteDescription(d.s);$('msg').textContent='Answer accepted · connecting…'}else $('msg').textContent='Wrong QR stage.'} $('scan').onclick=async()=>{$('smx').classList.add('on');try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});$('sv').srcObject=scanStream;await $('sv').play();if(!('BarcodeDetector'in window)){ $('msg').textContent='QR scanning is not supported by this browser.';return}let bd=new BarcodeDetector({formats:['qr_code']});(async function loop(){if(!$('smx').classList.contains('on'))return;try{let a=await bd.detect($('sv'));if(a.length)return handle(a[0].rawValue)}catch(_){}$('msg').textContent='Scanning…';setTimeout(loop,180)})()}catch(e){$('msg').textContent='Scanner error: '+e.message}};$('qclose').onclick=()=>$('qm').classList.remove('on');$('sclose').onclick=()=>{$('smx').classList.remove('on');scanStream?.getTracks().forEach(t=>t.stop())};addEventListener('error',e=>st('Runtime error: '+e.message));addEventListener('unhandledrejection',e=>st('Runtime error: '+(e.reason?.message||e.reason)));draw();st('Ready · Quest-first saved 5D world')})();</script></body></html>
