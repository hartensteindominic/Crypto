<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HyperStream Spatial Hologram</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a;color:#eef;font:14px system-ui}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:10px;border:1px solid #ffffff22;border-radius:18px;background:#080d14ee;backdrop-filter:blur(12px)}.row{display:flex;flex-wrap:wrap;gap:4px}button{border:0;border-radius:10px;padding:9px 11px;background:#176fc1;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.35}.status{color:#bce7ff}.small{color:#92a1b2;font-size:12px}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000e;align-items:center;justify-content:center;padding:15px}.modal.on{display:flex}.card{width:min(430px,100%);background:#151b23;border-radius:18px;padding:16px;text-align:center}.card video{width:100%;max-height:60vh;border-radius:12px}</style></head><body><canvas id="c"></canvas><div class="ui"><div class="status" id="status">HyperStream ready</div><div class="row"><button id="start">Start Spatial</button><button id="show">Connect Quest</button><button id="scan">Scan QR</button><button id="flip">Flip Camera</button><button id="mode">Hologram</button><button id="lock" disabled>Lock Space</button><button id="clear">Clear</button></div><div class="small" id="stats">XYZ 0 · Depth 0% · Solid 0% · Coverage 0% · 5D</div></div><div class="modal" id="scanner"><div class="card"><b>Quest QR Scanner</b><video id="sv" autoplay playsinline muted></video><p id="scanstatus" class="small">Starting camera…</p><button id="closeScan">Close</button></div></div><script>
(()=>{const $=id=>document.getElementById(id);const canvas=$('c'),ctx=canvas.getContext('2d');let W=0,H=0,D=1;let video=null,media=null,running=false,front=false,mode=0,locked=false,raf=0,last=0;let cells=new Map(),sampleCanvas=document.createElement('canvas'),sampleCtx=sampleCanvas.getContext('2d',{willReadFrequently:true});const CELL=.09,MAX=8000;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);draw()}addEventListener('resize',resize);resize();function status(t){$('status').textContent=t}
function draw(){ctx.fillStyle='#02050a';ctx.fillRect(0,0,W,H);let a=[...cells.values()].filter(v=>v.keep);a.sort((x,y)=>y.z-x.z);for(const v of a){let zz=1/(.7+v.z*.09),x=W/2+v.x*Math.min(W,H)*.105*zz,y=H/2-v.y*Math.min(W,H)*.105*zz,r=Math.max(.8,3.8*zz*(.45+v.solid));ctx.globalAlpha=.15+.8*v.solid;if(mode===0)ctx.fillStyle=`rgb(${10+25*v.state},${75+90*v.state},${145+105*v.state})`;else if(mode===1)ctx.fillStyle=`rgb(${20+80*v.depth},${110+100*v.depth},255)`;else ctx.fillStyle='#d8ecff';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.strokeStyle='#12324c';ctx.strokeRect(W*.17,H*.11,W*.66,H*.7);let n=a.length,d=n?(a.reduce((s,v)=>s+v.depth,0)/n):0,s=n?(a.reduce((s,v)=>s+v.solid,0)/n):0,t=n?(a.reduce((s,v)=>s+v.state,0)/n):0;$('stats').textContent=`XYZ ${cells.size} · Depth ${Math.round(d*100)}% · Solid ${Math.round(s*100)}% · Coverage ${Math.min(100,Math.round(n/80))}% · 5D ${Math.round(t*100)}%`;$('lock').disabled=n<12}
function getFeatures(){if(!video||video.readyState<2)return[];const w=320,h=240;sampleCanvas.width=w;sampleCanvas.height=h;sampleCtx.drawImage(video,0,0,w,h);const d=sampleCtx.getImageData(0,0,w,h).data,out=[];for(let y=6;y<h-6;y+=6){for(let x=6;x<w-6;x+=6){const i=(y*w+x)*4;const lum=.299*d[i]+.587*d[i+1]+.114*d[i+2];const l1=.299*d[i-4]+.587*d[i-3]+.114*d[i-2],r1=.299*d[i+4]+.587*d[i+5]+.114*d[i+6],u=.299*d[i-4*w]+.587*d[i-4*w+1]+.114*d[i-4*w+2],dn=.299*d[i+4*w]+.587*d[i+4*w+1]+.114*d[i+4*w+2];const edge=Math.abs(lum-l1)+Math.abs(lum-r1)+Math.abs(lum-u)+Math.abs(lum-dn);if(edge>22)out.push({x,y,e:edge,r:d[i]/255,g:d[i+1]/255,b:d[i+2]/255})}}return out.sort((a,b)=>b.e-a.e).slice(0,600)}
function integrate(fs){for(const p of fs){const depth=Math.max(.4,Math.min(7,1.2+(1-Math.min(1,p.e/500))*5));const x=(p.x-160)/100*depth,y=(120-p.y)/100*depth;const k=`${Math.round(x/CELL)},${Math.round(y/CELL)},${Math.round(depth/CELL)}`;let v=cells.get(k);if(!v){cells.set(k,{x,y,z:depth,depth:Math.min(1,p.e/300),solid:.22,state:.2,hits:1,age:0,r:p.r,g:p.g,b:p.b,keep:true})}else{v.x+=.16*(x-v.x);v.y+=.16*(y-v.y);v.z+=.16*(depth-v.z);v.depth=.82*v.depth+.18*Math.min(1,p.e/300);v.r=.88*v.r+.12*p.r;v.g=.88*v.g+.12*p.g;v.b=.88*v.b+.12*p.b;v.hits=Math.min(255,v.hits+1);v.age=0}}for(const v of cells.values()){v.age++;v.solid=Math.min(1,.25*v.depth+.75*Math.min(1,v.hits/5));v.state=Math.max(0,Math.min(1,.5*v.solid+.35*Math.min(1,v.hits/8)+.15*Math.max(0,1-v.age/40)));v.keep=v.solid>.18&&v.age<40}if(cells.size>MAX){cells=new Map([...cells.entries()].filter(e=>e[1].keep).sort((a,b)=>b[1].state-a[1].state).slice(0,MAX))}draw()}
async function camera(){if(media)media.getTracks().forEach(t=>t.stop());try{media=await navigator.mediaDevices.getUserMedia({video:{facingMode:front?'user':{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video=document.createElement('video');video.muted=true;video.playsInline=true;video.srcObject=media;await video.play();return true}catch(e){status('Camera blocked. Allow camera permission and retry.');return false}}
async function start(){if(running){running=false;if(raf)cancelAnimationFrame(raf);$('start').textContent='Start Spatial';status('Spatial paused');return}status('Starting camera…');if(!(await camera()))return;running=true;$('start').textContent='Stop Spatial';status('PHONE SPATIAL SCAN · move slowly around the room');tick()}
function tick(t=0){if(!running)return;if(t-last>70){last=t;const f=getFeatures();if(f.length)integrate(f)}raf=requestAnimationFrame(tick)}
$('start').onclick=start;$('flip').onclick=async()=>{front=!front;status('Switching camera…');if(await camera())status(`Camera ${front?'front':'back'} · ${running?'continuing spatial scan':'ready'}`)};$('mode').onclick=()=>{mode=(mode+1)%3;$('mode').textContent=['Hologram','Depth','Structure'][mode];draw()};$('lock').onclick=()=>{locked=true;running=false;if(raf)cancelAnimationFrame(raf);$('start').textContent='Start Spatial';status('SPATIAL LOCKED · hologram preserved')};$('clear').onclick=()=>{cells.clear();locked=false;draw();status('Spatial volume cleared')};$('show').onclick=()=>status('Quest connection is optional · phone scanner remains active');
$('scan').onclick=async()=>{$('scanner').classList.add('on');$('scanstatus').textContent='Opening camera…';try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});$('sv').srcObject=s;await $('sv').play();$('scanstatus').textContent='Camera active. QR decoding requires a QR library; spatial scanning does not.'}catch(e){$('scanstatus').textContent='Camera permission required.'}};$('closeScan').onclick=()=>{$('scanner').classList.remove('on');const s=$('sv').srcObject;if(s)s.getTracks().forEach(t=>t.stop())};
window.addEventListener('error',e=>status('Runtime error: '+(e.message||'unknown')));window.addEventListener('unhandledrejection',e=>status('Runtime error: '+(e.reason?.message||e.reason||'unknown')));draw();status('Ready · Start Spatial');})();
</script></body></html>
