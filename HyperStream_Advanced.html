<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HyperStream Spatial</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020307;color:#fff;font:14px system-ui}#c{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:10px;border:1px solid #fff2;border-radius:18px;background:#10131dcc;backdrop-filter:blur(14px)}button{border:0;border-radius:11px;padding:10px;margin:3px;background:#1677ff;color:#fff;font-weight:700}button:disabled{opacity:.35}.status{color:#9bd4ff}.small{color:#aaa;font-size:12px}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000d;align-items:center;justify-content:center;padding:15px}.on{display:flex}.card{width:min(430px,100%);background:#181a20;border-radius:20px;padding:16px;text-align:center}.qr{width:250px;height:250px;background:#fff;margin:12px auto;padding:8px}.qr canvas{width:100%;height:100%}#qv{width:100%;max-height:60vh;object-fit:cover;border-radius:14px}.target{position:absolute;inset:18%;border:3px solid #48a0ff;border-radius:18px}</style></head><body><canvas id=c></canvas><div class=ui><div class=status id=s>HyperStream ready</div><div><button id=q>Scan QR</button><button id=co>Show QR</button><button id=sc>Start Spatial</button><button id=re disabled>Record</button><button id=bu disabled>Build Hologram</button><button id=pl disabled>Play</button><button id=cl>Clear</button></div><div class=small id=st>Quest 0 · iPhone 0 · fused 0 · live spatial map ready</div></div><div class=modal id=pm><div class=card><h2>Connect Quest</h2><div class=qr><canvas id=qc></canvas></div><p class=small id=ps>Scan this with Quest.</p><button id=x>Close</button></div></div><div class=modal id=qm><div class=card><h2>Scan QR</h2><div style="position:relative"><video id=qv autoplay playsinline muted></video><div class=target></div></div><p class=small id=qs>Center the iPhone QR.</p><button id=qx>Cancel</button></div></div><script>const $=x=>document.getElementById(x);let S,C,R,T,P,peer,conn,id,stream,frames=[],recording=false,rec,chunks=[],world,ready=false,livePts=[],remotePts=[],fusedPts=[];const MAX=110000,host=!new URLSearchParams(location.search).get('host');const say=x=>$('s').textContent=x;function load(u){return new Promise((a,b)=>{let s=document.createElement('script');s.src=u;s.onload=a;s.onerror=b;document.head.appendChild(s)})}async function engine(){if(ready)return;await load('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');await load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js');S=new THREE.Scene();C=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.03,200);C.position.set(0,1.2,6);R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(devicePixelRatio||1,1.5));R.setSize(innerWidth,innerHeight);T=new THREE.OrbitControls(C,R.domElement);T.enableDamping=true;T.autoRotate=true;T.autoRotateSpeed=.35;S.add(new THREE.GridHelper(12,24,0x204060,0x111318));ready=true;R.setAnimationLoop(()=>{T.update();R.render(S,C)});addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)})}function pts(p,c,size,op){let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));let m=new THREE.PointsMaterial({size,vertexColors:true,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false});let o=new THREE.Points(g,m);S.add(o);return o}function drawLive(){if(window.a)S.remove(window.a);if(window.b)S.remove(window.b);if(window.f)S.remove(window.f);window.a=pts(livePts.p,livePts.c,.035,.72);window.b=pts(remotePts.p,remotePts.c,.035,.72);let p=[],c=[];let n=Math.min(livePts.p.length,remotePts.p.length);for(let i=0;i<n&&p.length<MAX*3;i+=3){p.push((livePts.p[i]+remotePts.p[i]+.0)/2,(livePts.p[i+1]+remotePts.p[i+1])/2,(livePts.p[i+2]+remotePts.p[i+2])/2);c.push((livePts.c[i]+remotePts.c[i])*.5,(livePts.c[i+1]+remotePts.c[i+1])*.5,(livePts.c[i+2]+remotePts.c[i+2])*.5)}fusedPts={p,c};if(p.length)window.f=pts(p,c,.052,.92);$('st').textContent=`Quest ${livePts.p.length/3|0} · iPhone ${remotePts.p.length/3|0} · fused ${p.length/3|0} · LIVE SPATIAL MAP` }async function cam(v){let z=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:360}},audio:false});v.srcObject=z;await v.play();return z}function sample(v){let w=180,h=Math.max(100,Math.round((v.videoHeight/v.videoWidth)*w)),q=document.createElement('canvas');q.width=w;q.height=h;let x=q.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,w,h);let d=x.getImageData(0,0,w,h).data,p=[],c=[];for(let y=2;y<h-2;y+=4)for(let X=2;X<w-2;X+=4){let i=(y*w+X)*4,r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,l=.299*r+.587*g+.114*b;if(l<.03||l>.97)continue;let z=(1-l)*4.2-2.1;p.push((X/w-.5)*3.5,(.5-y/h)*2.6,z);c.push(r,g,b)}return{p,c}}function send(o){if(conn?.open)conn.send(o)}async function spatial(){await engine();if(stream)return;let v=document.createElement('video');try{stream=await cam(v)}catch(e){say('Camera permission required');return}say('Dual spatial mapping active');$('re').disabled=false;let last=0;function loop(t){if(!stream)return;if(t-last<90){requestAnimationFrame(loop);return}last=t;let z=sample(v);livePts=z;send({t:'spatial',p:z.p,c:z.c,n:z.p.length/3});if(recording)frames.push({p:z.p,c:z.c,src:host?'iphone':'quest'});drawLive();requestAnimationFrame(loop)}requestAnimationFrame(loop)}function receive(d){if(d.t!=='spatial')return;remotePts={p:d.p||[],c:d.c||[]};if(recording)frames.push({p:d.p,c:d.c,src:host?'quest':'iphone'});drawLive()}async function qrgen(u){if(!window.qrcode)await load('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js');let q=qrcode(0,'M');q.addData(u);q.make();let c=$('qc'),x=c.getContext('2d'),n=q.getModuleCount(),sc=Math.floor(700/(n+8));c.width=c.height=(n+8)*sc;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';for(let y=0;y<n;y++)for(let z=0;z<n;z++)if(q.isDark(y,z))x.fillRect((z+4)*sc,(y+4)*sc,sc,sc)}async function hostInit(){await engine();peer=new Peer();peer.on('open',async x=>{id=x;await qrgen(location.href.split('?')[0]+'?host='+encodeURIComponent(id));say('iPhone ready · Show QR');});peer.on('connection',c=>{conn=c;c.on('open',()=>{send({t:'hello'});say('CONNECTED · dual spatial link');spatial()});c.on('data',receive);c.on('close',()=>say('Quest disconnected'))})}function connect(h){say('Connecting…');peer=new Peer();peer.on('open',()=>{conn=peer.connect(h,{reliable:true});conn.on('open',()=>{send({t:'hello'});say('CONNECTED · dual spatial link');spatial()});conn.on('data',d=>{if(d.t==='hello')say('CONNECTED · dual spatial link');receive(d)});conn.on('close',()=>say('Connection closed'))});peer.on('error',()=>say('Connection failed · scan again'))}async function scan(){await engine();$('qm').classList.add('on');if(!window.jsQR)await load('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js');let v=$('qv'),z=await cam(v),c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});async function loop(){if(!$('qm').classList.contains('on'))return;c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);let n=Math.min(c.width,c.height),sx=(c.width-n)/2,sy=(c.height-n)/2,d=x.getImageData(sx,sy,n,n),q=jsQR(d.data,n,n,{inversionAttempts:'attemptBoth'});if(q)try{let u=new URL(q.data),h=u.searchParams.get('host');if(h){z.getTracks().forEach(t=>t.stop());$('qm').classList.remove('on');connect(h);return}}catch(e){}requestAnimationFrame(loop)}loop()}function build(){if(!frames.length){say('Record a session first');return}if(world)S.remove(world);let p=[],c=[],step=Math.max(1,Math.floor(frames.length/100));for(let i=0;i<frames.length;i+=step){let a=frames[i],off=a.src==='iphone'?.65:-.65;for(let j=0;j<a.p.length&&p.length<MAX*3;j+=3){p.push(a.p[j]+off,a.p[j+1],a.p[j+2]+(i/frames.length-.5));c.push(a.c[j],a.c[j+1],a.c[j+2])}}world=pts(p,c,.055,.94);say(`Hologram built · ${p.length/3|0} spatial nodes`);$('pl').disabled=false}function clear(){frames=[];if(world)S.remove(world);world=null;livePts=remotePts=fusedPts=[];if(window.a)S.remove(window.a);if(window.b)S.remove(window.b);if(window.f)S.remove(window.f);say('Spatial map cleared')}$('q').onclick=scan;$('co').onclick=()=>$('pm').classList.add('on');$('x').onclick=()=>$('pm').classList.remove('on');$('qx').onclick=()=>$('qm').classList.remove('on');$('sc').onclick=spatial;$('bu').onclick=build;$('cl').onclick=clear;$('re').onclick=()=>{recording=!recording;$('re').textContent=recording?'Stop':'Record';if(recording){frames=[];if(R?.domElement.captureStream&&MediaRecorder){rec=new MediaRecorder(R.domElement.captureStream(30));chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{$('pl').dataset.u=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));$('pl').disabled=false};rec.start()}say('Recording live dual spatial map')}else{rec?.stop();$('bu').disabled=!frames.length;say(`${frames.length} spatial frames captured`)}};$('pl').onclick=()=>{if($('pl').dataset.u)open($('pl').dataset.u)};(async()=>{if(host)await hostInit();else{await engine();say('Quest ready · Scan QR')}})();</script></body></html>
