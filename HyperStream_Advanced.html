<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HyperStream Spatial</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020407;color:#eef;font:14px system-ui}#c{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:9px;border:1px solid #ffffff18;border-radius:17px;background:#090d14ed;backdrop-filter:blur(12px)}button{border:0;border-radius:10px;padding:9px 11px;margin:2px;background:#1976d2;color:#fff;font-weight:700}button:disabled{opacity:.35}.status{color:#b9e3ff}.small{color:#8e9aaa;font-size:12px}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000e;align-items:center;justify-content:center;padding:15px}.on{display:flex}.card{width:min(420px,100%);background:#151a21;border-radius:19px;padding:15px;text-align:center}.qr{width:250px;height:250px;background:#fff;margin:10px auto;padding:7px}.qr canvas{width:100%;height:100%}#qv{width:100%;border-radius:13px;max-height:60vh;object-fit:cover}.target{position:absolute;inset:17%;border:2px solid #4ba7ff;border-radius:16px}</style></head><body><canvas id=c></canvas><div class=ui><div class=status id=s>HyperStream ready</div><div><button id=q>Scan QR</button><button id=co>Show QR</button><button id=sc>Start Spatial</button><button id=re disabled>Record</button><button id=bu disabled>Build Hologram</button><button id=pl disabled>Play</button><button id=cl>Clear</button></div><div class=small id=st>Quest 0 · iPhone 0 · matches 0 · space 0</div></div><div class=modal id=pm><div class=card><h2>Connect Quest</h2><div class=qr><canvas id=qc></canvas></div><div id=pair>Preparing…</div><p class=small>Scan this QR with Quest.</p><button id=x>Close</button></div></div><div class=modal id=qm><div class=card><h2>Scan QR</h2><div style="position:relative"><video id=qv autoplay playsinline muted></video><div class=target></div></div><p id=qs class=small>Center the QR.</p><button id=qx>Cancel</button></div></div><script>const $=id=>document.getElementById(id),isHost=!new URLSearchParams(location.search).has('host');let peer,conn,renderer,scene,camera,controls,stream,video,local=[],remote=[],prevLocal=[],prevRemote=[],map=new Map(),mapGroup,recording=false,frames=[],recorded=[];const VOX=.045,MAX=70000,BASE=.32,F=.9;const say=t=>$('s').textContent=t;const load=u=>new Promise((ok,no)=>{let s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});async function startPeer(){if(peer)return;await load('https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js');peer=new Peer();peer.on('open',()=>say(isHost?'iPhone ready · Show QR':'Quest ready · Scan QR'));peer.on('error',()=>say('Connection error · retry QR'));peer.on('connection',attach)}function attach(c){conn=c;c.on('open',()=>{say('CONNECTED · visual stereo link');send({type:'hello'});$('sc').disabled=false});c.on('data',d=>{if(d.type==='hello')say('CONNECTED · visual stereo link');if(d.type==='features')remote=d.f||[]});c.on('close',()=>say('Device disconnected'))}function send(d){if(conn?.open)try{conn.send(d)}catch(e){}}async function showQR(){await startPeer();await load('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js');let q=qrcode(0,'M');q.addData(location.href.split('?')[0]+'?host='+encodeURIComponent(peer.id));q.make();let c=$('qc'),x=c.getContext('2d'),n=q.getModuleCount(),z=Math.floor(720/(n+8));c.width=c.height=(n+8)*z;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';for(let y=0;y<n;y++)for(let X=0;X<n;X++)if(q.isDark(y,X))x.fillRect((X+4)*z,(y+4)*z,z,z);$('pair').textContent='PAIR '+peer.id.slice(-6).toUpperCase()}$('co').onclick=async()=>{$('pm').classList.add('on');try{await showQR()}catch(e){$('pair').textContent='QR unavailable'}};$('x').onclick=()=>$('pm').classList.remove('on');async function scanQR(){await load('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js');$('qm').classList.add('on');try{let v=$('qv'),st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});v.srcObject=st;await v.play();let cv=document.createElement('canvas'),x=cv.getContext('2d',{willReadFrequently:true});const loop=()=>{if(!$('qm').classList.contains('on')){st.getTracks().forEach(t=>t.stop());return}if(!v.videoWidth)return requestAnimationFrame(loop);cv.width=v.videoWidth;cv.height=v.videoHeight;x.drawImage(v,0,0);let d=x.getImageData(0,0,cv.width,cv.height),q=jsQR(d.data,cv.width,cv.height,{inversionAttempts:'attemptBoth'});if(q)try{let u=new URL(q.data),id=u.searchParams.get('host');if(id){st.getTracks().forEach(t=>t.stop());$('qm').classList.remove('on');startPeer().then(()=>attach(peer.connect(id,{reliable:true})));return}}catch(e){}requestAnimationFrame(loop)};loop()}catch(e){$('qs').textContent='Camera permission required'}}$('q').onclick=scanQR;$('qx').onclick=()=>$('qm').classList.remove('on');async function boot(){if(renderer)return;await load('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');await load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js');scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.01,100);camera.position.set(0,.8,4.5);renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=.05;scene.add(new THREE.GridHelper(12,24,0x142a40,0x080d14));mapGroup=new THREE.Group();scene.add(mapGroup);renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}async function cameraStart(){if(stream)return true;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:960},height:{ideal:540}},audio:false});video=document.createElement('video');video.muted=true;video.playsInline=true;video.srcObject=stream;await video.play();return true}catch(e){say('Camera permission required');return false}}function grayFrame(){let w=320,h=240,cv=document.createElement('canvas');cv.width=w;cv.height=h;let x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(video,0,0,w,h);let d=x.getImageData(0,0,w,h).data,g=new Float32Array(w*h);for(let i=0,j=0;i<d.length;i+=4,j++)g[j]=.299*d[i]+.587*d[i+1]+.114*d[i+2];return{g,w,h}}function features(){let {g,w,h}=grayFrame(),a=[];for(let y=8;y<h-8;y+=5)for(let x=8;x<w-8;x+=5){let i=y*w+x,gx=Math.abs(g[i-2]-g[i+2])+Math.abs(g[i-w*2]-g[i+w*2]),gy=Math.abs(g[i-w*2]-g[i+w*2])+Math.abs(g[i-2]-g[i+2]);let score=gx+gy;if(score<70)continue;let desc=[];for(let dy=-3;dy<=3;dy+=2)for(let dx=-3;dx<=3;dx+=2)desc.push(g[(y+dy)*w+x+dx]-g[i]);a.push({x,y,score,d:desc});if(a.length>=450)break}a.sort((p,q)=>q.score-p.score);return a.slice(0,260).map(v=>[v.x,v.y,...v.d.map(z=>Math.max(-127,Math.min(127,z)))])}function match(a,b){let out=[];for(let p of a){let best=null,bd=1e9;for(let q of b){let dx=q[0]-p[0],dy=q[1]-p[1];if(Math.abs(dx)>150||Math.abs(dy)>70)continue;let e=dx*dx+dy*dy*.7;for(let k=2;k<p.length;k++)e+=Math.abs(p[k]-q[k])*1.8;if(e<bd){bd=e;best=q}}if(best&&bd<9000)out.push([p,best,bd])}return out}function stereo(a,b){let m=match(a,b),out=[];for(let z of m){let p=z[0],q=z[1],disp=Math.abs(p[0]-q[0]);if(disp<3||disp>150)continue;let depth=F*BASE/disp;depth=Math.max(.35,Math.min(8,depth));let x=((p[0]+q[0])*.5-160)/F*depth,y=(120-(p[1]+q[1])*.5)/F*depth;let conf=Math.max(0,1-z[2]/9000);out.push([x,y,depth,conf])}return{m:m.length,p:out}}function temporal(p){if(!prevLocal.length)return p;let c1=cent(prevLocal),c2=cent(local),dx=(c1[0]-c2[0])*.001,dz=(c1[1]-c2[1])*.002;return p.map(v=>[v[0]+dx,v[1],v[2]+dz,v[3]])}function cent(a){if(!a.length)return[0,0];let x=0,y=0;for(let v of a){x+=v[0];y+=v[1]}return[x/a.length,y/a.length]}function integrate(p){for(let v of p){let k=`${Math.round(v[0]/VOX)},${Math.round(v[1]/VOX)},${Math.round(v[2]/VOX)}`;let old=map.get(k);if(!old||v[3]>old[3])map.set(k,v);if(map.size>=MAX)break}render()}function render(){mapGroup.clear();if(!map.size)return;let p=[],c=[];for(let v of map.values()){let q=Math.max(.18,Math.min(1,v[3]));p.push(v[0],v[1],v[2]);let edge=.45+.35*q;c.push(.15*edge,.52*edge,.9*edge)}let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));let m=new THREE.PointsMaterial({size:.026,vertexColors:true,transparent:true,opacity:.76,depthWrite:true,sizeAttenuation:true});mapGroup.add(new THREE.Points(g,m));$('st').textContent=`Quest ${local.length} · iPhone ${remote.length} · matches ${lastMatches} · space ${map.size.toLocaleString()}`;$('bu').disabled=map.size<30}let lastMatches=0;async function spatial(){await boot();if(!await cameraStart())return;$('re').disabled=false;say(conn?.open?'DUAL VISUAL 3D MAPPING':'3D MAPPING · connect second device');let last=0;const loop=t=>{if(!stream)return;if(t-last<110){requestAnimationFrame(loop);return}last=t;local=features();send({type:'features',f:local});if(remote.length){let s=stereo(local,remote);lastMatches=s.m;integrate(temporal(s.p));if(recording)frames.push({l:local,r:remote,p:s.p})}else{lastMatches=0;let p=local.map(v=>[((v[0]-160)/F)*2,(120-v[1])/F*2,2,v[2]/200]);integrate(p)}prevLocal=local.slice();requestAnimationFrame(loop)};requestAnimationFrame(loop)}$('sc').onclick=spatial;function build(){if(map.size<30){say('Scan more of the room first');return}say(`Hologram built · ${map.size.toLocaleString()} spatial cells`);$('pl').disabled=false}$('bu').onclick=build;$('cl').onclick=()=>{map.clear();mapGroup.clear();frames=[];prevLocal=[];local=[];remote=[];lastMatches=0;say('3D space cleared');$('bu').disabled=true};$('re').onclick=()=>{recording=!recording;$('re').textContent=recording?'Stop':'Record';say(recording?'Recording every mapped frame':`${frames.length} mapped frames recorded`)};$('pl').onclick=()=>say('Hologram ready · rotate the 3D space');(async()=>{await startPeer();say(isHost?'iPhone ready · Show QR':'Quest ready · Scan QR')})();</script></body></html>
