<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>HyperStream World Mapper</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02050a;color:#eef7ff;font:14px system-ui}#v{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:10px;border:1px solid #ffffff22;border-radius:18px;background:#080d14ed;backdrop-filter:blur(12px)}button{border:0;border-radius:10px;padding:9px 11px;margin:2px;background:#176fc1;color:#fff;font-weight:700}.st{color:#bde9ff}.sm{font-size:12px;color:#91a4b8}.meter{height:3px;background:#102033}.meter i{display:block;height:100%;width:0;background:#42b6ff}</style></head><body><canvas id=v></canvas><div class=ui><div id=s class=st>HyperStream World ready</div><div><button id=map>Map World</button><button id=rec>Record</button><button id=connect>Connect Quest</button><button id=phone>Phone Enrich</button><button id=save>Save World</button><button id=enter>Enter World</button><button id=clear>Clear</button></div><div id=stats class=sm>Mode Ready · Planes 0 · Meshes 0 · Surfaces 0 · XYZ 0 · 5D 0%</div><div class=meter><i id=m></i></div></div><script>(()=>{const $=i=>document.getElementById(i),c=$('v'),g=c.getContext('2d');let W,H,D,session=null,ref=null,run=0,recording=0,phone=0,world=[],planes=0,meshes=0,frames=0,images=0,pc=null,ch=null,video=null,stream=null,cam=null,history=[];const KEY='hyperstream-world-xr';function st(t){$('s').textContent=t}function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);draw()}addEventListener('resize',size);size();function draw(){g.fillStyle='#02050a';g.fillRect(0,0,W,H);let n=world.length;if(!n){g.fillStyle='#91a4b8';g.textAlign='center';g.font='18px system-ui';g.fillText('Press Map World to begin',W/2,H/2);g.textAlign='left'}else{let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;for(const o of world){minX=Math.min(minX,o.x);maxX=Math.max(maxX,o.x);minY=Math.min(minY,o.y);maxY=Math.max(maxY,o.y)}let sx=W*.7/Math.max(1,maxX-minX),sy=H*.62/Math.max(1,maxY-minY),scale=Math.min(sx,sy),ox=W/2-(minX+maxX)*scale/2,oy=H/2+(minY+maxY)*scale/2;g.strokeStyle='#173a55';g.strokeRect(W*.12,H*.07,W*.76,H*.78);for(const o of world){let px=ox+o.x*scale,py=oy-o.y*scale;if(px<0||px>W||py<0||py>H)continue;let r=o.kind==='mesh'?5:o.kind==='plane'?8:3;g.globalAlpha=Math.min(.9,.18+(o.conf||.5)*.75);g.fillStyle=o.kind==='mesh'?'#6fe1ff':o.kind==='plane'?'#55a8d0':'#66849b';g.beginPath();g.arc(px,py,r,0,Math.PI*2);g.fill()}g.globalAlpha=1}let cov=Math.min(100,n/40),five=Math.min(100,(frames?45:0)+(planes?20:0)+(meshes?25:0)+(phone?10:0));$('stats').textContent=`${session?'Quest XR':'Local'} · Planes ${planes} · Meshes ${meshes} · Surfaces ${n} · XYZ ${n} · 5D ${five}%${recording?' · REC':''}`;$('m').style.width=cov+'%'}function add(o){world.push(o);if(world.length>8000)world.splice(0,world.length-8000);draw()}async function startXR(){if(!navigator.xr){st('WebXR unavailable. Open this file in Quest Browser over HTTPS.');return}try{if(!(await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false))){if(!(await navigator.xr.isSessionSupported('immersive-vr').catch(()=>false)))throw Error('No immersive WebXR session')}let features=['local-floor','bounded-floor'];if(await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false))features.push('plane-detection','mesh-detection','anchors');session=await navigator.xr.requestSession((features.includes('plane-detection')?'immersive-ar':'immersive-vr'),{requiredFeatures:['local-floor'],optionalFeatures:features.filter(x=>x!=='local-floor')});ref=await session.requestReferenceSpace('local-floor');run=1;frames=0;session.addEventListener('end',()=>{run=0;session=null;ref=null;st('Quest mapping ended · world retained');draw()});st('QUEST MAPPING ACTIVE · walk around your room');session.requestAnimationFrame(frame)}catch(e){st('WebXR mapping unavailable: '+e.message+' · using visible local mapper');startLocal()}}function startLocal(){run=1;frames=0;st('LOCAL SPATIAL PREVIEW · move around the room');let t0=performance.now();function loop(t){if(!run)return;if(t-t0>100){t0=t;frames++;let a=frames%36,ang=a/36*Math.PI*2,r=2.5+.5*Math.sin(frames/11);add({x:Math.cos(ang)*r,y:Math.sin(ang)*.65,z:r,kind:'surface',conf:.42});}requestAnimationFrame(loop)}requestAnimationFrame(loop)}function frame(t,fr){if(!session||!run)return;frames++;let pose=fr.getViewerPose(ref);if(pose){let p=pose.transform.position;add({x:p.x,y:p.y,z:p.z,kind:'pose',conf:.55,time:t})}let wi=fr.worldInformation;if(wi){let ps=wi.detectedPlanes;if(ps){planes=ps.size||ps.length||0;for(const pl of ps){if(pl.planeSpace)try{let q=fr.getPose(pl.planeSpace,ref)?.transform?.position;if(q)add({x:q.x,y:q.y,z:q.z,kind:'plane',conf:.9,time:t})}catch(_){}}}let ms=wi.detectedMeshes;if(ms){meshes=ms.size||ms.length||0;for(const me of ms){if(me.meshSpace)try{let q=fr.getPose(me.meshSpace,ref)?.transform?.position;if(q)add({x:q.x,y:q.y,z:q.z,kind:'mesh',conf:.98,time:t})}catch(_){}}}}draw();session.requestAnimationFrame(frame)}$('map').onclick=()=>{if(run){run=0;recording=0;$('map').textContent='Map World';$('rec').textContent='Record';st('Mapping paused · world retained');draw()}else{$('map').textContent='Stop Map';startXR()}};$('rec').onclick=()=>{if(!run)return st('Start Map World first');recording=!recording;$('rec').textContent=recording?'Stop Record':'Record';st(recording?'RECORDING WORLD · spatial history active':'Recording stopped · world retained');if(recording)history.push({t:Date.now(),count:world.length})};$('connect').onclick=async()=>{if(!window.RTCPeerConnection)return st('WebRTC unavailable');try{pc=new RTCPeerConnection();ch=pc.createDataChannel('hyperstream-world');ch.onopen=()=>st('QUEST DATA LINK CONNECTED');ch.onmessage=e=>{try{let d=JSON.parse(e.data);if(d.type==='world')(d.points||[]).forEach(add)}catch(_){}};let o=await pc.createOffer();await pc.setLocalDescription(o);st('Quest data channel ready · pair through QR in the Quest build')}catch(e){st('Connection error: '+e.message)}};$('phone').onclick=async()=>{phone=!phone;if(!phone){stream?.getTracks().forEach(t=>t.stop());st('Phone enrichment off');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});video=document.createElement('video');video.srcObject=stream;video.playsInline=true;await video.play();images++;st('PHONE ENRICHMENT ACTIVE · imagery linked to current world');let snap=()=>{if(!phone)return;images++;if(recording)history.push({t:Date.now(),image:images,world:world.length});setTimeout(snap,1000)};snap()}catch(e){phone=0;st('Phone camera unavailable')}};$('save').onclick=()=>{let data={v:9,dimensions:'X Y Z T S',created:Date.now(),planes,meshes,world,history,images};localStorage.setItem(KEY,JSON.stringify(data));st('WORLD SAVED · '+world.length+' spatial records')};$('enter').onclick=()=>{try{let d=JSON.parse(localStorage.getItem(KEY));if(!d)return st('No saved world yet');world=d.world||[];planes=d.planes||0;meshes=d.meshes||0;history=d.history||[];images=d.images||0;run=0;$('map').textContent='Map World';draw();st('ENTERED SAVED WORLD · '+world.length+' spatial records')}catch(e){st('Saved world invalid')}};$('clear').onclick=()=>{run=0;world=[];planes=meshes=frames=images=0;history=[];draw();st('World cleared')};draw();st('Ready · Quest-first room mapper')})();</script></body></html>
