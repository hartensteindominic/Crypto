<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name=theme-color content="#020306"><title>HyperStream Spatial</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020306;color:#fff;font:14px system-ui,sans-serif}#c{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:9px;border:1px solid #ffffff20;border-radius:17px;background:#0c1018ed;backdrop-filter:blur(12px)}button{border:0;border-radius:10px;padding:9px 11px;margin:2px;background:#1677ff;color:#fff;font-weight:700}button:disabled{opacity:.3}.status{color:#9bd4ff}.small{color:#9299a6;font-size:12px}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000e;align-items:center;justify-content:center;padding:15px}.on{display:flex}.card{width:min(420px,100%);background:#171a20;border-radius:19px;padding:15px;text-align:center}.qr{width:250px;height:250px;background:#fff;margin:10px auto;padding:7px}.qr canvas{width:100%;height:100%}#qv{width:100%;max-height:60vh;object-fit:cover;border-radius:13px}.target{position:absolute;inset:18%;border:2px solid #48a0ff;border-radius:16px}.err{color:#ff9b9b}.ok{color:#9dffbc}</style></head><body><canvas id=c></canvas><div class=ui><div class=status id=s>HyperStream ready</div><div><button id=q>Scan QR</button><button id=co>Show QR</button><button id=sc>Start Spatial</button><button id=re disabled>Record</button><button id=bu disabled>Build Hologram</button><button id=pl disabled>Play</button><button id=cl>Clear</button></div><div class=small id=st>Quest 0 · iPhone 0 · map 0 · ready</div></div><div class=modal id=pm><div class=card><h2>Connect Quest</h2><div class=qr><canvas id=qc></canvas></div><div id=pair>Preparing QR…</div><p class=small>Scan this with Quest. Keep this screen open.</p><button id=x>Close</button></div></div><div class=modal id=qm><div class=card><h2>Scan QR</h2><div style="position:relative"><video id=qv autoplay playsinline muted></video><div class=target></div></div><p id=qs class=small>Center the iPhone QR.</p><button id=qx>Cancel</button></div></div><script>const $=x=>document.getElementById(x),params=new URLSearchParams(location.search),isQuest=params.has('host'),state={peer:null,conn:null,id:null,three:false,stream:null,video:null,running:false,recording:false,frames:[],map:new Map(),local:{p:[],c:[]},remote:{p:[],c:[]},pose:{x:0,y:0,z:0},prev:null,world:null,rec:null,chunks:[],qrLoaded:false,qrScanning:false};const MAX=90000,VOX=.085;const say=x=>{$('s').textContent=x};const load=u=>new Promise((ok,no)=>{let s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});async function peerStart(){if(state.peer)return state.peer;try{await load('https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js');state.peer=new Peer(undefined,{debug:0});state.peer.on('open',id=>{state.id=id;say(isQuest?'Quest ready · Scan QR':'iPhone ready · Show QR')});state.peer.on('connection',c=>attach(c));state.peer.on('error',e=>say('Connection error · try again'));return state.peer}catch(e){say('Connection library failed');throw e}}function send(o){if(state.conn?.open)state.conn.send(o)}function attach(c){state.conn=c;c.on('open',()=>{send({t:'hello',v:2});say('CONNECTED · Quest + iPhone');$('sc').disabled=false;if(!state.running)startSpatial()});c.on('data',d=>{if(d?.t==='hello'){say('CONNECTED · dual spatial link');$('sc').disabled=false}else if(d?.t==='spatial')receive(d)});c.on('close',()=>say('Connection closed'))}async function makeQR(){await peerStart();if(!state.id)throw Error('peer not ready');try{if(!state.qrLoaded){await load('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js');state.qrLoaded=true}let u=location.href.split('?')[0]+'?host='+encodeURIComponent(state.id),q=qrcode(0,'M');q.addData(u);q.make();let cv=$('qc'),x=cv.getContext('2d'),n=q.getModuleCount(),z=Math.max(2,Math.floor(720/(n+8)));cv.width=cv.height=(n+8)*z;x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.fillStyle='#000';for(let y=0;y<n;y++)for(let X=0;X<n;X++)if(q.isDark(y,X))x.fillRect((X+4)*z,(y+4)*z,z,z);$('pair').textContent='PAIR '+state.id.slice(-6).toUpperCase()}catch(e){$('pair').textContent='QR failed';say('QR generation failed')}}$('co').onclick=async()=>{$('pm').classList.add('on');$('pair').textContent='Preparing QR…';try{await makeQR()}catch(e){}};$('x').onclick=()=>$('pm').classList.remove('on');async function boot(){if(state.three)return;try{await load('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');await load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js');window.S=new THREE.Scene();window.C=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.03,200);C.position.set(0,1.2,6);window.R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(devicePixelRatio||1,1.35));R.setSize(innerWidth,innerHeight);window.T=new THREE.OrbitControls(C,R.domElement);T.enableDamping=true;T.autoRotate=true;T.autoRotateSpeed=.16;S.add(new THREE.GridHelper(12,24,0x14263b,0x090d13));R.setAnimationLoop(()=>{T.update();R.render(S,C)});addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});state.three=true}catch(e){say('3D engine failed to load')}}function draw(p,c,size=.03,op=.55){if(!p.length)return null;let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));let m=new THREE.PointsMaterial({size,vertexColors:true,transparent:true,opacity:op,blending:THREE.NormalBlending,depthWrite:false,sizeAttenuation:true});let o=new THREE.Points(g,m);S.add(o);return o}function centroid(p){let x=0,y=0,z=0,n=p.length/3||1;for(let i=0;i<p.length;i+=3){x+=p[i];y+=p[i+1];z+=p[i+2]}return{x:x/n,y:y/n,z:z/n}}function sample(v){let vw=v.videoWidth||640,vh=v.videoHeight||360,w=180,h=Math.max(100,Math.round(vh/vw*w)),cv=document.createElement('canvas');cv.width=w;cv.height=h;let x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,w,h);let d=x.getImageData(0,0,w,h).data,p=[],c=[];for(let y=2;y<h-2;y+=5)for(let X=2;X<w-2;X+=5){let i=(y*w+X)*4,r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,l=.299*r+.587*g+.114*b;if(l<.035||l>.965)continue;let e=(Math.abs(d[i]-d[i-4])+Math.abs(d[i]-d[i+4]))/510;let z=(1-l)*3.8-1.9+e*.3;p.push((X/w-.5)*3.4,(.5-y/h)*2.5,z);c.push(r,g,b)}return{p,c,center:centroid(p)}}function integrate(a,side){let shift=side==='iphone'?.62:-.62;if(state.prev){let dx=Math.max(-.025,Math.min(.025,(a.center.x-state.prev.x)*.16));let dz=Math.max(-.03,Math.min(.03,(a.center.z-state.prev.z)*.16));state.pose.x+=dx;state.pose.z+=dz}state.prev=a.center;for(let i=0;i<a.p.length&&state.map.size<MAX;i+=3){let x=a.p[i]+shift+state.pose.x,y=a.p[i+1]+state.pose.y,z=a.p[i+2]+state.pose.z,k=Math.round(x/VOX)+','+Math.round(y/VOX)+','+Math.round(z/VOX);if(!state.map.has(k))state.map.set(k,[x,y,z,a.c[i],a.c[i+1],a.c[i+2]])}}function renderMap(){if(window.mapCloud){S.remove(window.mapCloud);window.mapCloud.geometry.dispose()}let p=[],c=[];for(let v of state.map.values()){p.push(v[0],v[1],v[2]);c.push(v[3]*.68,v[4]*.68,v[5]*.68)}window.mapCloud=draw(p,c,.032,.58);$('st').textContent=`Quest ${(state.local.p.length/3)|0} · iPhone ${(state.remote.p.length/3)|0} · map ${state.map.size.toLocaleString()} · LIVE SPATIAL MAP`}function renderLive(){for(let k of ['liveQ','liveI','liveF'])if(window[k]){S.remove(window[k]);window[k].geometry.dispose()}window.liveQ=draw(state.local.p,state.local.c,.018,.2);window.liveI=draw(state.remote.p,state.remote.c,.018,.2);let p=[],c=[],n=Math.min(state.local.p.length,state.remote.p.length);for(let i=0;i<n&&p.length<24000;i+=3){p.push((state.local.p[i]+state.remote.p[i])*.5,(state.local.p[i+1]+state.remote.p[i+1])*.5,(state.local.p[i+2]+state.remote.p[i+2])*.5);c.push((state.local.c[i]+state.remote.c[i])*.3,(state.local.c[i+1]+state.remote.c[i+1])*.3,(state.local.c[i+2]+state.remote.c[i+2])*.3)}window.liveF=draw(p,c,.022,.3);renderMap()}function receive(d){state.remote={p:d.p||[],c:d.c||[]};integrate(state.remote,isQuest?'quest':'iphone');if(state.recording)state.frames.push({p:state.remote.p,c:state.remote.c,side:isQuest?'quest':'iphone'});renderLive()}async function camera(){if(state.stream)return true;if(!navigator.mediaDevices?.getUserMedia){say('Camera unavailable: use HTTPS');return false}try{state.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:360}},audio:false});state.video=document.createElement('video');state.video.srcObject=state.stream;state.video.muted=true;await state.video.play();return true}catch(e){say('Camera permission required');return false}}async function startSpatial(){if(state.running)return;await peerStart();await boot();if(!await camera())return;state.running=true;$('re').disabled=false;$('sc').disabled=false;say(state.conn?.open?'DUAL SPATIAL MAP ACTIVE':'LOCAL SPATIAL MAP ACTIVE · connect second camera for fusion');let last=0;function loop(t){if(!state.running)return;if(t-last<120){requestAnimationFrame(loop);return}last=t;let a=sample(state.video);state.local=a;integrate(a,isQuest?'quest':'iphone');send({t:'spatial',p:a.p,c:a.c});if(state.recording)state.frames.push({p:a.p,c:a.c,side:isQuest?'quest':'iphone'});renderLive();requestAnimationFrame(loop)}requestAnimationFrame(loop)}$('sc').onclick=startSpatial;async function connect(h){await peerStart();say('Connecting…');let c=state.peer.connect(h,{reliable:true});attach(c)}async function scanQR(){$('qm').classList.add('on');if(state.qrScanning)return;state.qrScanning=true;try{await load('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js');let v=$('qv'),st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});v.srcObject=st;await v.play();let cv=document.createElement('canvas'),x=cv.getContext('2d',{willReadFrequently:true});async function loop(){if(!$('qm').classList.contains('on')){st.getTracks().forEach(t=>t.stop());state.qrScanning=false;return}cv.width=v.videoWidth;cv.height=v.videoHeight;x.drawImage(v,0,0);let n=Math.min(cv.width,cv.height),sx=(cv.width-n)/2,sy=(cv.height-n)/2,d=x.getImageData(sx,sy,n,n),q=jsQR(d.data,n,n,{inversionAttempts:'attemptBoth'});if(q)try{let u=new URL(q.data),h=u.searchParams.get('host');if(h){st.getTracks().forEach(t=>t.stop());$('qm').classList.remove('on');state.qrScanning=false;connect(h);return}}catch(e){}requestAnimationFrame(loop)}loop()}catch(e){state.qrScanning=false;$('qs').textContent='Camera permission required'}}$('q').onclick=scanQR;$('qx').onclick=()=>$('qm').classList.remove('on');function build(){if(!state.map.size){say('Scan space first');return}if(state.world){S.remove(state.world);state.world.geometry.dispose()}let p=[],c=[];for(let v of state.map.values()){p.push(v[0],v[1],v[2]);c.push(v[3]*.62,v[4]*.62,v[5]*.62)}state.world=draw(p,c,.033,.62);$('pl').disabled=false;say(`Hologram built · ${state.map.size.toLocaleString()} mapped voxels`)}$('bu').onclick=build;function clear(){state.map.clear();state.frames=[];state.pose={x:0,y:0,z:0};state.prev=null;if(state.world){S.remove(state.world);state.world.geometry.dispose();state.world=null}for(let k of ['mapCloud','liveQ','liveI','liveF'])if(window[k]){S.remove(window[k]);window[k]=null}state.local={p:[],c:[]};state.remote={p:[],c:[]};$('bu').disabled=true;say('Spatial map cleared')}$('cl').onclick=clear;$('re').onclick=()=>{state.recording=!state.recording;$('re').textContent=state.recording?'Stop':'Record';if(state.recording){state.frames=[];state.chunks=[];if(window.MediaRecorder&&window.R?.domElement.captureStream){state.rec=new MediaRecorder(R.domElement.captureStream(30));state.rec.ondataavailable=e=>e.data.size&&state.chunks.push(e.data);state.rec.onstop=()=>{$('pl').dataset.u=URL.createObjectURL(new Blob(state.chunks,{type:'video/webm'}));$('pl').disabled=false};state.rec.start()}say('Recording spatial map')}else{state.rec?.stop();$('bu').disabled=!state.map.size;say(`${state.map.size.toLocaleString()} mapped voxels captured`)}};$('pl').onclick=()=>{$('pl').dataset.u&&open($('pl').dataset.u)};(async()=>{try{await peerStart();say(isQuest?'Quest ready · Scan QR':'iPhone ready · Show QR')}catch(e){}})();</script></body></html>
