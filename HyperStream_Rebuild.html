<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>HyperStream Room Mapper</title><style>*{box-sizing:border-box}html,body,#a{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:14px system-ui}#a{position:fixed;inset:0}#ui{position:fixed;z-index:4;left:10px;right:10px;bottom:10px;padding:9px;border:1px solid #ffffff22;border-radius:14px;background:#071019ee;backdrop-filter:blur(10px)}button{margin:2px;padding:8px 10px;border:0;border-radius:8px;background:#1473bd;color:#fff;font-weight:700}.s{font-size:11px;color:#9eb4c6}#q{display:none;position:fixed;inset:0;z-index:9;place-items:center;background:#000d}.card{padding:20px;background:#0b1620;border-radius:16px;text-align:center}</style></head><body><div id=a></div><div id=ui><b id=s>HyperStream ready</b><div><button id=v>Start AR</button><button id=m>Map</button><button id=r>Record</button><button id=w>Save</button><button id=e>Enter</button><button id=x>Clear</button><button id=p>Phone QR</button></div><div id=t class=s>XR off · Mesh 0 · Planes 0 · Vertices 0 · Frames 0</div></div><div id=q><div class=card><div id=code></div><p>Scan to control HyperStream</p><button id=close>Close</button></div></div><script src=https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js></script><script type=module>import*as T from'https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js';const $=i=>document.getElementById(i),S=new T.Scene(),C=new T.PerspectiveCamera(70,innerWidth/innerHeight,.01,100),R=new T.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});R.setPixelRatio(Math.min(devicePixelRatio,1.5));R.setSize(innerWidth,innerHeight);R.xr.enabled=true;$('a').append(R.domElement);S.background=null;S.add(new T.HemisphereLight(0xd8f5ff,0x081018,1.7));const room=new T.Group;S.add(room);let ses=null,space=null,base=null,map=false,rec=false,frames=0,meshes=0,planes=0,verts=0,hist=[],saved='HS_ROOM_V5',meshObjects=new Map,planeObjects=new Map;function msg(x){$('s').textContent=x}function stats(){ $('t').textContent=`${ses?'XR LIVE':'XR off'} · ${map?'MAP ON':'Map off'} · Mesh ${meshes} · Planes ${planes} · Vertices ${verts} · Frames ${frames}${rec?' · RECORDING':''}` }function clearWorld(){for(const o of room.children)o.geometry?.dispose();room.clear();meshObjects.clear();planeObjects.clear();meshes=planes=verts=0}function vecs(a){if(!a)return[];const out=[];for(let i=0;i<a.length;i+=3)out.push(new T.Vector3(a[i],a[i+1],a[i+2]));return out}function poseMatrix(xrSpace,fr){try{const p=fr.getPose(xrSpace,base);return p?.transform?.matrix||null}catch{return null}}function apply(o,m){if(m){o.matrix.fromArray(m);o.matrixAutoUpdate=false}else{o.matrixAutoUpdate=true}}function updateMesh(xrMesh,fr){const vs=xrMesh.vertices,ix=xrMesh.indices;if(!vs||!ix||vs.length<9||ix.length<3)return;let o=meshObjects.get(xrMesh);if(!o){const g=new T.BufferGeometry();o=new T.Mesh(g,new T.MeshBasicMaterial({color:0x42d9ff,transparent:true,opacity:.32,side:T.DoubleSide,wireframe:false}));room.add(o);meshObjects.set(xrMesh,o)}const a=new Float32Array(vs);g=o.geometry;g.setAttribute('position',new T.BufferAttribute(a,3));const indices=ix instanceof Uint32Array?ix:new Uint32Array(ix);g.setIndex(new T.BufferAttribute(indices,1));g.computeVertexNormals();apply(o,poseMatrix(xrMesh.meshSpace,fr));verts+=vs.length/3}function updatePlane(p,fr){const poly=p.polygon||p.vertices;if(!poly||poly.length<3)return;let arr=[];for(const v of poly){if(v instanceof DOMPointReadOnly||typeof v.x==='number')arr.push(new T.Vector3(v.x,v.y,v.z));else arr.push(new T.Vector3(v[0],v[1],v[2]))}if(arr.length<3)return;let o=planeObjects.get(p);if(!o){const g=new T.BufferGeometry();o=new T.Mesh(g,new T.MeshBasicMaterial({color:0x55efad,transparent:true,opacity:.24,side:T.DoubleSide}));room.add(o);planeObjects.set(p,o)}const verts3=[];for(const v of arr)verts3.push(v.x,v.y,v.z);o.geometry.setAttribute('position',new T.BufferAttribute(new Float32Array(verts3),3));const idx=[];for(let i=1;i<arr.length-1;i++)idx.push(0,i,i+1);o.geometry.setIndex(idx);o.geometry.computeVertexNormals();apply(o,poseMatrix(p.planeSpace||p.xrSpace,fr))}async function start(){if(!navigator.xr)return msg('WebXR unavailable in this browser');try{const ar=await navigator.xr.isSessionSupported('immersive-ar');if(!ar){msg('Immersive AR is not supported here');return}const required=['local-floor'];const optional=['mesh-detection','plane-detection','hit-test','anchors','dom-overlay'];const init={requiredFeatures:required,optionalFeatures:optional};if(document.body){init.optionalFeatures.push('dom-overlay');init.domOverlay={root:document.body}}ses=await navigator.xr.requestSession('immersive-ar',init);await R.xr.setSession(ses);base=await ses.requestReferenceSpace('local-floor');msg('AR LIVE · waiting for real room mesh');ses.addEventListener('end',()=>{ses=null;base=null;msg('AR ended · saved data retained');stats()});stats()}catch(e){msg('AR failed: '+e.message)}}$('v').onclick=start;$('m').onclick=()=>{map=!map;msg(map?(ses?'Mapping real room geometry':'Map armed · start AR first'):'Mapping paused');stats()};$('r').onclick=()=>{rec=!rec;$('r').textContent=rec?'Stop':'Record';msg(rec?'Recording spatial session':'Recording stopped');stats()};$('w').onclick=()=>{localStorage[saved]=JSON.stringify({v:5,hist,frames,meshes,planes,verts});msg('Spatial session saved');stats()};$('e').onclick=()=>{try{const d=JSON.parse(localStorage[saved]);hist=d.hist||[];frames=d.frames||0;meshes=d.meshes||0;planes=d.planes||0;verts=d.verts||0;msg('Saved session loaded · start AR to rebuild geometry');stats()}catch{msg('No saved session')}};$('x').onclick=()=>{clearWorld();hist=[];frames=0;msg('Room cleared');stats()};$('p').onclick=()=>{const u=new URL('HyperStream_Phone.html',location.href);$('code').innerHTML='';if(window.QRCode)new QRCode($('code'),{text:u.href,width:220,height:220});else $('code').textContent=u.href;$('q').style.display='grid'};$('close').onclick=()=>$('q').style.display='none';function frame(t,f){if(!ses||!f)return;frames++;if(map){const ms=f.detectedMeshes,ps=f.detectedPlanes;meshes=ms?.size??ms?.length??0;planes=ps?.size??ps?.length??0;if(ms)for(const m of ms)updateMesh(m,f);if(ps)for(const p of ps)updatePlane(p,f);if(frames%5===0)msg(meshes||planes?'ROOM GEOMETRY LIVE':'AR LIVE · scanning for room geometry')}if(rec&&frames%10===0)hist.push({t:Date.now(),meshes,planes,verts}) ;stats()}R.setAnimationLoop((t,f)=>{frame(t,f);R.render(S,C)});addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});stats()</script></body></html>
