<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HyperStream</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font:16px system-ui}#app{position:fixed;inset:0}#bar{position:fixed;z-index:5;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;padding:9px;border-radius:18px;background:#071019dd;backdrop-filter:blur(10px)}button{border:0;border-radius:12px;padding:12px 18px;background:#1684d4;color:#fff;font-weight:800}button:disabled{opacity:.4}#s{position:fixed;z-index:5;top:14px;left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:12px;background:#071019bb;font-size:12px}#err{display:none;position:fixed;inset:0;z-index:20;place-items:center;text-align:center;padding:25px;background:#02060a;color:#fff}.card{max-width:420px;padding:24px;border-radius:20px;background:#0a1520}</style></head><body><div id="app"></div><div id="s">READY</div><div id="bar"><button id="start">START</button><button id="map" disabled>MAP</button><button id="rec" disabled>RECORD</button><button id="save" disabled>SAVE</button></div><div id="err"><div class="card"><h2>HyperStream</h2><p id="et"></p><button onclick="location.reload()">RETRY</button></div></div><script type="module">import*as THREE from'https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js';const $=x=>document.getElementById(x),scene=new THREE.Scene(),renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'}),camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,100),world=new THREE.Group();renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;renderer.setClearColor(0,0);$('app').append(renderer.domElement);scene.add(world);let session=null,ref=null,mapping=false,recording=false,frames=[],last=0,meshes=0,verts=0;const KEY='hyperstream-room-v4';const material=new THREE.MeshBasicMaterial({color:0x55ddff,transparent:true,opacity:.34,wireframe:false,side:THREE.DoubleSide});function status(x){$('s').textContent=x}function clear(){while(world.children.length){let o=world.children.pop();o.geometry?.dispose();o.material?.dispose()}}function draw(packet){clear();meshes=0;verts=0;for(const m of packet||[]){if(!m.v||m.v.length<9)continue;const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(m.v),3));if(m.i?.length)g.setIndex(m.i);g.computeVertexNormals();const o=new THREE.Mesh(g,material.clone());if(m.matrix){o.matrix.fromArray(m.matrix);o.matrixAutoUpdate=false}world.add(o);meshes++;verts+=m.v.length/3}status(session?`ROOM LIVE · ${meshes} surfaces · ${Math.round(verts)} points`: 'READY')}function capture(frame){const out=[];const set=frame.detectedMeshes;if(!set)return out;for(const m of set){try{const v=Array.from(m.vertices||[]),i=Array.from(m.indices||[]);if(v.length<9)continue;const p=frame.getPose(m.meshSpace,ref);out.push({v,i,matrix:p?.transform?.matrix?Array.from(p.transform.matrix):null})}catch(e){}}return out}async function start(){try{if(!navigator.xr)throw Error('WebXR is not available. Open this page in Quest Browser.');if(!(await navigator.xr.isSessionSupported('immersive-ar')))throw Error('Immersive AR is not available on this headset/browser.');session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['local-floor'],optionalFeatures:['mesh-detection','plane-detection','dom-overlay'],domOverlay:{root:document.body}});await renderer.xr.setSession(session);ref=await session.requestReferenceSpace('local-floor');$('start').disabled=true;$('map').disabled=false;$('rec').disabled=false;$('save').disabled=false;status('PASSTHROUGH LIVE · press MAP');session.addEventListener('end',()=>{session=null;mapping=false;recording=false;$('start').disabled=false;status('AR ENDED')})}catch(e){$('et').textContent=e.message;$('err').style.display='grid'}}$('start').onclick=start;$('map').onclick=()=>{mapping=!mapping;status(mapping?'MAPPING ROOM':'PASSTHROUGH LIVE');$('map').textContent=mapping?'STOP':'MAP'};$('rec').onclick=()=>{recording=!recording;if(recording)frames=[];status(recording?'RECORDING ROOM':'RECORD STOPPED');$('rec').textContent=recording?'STOP':'RECORD'};$('save').onclick=()=>{if(!frames.length)return status('NO ROOM DATA YET');try{localStorage.setItem(KEY,JSON.stringify({version:4,frames}));status(`SAVED · ${frames.length} frames`)}catch(e){status('SAVE FAILED')}};renderer.setAnimationLoop((t,frame)=>{if(session&&frame&&mapping){const packet=capture(frame);if(packet.length){draw(packet);if(recording&&t-last>120){frames.push({t,meshes:packet});last=t}}}renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
