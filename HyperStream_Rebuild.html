<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>HyperStream Rebuild</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#03070b;color:#eef7ff;font:14px system-ui}#v{width:100%;height:100%;display:block}#ui{position:fixed;left:12px;right:12px;bottom:12px;padding:10px;border:1px solid #ffffff20;border-radius:16px;background:#071019ee;backdrop-filter:blur(12px)}button{padding:9px 11px;margin:2px;border:0;border-radius:9px;background:#1674c4;color:white;font-weight:700}#status{margin-bottom:5px}.small{font-size:11px;color:#9eb1c1}#qr{display:none;position:fixed;inset:0;place-items:center;background:#000d}.card{padding:22px;border-radius:18px;background:#0b1620;text-align:center}</style></head><body><canvas id=v></canvas><div id=ui><div id=status>Ready · phone controller available</div><button id=vr>Enter VR</button><button id=scan>Scan</button><button id=rec>Record</button><button id=save>Save</button><button id=load>Enter Saved</button><button id=clear>Clear</button><button id=qrbtn>Phone QR</button><div id=stats class=small>World: empty · Recording: off · Phone: disconnected</div></div><div id=qr><div class=card><div id=code></div><p>Scan this with your phone</p><button id=close>Close</button></div></div><script src=https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js></script><script type=module>import*as THREE from'https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js';const $=id=>document.getElementById(id),c=$('v'),ctx=c.getContext('2d');let W=[],rec=0,scan=0,phone=0,frames=0,ws,session,cam={x:0,y:1.6,z:0},last=0;const K='hyperstream-clean-v1';function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}resize();addEventListener('resize',resize);function point(x,y,z,q=.8){let k=`${Math.round(x/.15)},${Math.round(y/.15)},${Math.round(z/.15)}`,o=W.find(a=>a.k===k);if(o){o.x+=(x-o.x)*.15;o.y+=(y-o.y)*.15;o.z+=(z-o.z)*.15;o.q=Math.min(1,o.q*.9+q*.1);o.n++}else if(W.length<7000)W.push({k,x,y,z,q,n:1})}function demo(){if(!scan)return;for(let i=0;i<18;i++){let a=Math.random()*Math.PI*2,r=1+Math.random()*3;point(cam.x+Math.cos(a)*r,Math.max(.05,cam.y+(Math.random()-.5)*1.5),cam.z+Math.sin(a)*r,.65)}frames++;draw();}function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);let s=Math.min(innerWidth,innerHeight)/8;for(let o of W){let z=o.z-cam.z+5;if(z<.2)continue;let x=innerWidth/2+(o.x-cam.x)*s/z,y=innerHeight/2-(o.y-cam.y)*s/z,r=Math.max(1,5/z);ctx.globalAlpha=.25+.55*o.q;ctx.fillStyle=o.q>.8?'#67d8ff':'#55a9d8';ctx.fillRect(x-r,y-r,r*2,r*2)}ctx.globalAlpha=1;$('stats').textContent=`World: ${W.length} cells · Frames: ${frames} · Recording: ${rec?'ON':'off'} · Phone: ${phone?'connected':'disconnected'}`}function connect(url){try{ws=new WebSocket(url);ws.onopen=()=>{$('status').textContent='Phone/Quest bridge connected';phone=1;draw()};ws.onclose=()=>{phone=0;draw()};ws.onmessage=e=>{try{let d=JSON.parse(e.data);if(d.type==='controller'){if(d.cmd==='scan')scan=1;if(d.cmd==='record')rec=!rec;if(d.cmd==='clear')W=[];if(d.cmd==='save')save();if(d.cmd==='load')load();if(d.cmd==='move'&&d.move){cam.x+=d.move.x||0;cam.y+=d.move.y||0;cam.z+=d.move.z||0}draw()}else if(d.type==='spatial-frame'){if(d.pose)cam=d.pose;(d.points||[]).forEach(p=>scan&&point(+p.x,+p.y,+p.z,p.confidence));frames++;if(rec)last=Date.now();draw()}}catch{}}}catch{}}$('vr').onclick=async()=>{if(!navigator.xr)return $('status').textContent='WebXR is not available in this browser';try{session=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});$('status').textContent='VR active · hologram ready';session.onend=()=>{$('status').textContent='VR ended'}}catch(e){$('status').textContent='VR unavailable: '+e.message}};$('scan').onclick=()=>{scan=!scan;$('scan').textContent=scan?'Stop Scan':'Scan';$('status').textContent=scan?'Scanning spatial world':'Scan paused';demo()};$('rec').onclick=()=>{rec=!rec;$('rec').textContent=rec?'Stop':'Record';$('status').textContent=rec?'Recording hologram':'Recording stopped'};function save(){localStorage[K]=JSON.stringify({v:1,W,frames,cam});$('status').textContent=`Saved ${W.length} spatial cells`}function load(){let d;try{d=JSON.parse(localStorage[K])}catch{}if(!d)return $('status').textContent='No saved world';W=d.W||[];frames=d.frames||0;cam=d.cam||cam;draw();$('status').textContent=`Entered saved world · ${W.length} cells`}$('save').onclick=save;$('load').onclick=load;$('clear').onclick=()=>{W=[];frames=0;draw();$('status').textContent='World cleared'};$('qrbtn').onclick=()=>{let u=new URL('HyperStream_Phone.html',location.href);$('code').innerHTML='';new QRCode($('code'),{text:u.href,width:220,height:220});$('qr').style.display='grid'};$('close').onclick=()=>$('qr').style.display='none';draw();setInterval(demo,180);</script></body></html>
