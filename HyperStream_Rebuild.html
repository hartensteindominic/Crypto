<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>HyperStream Spatial Recorder</title><style>*{box-sizing:border-box}html,body,#a{margin:0;width:100%;height:100%;overflow:hidden;background:#02060a;color:#fff;font:14px system-ui}#a{position:fixed;inset:0}#ui{position:fixed;z-index:4;left:10px;right:10px;bottom:10px;padding:10px;border:1px solid #ffffff22;border-radius:14px;background:#071019ee;backdrop-filter:blur(10px)}button{margin:2px;padding:8px 10px;border:0;border-radius:8px;background:#1473bd;color:#fff;font-weight:700}.s{font-size:11px;color:#9eb4c6}#q{display:none;position:fixed;inset:0;z-index:9;place-items:center;background:#000d}.card{padding:20px;background:#0b1620;border-radius:16px;text-align:center}</style></head><body><div id=a></div><div id=ui><b id=s>HyperStream ready</b><div><button id=v>Start AR</button><button id=m>Map</button><button id=r>Record</button><button id=w>Save</button><button id=e>Replay Saved</button><button id=x>Clear</button><button id=p>Phone QR</button></div><div id=t class=s>XR off · Mesh 0 · Vertices 0 · Recorded frames 0 · Recording off</div></div><div id=q><div class=card><div id=code></div><p>Scan to control HyperStream</p><button id=close>Close</button></div></div><script src=https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js></script><script type=module>import*as T from'https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js';const $=i=>document.getElementById(i),S=new T.Scene(),C=new T.PerspectiveCamera(70,innerWidth/innerHeight,.01,100),R=new T.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});R.setPixelRatio(Math.min(devicePixelRatio,1.5));R.setSize(innerWidth,innerHeight);R.xr.enabled=true;$('a').append(R.domElement);S.add(new T.HemisphereLight(0xd8f5ff,0x081018,1.7));const room=new T.Group;S.add(room);let ses=null,space=null,mapping=false,recording=false,replaying=false,frameNo=0,recordedFrames=0,meshCount=0,vertexCount=0,recorded=[],playing=0;const KEY='HYPERSTREAM_SPATIAL_RECORDING_V2';const mat=new T.MeshBasicMaterial({color:0x42dfff,transparent:true,opacity:.42,side:T.DoubleSide});function msg(x){$('s').textContent=x}function stats(){$('t').textContent=`${ses?'AR LIVE':'XR off'} · ${mapping?'MAP ON':'Map off'} · Mesh ${meshCount} · Vertices ${vertexCount} · Recorded frames ${recordedFrames} · ${recording?'RECORDING':'Ready'}`}function clearRoom(){while(room.children.length){const o=room.children[0];o.geometry?.dispose();room.remove(o)}meshCount=vertexCount=0}function capture(frame){const set=frame.detectedMeshes;if(!set)return[];const out=[];for(const m of set){const v=Array.from(m.vertices||[]),i=Array.from(m.indices||[]);if(v.length<9||i.length<3)continue;let matrix=null;try{const p=frame.getPose(m.meshSpace,space);matrix=p?.transform?.matrix?Array.from(p.transform.matrix):null}catch{}out.push({v,i,matrix,label:m.semanticLabel||null})}return out}function renderPacket(packet){clearRoom();for(const m of packet){const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(new Float32Array(m.v),3));g.setIndex(m.i);g.computeVertexNormals();const o=new T.Mesh(g,mat.clone());if(m.matrix){o.matrix.fromArray(m.matrix);o.matrixAutoUpdate=false}room.add(o)}meshCount=packet.length;vertexCount=packet.reduce((n,m)=>n+m.v.length/3,0);stats()}function recordFrame(frame){const packet=capture(frame);if(!packet.length)return;recorded.push({t:performance.now(),meshes:packet});recordedFrames=recorded.length;renderPacket(packet)}async function start(){if(!navigator.xr)return msg('WebXR unavailable');try{if(!(await navigator.xr.isSessionSupported('immersive-ar')))return msg('Immersive AR unavailable');ses=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['local-floor','mesh-detection'],optionalFeatures:['plane-detection','anchors','hit-test','dom-overlay'],domOverlay:{root:document.body}});await R.xr.setSession(ses);space=await ses.requestReferenceSpace('local-floor');msg('AR LIVE · real room mesh requested');ses.addEventListener('end',()=>{ses=null;space=null;msg('AR ended · recording retained');stats()})}catch(e){msg('AR failed: '+e.message)}}$('v').onclick=start;$('m').onclick=()=>{if(!ses)return msg('Start AR first');mapping=!mapping;msg(mapping?'Mapping real room geometry':'Mapping paused');stats()};$('r').onclick=()=>{if(!ses)return msg('Start AR first');recording=!recording;if(recording){recorded=[];recordedFrames=0;msg('Recording spatial room')}else msg(`Recording stopped · ${recorded.length} frames`);stats()};$('w').onclick=()=>{if(!recorded.length)return msg('Nothing recorded yet');try{localStorage.setItem(KEY,JSON.stringify({version:2,created:Date.now(),frames:recorded}));msg(`Saved spatial recording · ${recorded.length} frames`)}catch(e){msg('Save failed: '+e.message)}};$('e').onclick=()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(!d?.frames?.length)return msg('No saved spatial recording');recorded=d.frames;recordedFrames=recorded.length;replaying=true;playing=0;msg(`Replaying saved room · ${recorded.length} frames`);renderPacket(recorded[0].meshes)}catch(e){msg('Replay failed: '+e.message)}};$('x').onclick=()=>{recorded=[];recordedFrames=0;replaying=false;playing=0;clearRoom();msg('Spatial recording cleared');stats()};$('p').onclick=()=>{const u=new URL('HyperStream_Phone.html',location.href);$('code').innerHTML='';if(window.QRCode)new QRCode($('code'),{text:u.href,width:220,height:220});else $('code').textContent=u.href;$('q').style.display='grid'};$('close').onclick=()=>$('q').style.display='none';function replayTick(t){if(!replaying||!recorded.length)return;if(!replayTick.start)replayTick.start=t;const elapsed=(t-replayTick.start)/1000;const idx=Math.floor(elapsed*12)%recorded.length;renderPacket(recorded[idx].meshes)}R.setAnimationLoop((t,f)=>{if(ses&&f){if(mapping){if(recording)recordFrame(f);else{const packet=capture(f);if(packet.length)renderPacket(packet)}stats()}}if(replaying)replayTick(t);R.render(S,C)});addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});stats()</script></body></html>
