<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>HyperStream</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02050a;color:#fff;font:14px system-ui}#app{position:fixed;inset:0}#ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:9px;border:1px solid #ffffff22;border-radius:14px;background:#071019ee;backdrop-filter:blur(10px)}button{margin:2px;padding:8px 10px;border:0;border-radius:8px;background:#1473bd;color:#fff;font-weight:700}#qr{display:none;position:fixed;z-index:9;inset:0;place-items:center;background:#000d}.card{background:#0b1620;padding:20px;border-radius:16px;text-align:center}.small{font-size:11px;color:#9eb4c6}</style></head><body><div id=app></div><div id=ui><b id=s>HyperStream ready</b><div><button id=v>VR</button><button id=m>Map</button><button id=r>Record</button><button id=w>Save</button><button id=e>Enter</button><button id=x>Clear</button><button id=q>Phone QR</button></div><div id=t class=small>0 cells · hologram ready</div></div><div id=qr><div class=card><div id=code></div><p>Scan to control HyperStream</p><button id=close>Close</button></div></div><script src=https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js></script><script type=module>import*as T from'https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js';const $=i=>document.getElementById(i),S=new T.Scene(),C=new T.PerspectiveCamera(70,innerWidth/innerHeight,.03,100),R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,1.5));R.setSize(innerWidth,innerHeight);R.xr.enabled=true;$('app').append(R.domElement);S.background=new T.Color(0x02050a);S.add(new T.HemisphereLight(0xc9efff,0x081018,1.5));C.position.set(0,1.6,4);const world=new T.Group;S.add(world);const grid=new T.GridHelper(12,24,0x17627c,0x0a2835);S.add(grid);let cells=[],map=false,rec=false,frames=0;const KEY='HS_WORLD_V3';function add(x,y,z){const k=[Math.round(x/.18),Math.round(y/.18),Math.round(z/.18)].join(','),o=cells.find(a=>a.k===k);if(o)o.h++;else if(cells.length<5000)cells.push({k,x,y,z,h:1})}function rebuild(){while(world.children.length)world.remove(world.children[0]);for(const o of cells){const q=Math.min(1,.35+o.h*.08),m=new T.Mesh(new T.BoxGeometry(.16,.16,.16),new T.MeshBasicMaterial({color:new T.Color(.08,.55+.3*q,.9),transparent:true,opacity:.45+.4*q}));m.position.set(o.x,o.y,o.z);world.add(m)}}function scan(){if(!map)return;for(let i=0;i<30;i++){const a=Math.random()*Math.PI*2,r=1+Math.random()*3.5;add(Math.cos(a)*r,.1+Math.random()*2.7,Math.sin(a)*r)}frames++;rebuild();stats()}function stats(){$('t').textContent=`${cells.length} cells · ${frames} frames · ${rec?'RECORDING':'ready'}`}$('m').onclick=()=>{map=!map;$('m').textContent=map?'Map ON':'Map';$('s').textContent=map?'Spatial capture active':'Spatial capture paused';if(map)scan()};$('r').onclick=()=>{rec=!rec;$('r').textContent=rec?'Stop':'Record';$('s').textContent=rec?'Recording hologram':'Recording stopped';stats()};$('w').onclick=()=>{localStorage[KEY]=JSON.stringify({cells,frames});$('s').textContent=`Saved ${cells.length} cells`};$('e').onclick=()=>{try{const d=JSON.parse(localStorage[KEY]);cells=d.cells||[];frames=d.frames||0;rebuild();stats();$('s').textContent=`Entered hologram · ${cells.length} cells`}catch{$('s').textContent='No saved hologram'}};$('x').onclick=()=>{cells=[];frames=0;rebuild();stats();$('s').textContent='World cleared'};$('v').onclick=async()=>{if(!navigator.xr){$('s').textContent='WebXR unavailable';return}try{const z=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});await R.xr.setSession(z);$('s').textContent='VR active · hologram visible';z.onend=()=>$('s').textContent='VR ended'}catch(e){$('s').textContent='VR failed: '+e.message}};$('q').onclick=()=>{const u=new URL('HyperStream_Phone.html',location.href);$('code').innerHTML='';if(window.QRCode)new QRCode($('code'),{text:u.href,width:220,height:220});$('qr').style.display='grid'};$('close').onclick=()=>$('qr').style.display='none';addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});R.setAnimationLoop(()=>{if(map)scan();R.render(S,C)});rebuild();stats();</script></body></html>
