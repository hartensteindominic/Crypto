<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>HyperStream Room Mapper</title><style>*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a;color:#eef7ff;font:14px system-ui}#ui{position:fixed;z-index:5;left:10px;right:10px;bottom:10px;padding:9px;border:1px solid #ffffff22;border-radius:14px;background:#071019ee;backdrop-filter:blur(10px)}button{margin:2px;padding:8px 10px;border:0;border-radius:8px;background:#1473bd;color:#fff;font-weight:700}.small{font-size:11px;color:#9eb4c6}#qr{display:none;position:fixed;z-index:9;inset:0;place-items:center;background:#000d}.card{background:#0b1620;padding:20px;border-radius:16px;text-align:center}</style></head><body><div id=app></div><div id=ui><b id=s>HyperStream room mapper ready</b><div><button id=v>VR / Room</button><button id=m>Map</button><button id=r>Record</button><button id=w>Save</button><button id=e>Enter</button><button id=x>Clear</button><button id=q>Phone QR</button></div><div id=t class=small>Real room data: waiting · Mesh 0 · Planes 0 · Boundary 0 · Frames 0</div></div><div id=qr><div class=card><div id=code></div><p>Scan to control HyperStream</p><button id=close>Close</button></div></div><script src=https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js></script><script type=module>import*as T from'https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js';const $=i=>document.getElementById(i),S=new T.Scene(),C=new T.PerspectiveCamera(70,innerWidth/innerHeight,.02,100),R=new T.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});R.setPixelRatio(Math.min(devicePixelRatio,1.5));R.setSize(innerWidth,innerHeight);R.xr.enabled=true;$('app').append(R.domElement);S.background=new T.Color(0x02050a);S.add(new T.HemisphereLight(0xc9efff,0x081018,1.7));const room=new T.Group();S.add(room);let session=null,ref=null,mapping=false,recording=false,frames=0,meshCount=0,planeCount=0,boundaryCount=0,objects=new Map(),history=[],savedKey='HS_REAL_ROOM_V1';const material=new T.MeshStandardMaterial({color:0x35bde8,transparent:true,opacity:.28,side:T.DoubleSide,roughness:1,metalness:0});const planeMat=new T.MeshStandardMaterial({color:0x49e0a4,transparent:true,opacity:.22,side:T.DoubleSide,roughness:1});function status(x){$('s').textContent=x}function stats(){ $('t').textContent=`Real room data: ${session?'LIVE':'waiting'} · Mesh ${meshCount} · Planes ${planeCount} · Boundary ${boundaryCount} · Frames ${frames}${recording?' · RECORDING':''}`}function clearRoom(){while(room.children.length)room.remove(room.children[0]);objects.clear();meshCount=planeCount=boundaryCount=0}function matrixFromTransform(t){return new T.Matrix4().fromArray(t.matrix)}function renderMesh(m){try{if(!m.meshSpace||!m.positions||!m.indices)return;let id=m.meshSpace,old=objects.get(id);let pos=m.positions,idx=m.indices;if(!old){let g=new T.BufferGeometry();let a=new Float32Array(pos.length*3);for(let i=0;i<pos.length;i++){let p=pos[i];a[i*3]=p.x??p[0]??0;a[i*3+1]=p.y??p[1]??0;a[i*3+2]=p.z??p[2]??0}g.setAttribute('position',new T.BufferAttribute(a,3));if(idx){let ii=new Uint32Array(idx.length);for(let i=0;i<idx.length;i++)ii[i]=idx[i];g.setIndex(new T.BufferAttribute(ii,1))}g.computeVertexNormals();old=new T.Mesh(g,material.clone());room.add(old);objects.set(id,old)}let p=m.meshSpace;if(p&&p.getPose&&ref){let pose=p.getPose(ref);if(pose)old.matrix.fromArray(pose.transform.matrix),old.matrixAutoUpdate=false}}catch(e){console.warn('mesh',e)}}function renderPlane(p){try{let poly=p.polygon;if(!poly||poly.length<3)return;let id=p.planeSpace,old=objects.get(id),shape=[];for(const v of poly)shape.push(new T.Vector2(v.x??v[0]??0,v.z??v[2]??0));if(!old){let sh=new T.Shape(shape),g=new T.ShapeGeometry(sh),mesh=new T.Mesh(g,planeMat.clone());room.add(mesh);objects.set(id,mesh);old=mesh}if(p.planeSpace&&p.planeSpace.getPose&&ref){let pose=p.planeSpace.getPose(ref);if(pose){old.position.setFromMatrixPosition(new T.Matrix4().fromArray(pose.transform.matrix));old.quaternion.setFromRotationMatrix(new T.Matrix4().fromArray(pose.transform.matrix))}}}catch(e){console.warn('plane',e)}}function drawBoundary(){if(!ref||!ref.boundsGeometry)return;for(const o of room.children)if(o.userData.boundary)o.parent.remove(o);const pts=ref.boundsGeometry;if(!pts.length)return;const g=new T.BufferGeometry().setFromPoints(pts.map(p=>new T.Vector3(p.x,.01,p.z)));const line=new T.LineLoop(g,new T.LineBasicMaterial({color:0x1688ad,transparent:true,opacity:.55}));line.userData.boundary=true;room.add(line);boundaryCount=pts.length}function xrFrame(time,frame){if(!session||!ref)return;frames++;let meshes=frame.detectedMeshes;let planes=frame.detectedPlanes;if(mapping&&meshes){meshCount=meshes.size??meshes.length??0;for(const m of meshes)renderMesh(m)}if(mapping&&planes){planeCount=planes.size??planes.length??0;for(const p of planes)renderPlane(p)}drawBoundary();if(recording&&frames%10===0)history.push({t:Date.now(),mesh:meshCount,planes:planeCount});stats()}$('v').onclick=async()=>{if(!navigator.xr)return status('WebXR unavailable in this browser');try{const supported=await navigator.xr.isSessionSupported('immersive-vr');if(!supported)return status('Immersive VR unavailable');session=await navigator.xr.requestSession('immersive-vr',{requiredFeatures:['local-floor'],optionalFeatures:['bounded-floor','plane-detection','mesh-detection']});await R.xr.setSession(session);ref=await session.requestReferenceSpace('local-floor');try{const bounded=await session.requestReferenceSpace('bounded-floor');ref=bounded;drawBoundary()}catch{}status('Quest VR connected · waiting for real room geometry');session.addEventListener('end',()=>{session=null;ref=null;status('VR ended · saved room retained');stats()})}catch(e){session=null;status('VR failed: '+e.message)}};$('m').onclick=()=>{mapping=!mapping;status(mapping?(session?'Mapping real Quest geometry':'Map armed · enter VR to receive room data'):'Mapping paused');stats()};$('r').onclick=()=>{recording=!recording;$('r').textContent=recording?'Stop':'Record';status(recording?'Recording spatial room':'Recording stopped');stats()};$('w').onclick=()=>{try{localStorage[savedKey]=JSON.stringify({v:1,history,frames,meshCount,planeCount,boundaryCount});status('Spatial session saved')}catch{status('Save failed')}};$('e').onclick=()=>{try{let d=JSON.parse(localStorage[savedKey]);history=d.history||[];frames=d.frames||0;meshCount=d.meshCount||0;planeCount=d.planeCount||0;boundaryCount=d.boundaryCount||0;status('Saved session loaded · reconnect VR for live geometry');stats()}catch{status('No saved spatial session')}};$('x').onclick=()=>{clearRoom();history=[];frames=0;status('Room model cleared');stats()};$('q').onclick=()=>{const u=new URL('HyperStream_Phone.html',location.href);$('code').innerHTML='';if(window.QRCode)new QRCode($('code'),{text:u.href,width:220,height:220});$('qr').style.display='grid'};$('close').onclick=()=>$('qr').style.display='none';addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});R.setAnimationLoop((t,f)=>{if(f)xrFrame(t,f);R.render(S,C)});stats();</script></body></html>
