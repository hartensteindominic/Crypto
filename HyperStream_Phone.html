<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>HyperStream Phone Controller</title><style>*{box-sizing:border-box}body{margin:0;background:#050a10;color:#eef7ff;font:16px system-ui;text-align:center;padding:20px}main{max-width:520px;margin:auto}h1{font-size:24px}button,input{width:100%;padding:16px;margin:6px 0;border:0;border-radius:14px;font-size:17px}button{background:#126bb7;color:white;font-weight:800}button:active{transform:scale(.98)}input{background:#111b25;color:#fff}#s{padding:12px;border-radius:12px;background:#0b1721;color:#9edcff;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style><main><h1>🥽 HyperStream Remote</h1><div id=s>Connect phone → control Quest</div><input id=u placeholder="ws://YOUR-RELAY-IP:8787"><button id=c>Connect</button><div class=grid><button data-cmd=vr>VR</button><button data-cmd=map>Map</button><button data-cmd=record>Record</button><button data-cmd=save>Save</button><button data-cmd=enter>Enter World</button><button data-cmd=clear>Clear</button></div><button data-cmd=stop>Stop / Pause</button></main><script>const $=x=>document.getElementById(x),q=new URLSearchParams(location.search),ws0=q.get('ws'),W={};if(ws0)$('u').value=ws0;let w=null;$('c').onclick=()=>{try{w?.close();w=new WebSocket($('u').value.trim());w.onopen=()=>{$('s').textContent='🟢 Phone connected · Quest remote ready';w.send(JSON.stringify({type:'controller-hello',role:'phone',time:Date.now()}))};w.onclose=()=>$('s').textContent='🔴 Disconnected';w.onerror=()=>$('s').textContent='⚠️ Connection failed';w.onmessage=e=>{try{let d=JSON.parse(e.data);if(d.type==='controller-state')$('s').textContent='🥽 '+(d.text||'Quest updated')}catch{}}}catch(e){$('s').textContent=e.message)}};document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{if(!w||w.readyState!==1)return $('s').textContent='Connect phone first';let cmd=b.dataset.cmd;w.send(JSON.stringify({type:'controller-command',command:cmd,time:Date.now()}));$('s').textContent='Sending: '+cmd});if(ws0)setTimeout(()=>$('c').click(),300)</script>
